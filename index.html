  return { left:!!g.left&&v.left>0, right:!!g.right&&v.right>0 };
}
function eggVisualRand(b,k=0){
  const base=((b.col|0)+1)*97 + (((b.visualVariant||0)+1)*53) + (k+1)*71;
  const v=Math.sin(base*12.9898 + k*78.233)*43758.5453123;
  return v-Math.floor(v);
}
function eggCrackVariant(b){ return ((b.col|0)+((b.visualVariant||0)*3))%6; }
function eggCrackLine(points){
  if(!points.length) return;
  ctx.beginPath(); ctx.moveTo(points[0][0],points[0][1]);
  for(let i=1;i<points.length;i++) ctx.lineTo(points[i][0],points[i][1]);
  ctx.stroke();
}
function drawVectorEgg(b,px,py){
  const s=clamp(b.growthState|0,1,4);
  const egg=bigBirdEggDims(s);
  const rx=egg.rx, ry=egg.ry;
  const wobblePhase=((b.phase|0)&7)*0.36+b.col*0.29;
  const points=[], count=40;
  for(let i=0;i<=count;i++){
    const a=(i/count)*Math.PI*2;
    const shape=0.88-0.12*Math.cos(a);
    const wobble=1+0.018*Math.sin(a*3+wobblePhase)+0.012*Math.sin(a*5-wobblePhase*0.7);
    points.push({x:Math.sin(a)*rx*shape*wobble,y:-Math.cos(a)*ry*wobble});
  }
  ctx.save(); ctx.translate(px,py); ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.lineWidth=0.58; ctx.strokeStyle='#ffffff';
  ctx.beginPath();
  if(s<4){
    ctx.moveTo(points[0].x,points[0].y);
    for(let i=1;i<points.length;i++) ctx.lineTo(points[i].x,points[i].y);
  }else{
    const gap=3; ctx.moveTo(points[gap].x,points[gap].y);
    for(let i=gap+1;i<=count-gap;i++) ctx.lineTo(points[i].x,points[i].y);
  }
  ctx.stroke();

  // Six deliberately different fracture families. These are not tiny jittered
  // versions of one crack: neighbouring eggs can have a vertical lightning
  // split, strong diagonal, fork, side-entry crack, etc.
  ctx.strokeStyle='#ffffff'; ctx.lineWidth=0.52;
  const v=eggCrackVariant(b);
  const J=(k,m)=>((eggVisualRand(b,k)-0.5)*m);
  let main=[], branches=[], rim=[];
  switch(v){
    case 0: // central lightning zig-zag
      main=[[-.12*rx,-.82*ry],[.22*rx,-.52*ry],[-.16*rx,-.25*ry],[.18*rx,.05*ry],[-.08*rx,.38*ry]];
      branches=[[[.18*rx,.05*ry],[.52*rx,.20*ry]], [[-.16*rx,-.25*ry],[-.48*rx,-.08*ry]]];
      rim=[[[-.42*rx,-.78*ry],[-.12*rx,-.98*ry]], [[.18*rx,-.98*ry],[.50*rx,-.72*ry]]];
      break;
    case 1: // hard top-left to lower-right diagonal
      main=[[-.58*rx,-.68*ry],[-.28*rx,-.45*ry],[.05*rx,-.18*ry],[.42*rx,.08*ry],[.26*rx,.40*ry]];
      branches=[[[.05*rx,-.18*ry],[-.28*rx,.06*ry]], [[.42*rx,.08*ry],[.60*rx,.28*ry]]];
      rim=[[[-.72*rx,-.56*ry],[-.58*rx,-.68*ry]], [[.16*rx,-.96*ry],[.48*rx,-.78*ry]]];
      break;
    case 2: // Y fork from crown
      main=[[0,-.90*ry],[-.08*rx,-.58*ry],[.08*rx,-.28*ry],[0,.12*ry],[-.22*rx,.42*ry]];
      branches=[[[.08*rx,-.28*ry],[.52*rx,-.10*ry]], [[-.08*rx,-.58*ry],[-.44*rx,-.38*ry]]];
      rim=[[[-.18*rx,-.98*ry],[-.02*rx,-.90*ry]], [[.02*rx,-.90*ry],[.28*rx,-.98*ry]]];
      break;
    case 3: // right-side entry, sweeping down left
      main=[[.72*rx,-.52*ry],[.38*rx,-.38*ry],[.08*rx,-.12*ry],[-.34*rx,.10*ry],[-.18*rx,.44*ry]];
      branches=[[[.08*rx,-.12*ry],[.36*rx,.16*ry]], [[-.34*rx,.10*ry],[-.60*rx,.28*ry]]];
      rim=[[[.42*rx,-.82*ry],[.72*rx,-.52*ry]], [[-.34*rx,-.96*ry],[-.10*rx,-.76*ry]]];
      break;
    case 4: // left-side entry with deep vertical branch
      main=[[-.72*rx,-.18*ry],[-.40*rx,-.10*ry],[-.08*rx,.04*ry],[.24*rx,.14*ry],[.12*rx,.48*ry]];
      branches=[[[-.08*rx,.04*ry],[.02*rx,-.42*ry]], [[.24*rx,.14*ry],[.54*rx,.32*ry]]];
      rim=[[[-.58*rx,-.72*ry],[-.34*rx,-.96*ry]], [[.10*rx,-.96*ry],[.30*rx,-.76*ry]]];
      break;
    default: // broad forked diagonal
      main=[[-.42*rx,-.74*ry],[-.12*rx,-.46*ry],[.26*rx,-.24*ry],[.02*rx,.02*ry],[.40*rx,.34*ry]];
      branches=[[[.26*rx,-.24*ry],[.60*rx,-.38*ry]], [[.02*rx,.02*ry],[-.42*rx,.24*ry]]];
      rim=[[[-.58*rx,-.84*ry],[-.42*rx,-.74*ry]], [[.34*rx,-.92*ry],[.60*rx,-.70*ry]]];
      break;
  }
  // Small per-egg offsets keep repeats of a family from overlaying exactly.
  const dx=J(0,.10*rx), dy=J(1,.06*ry);
  const movePts=pts=>pts.map(p=>[p[0]+dx,p[1]+dy]);
  if(s>=2) eggCrackLine(movePts(main.slice(0,3)));
  if(s>=3){ eggCrackLine(movePts(main)); for(const br of branches) eggCrackLine(movePts(br)); }
  if(s>=4) for(const rr of rim) eggCrackLine(movePts(rr));
  ctx.restore();
}

/* Bird rendering now uses the authored vector-bird assets as the visual
   language while leaving the Phoenix mechanics untouched.  The game's own
   movement/choreography still comes entirely from the reconstructed ROM
   logic; we only borrow the geometry/pose system and fit it into Phoenix's
   logical sprite boxes. */
/* ---------- outline glyph helpers ---------- */
function gLerpPts(a,b,t){ return a.map((p,i)=>[p[0]+(b[i][0]-p[0])*t, p[1]+(b[i][1]-p[1])*t]); }
function gMirror(pts){ return pts.map(p=>[-p[0],p[1]]); }
function gTrace(pts,close){
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  if(close!==false) ctx.closePath();
}
function gShape(pts,stroke,mask){ gTrace(pts,true); ctx.fillStyle=mask; ctx.fill(); ctx.strokeStyle=stroke; ctx.stroke(); }
function gLine(pts,stroke){ gTrace(pts,false); ctx.strokeStyle=stroke; ctx.stroke(); }

/* ---------- small birds: organic audition-derived outline model ----------
   Visual geometry only. Phoenix movement/choreography, ghost-flight, attack
   scheduling, collision envelopes, scoring and bomb logic remain unchanged.
   Head up (-y). Right-wing geometry is authored once and mirrored. */
const SMALL_BIRD_MODEL='B';

function smallQuad(p0,c,p1,n){
  const out=[];
  for(let i=1;i<=n;i++){
    const t=i/n,u=1-t;
    out.push([
      u*u*p0[0]+2*u*t*c[0]+t*t*p1[0],
      u*u*p0[1]+2*u*t*c[1]+t*t*p1[1]
    ]);
  }
  return out;
}
function smallMid(a,b){ return [(a[0]+b[0])*0.5,(a[1]+b[1])*0.5]; }
function smallAdd(a,v,k){ return [a[0]+v[0]*k,a[1]+v[1]*k]; }

const SMALL_BIRD_BODY=(function(){
  let r=[[0,-5.3]];
  const q=(c,p,n)=>{ r=r.concat(smallQuad(r[r.length-1],c,p,n)); };
  q([1.55,-5.2],[1.35,-3.3],8);
  q([1.2,-2.6],[1.25,-2.3],4);
  q([2.3,-0.6],[1.6,1.8],10);
  q([1.2,3],[0.9,3.6],5);
  q([1.6,4.8],[2,6.1],6);
  q([1.3,5.6],[0.8,5.2],4);
  q([0.5,6.2],[0,6.7],5);
  const left=r.slice(1,-1).reverse().map(p=>[-p[0],p[1]]);
  return r.concat(left).map(p=>[p[0]*1.08,p[1]*0.86]);
})();
const SMALL_BIRD_BEAK=[[-0.42,-2.85],[0.42,-2.85],[0,-1.95]];
const SMALL_BIRD_EYES=[[-0.68,-3.55],[0.68,-3.55]];
const SMALL_BIRD_EYE_R=0.27;
const SMALL_BIRD_WING_S=[1.8,-1.6], SMALL_BIRD_WING_R=[1.9,2.0];

function smallCrescent(angle,length,sweep){
  const d=angle*Math.PI/180, td=(angle+sweep)*Math.PI/180;
  const S=SMALL_BIRD_WING_S, R=SMALL_BIRD_WING_R;
  const tip=[S[0]+Math.cos(td)*length,S[1]+Math.sin(td)*length];
  const leadControl=[
    S[0]+Math.cos((angle-16)*Math.PI/180)*length*0.6,
    S[1]+Math.sin((angle-16)*Math.PI/180)*length*0.6
  ];
  const normal=[Math.cos(d+Math.PI/2),Math.sin(d+Math.PI/2)];
  const trailControl=smallAdd(smallMid(tip,R),normal,-0.9);
  return [S].concat(
    smallQuad(S,leadControl,tip,16),
    smallQuad(tip,trailControl,R,16)
  );
}

const SMALL_BIRD_MARCH_OPEN=[[1.6,-1.5],[3.6,-4.4],[5.8,-1.8],[6.4,2.2],[5.6,6.6],[4,4.4],[2.2,2.6],[1.8,1.2]];
const SMALL_BIRD_MARCH_CLOSED=[[1.6,-1.5],[3,-4],[4.8,-1.6],[5.2,2.4],[4.4,6.8],[3.4,4.4],[2.2,2.6],[1.8,1.2]];
const SMALL_BIRD_MARCH_SHARP=new Set([0,4,7]);
function smallSmoothClosed(points){
  const n=points.length;
  let out=[smallMid(points[n-1],points[0])];
  for(let i=0;i<n;i++){
    if(SMALL_BIRD_MARCH_SHARP.has(i)){
      out.push(points[i]);
      out.push(smallMid(points[i],points[(i+1)%n]));
    }else{
      out=out.concat(smallQuad(out[out.length-1],points[i],smallMid(points[i],points[(i+1)%n]),8));
    }
  }
  // Start the closed silhouette at its upper body root. This keeps the
  // existing march/flight pose interpolation spatially stable.
  let root=0,best=Infinity;
  for(let i=0;i<out.length;i++){
    const dx=out[i][0]-points[0][0],dy=out[i][1]-points[0][1],d=dx*dx+dy*dy;
    if(d<best){ best=d; root=i; }
  }
  return out.slice(root).concat(out.slice(0,root));
}

const SMALL_BIRD_MODELS={
  B:{
    body:SMALL_BIRD_BODY,
    beak:SMALL_BIRD_BEAK,
    eyes:SMALL_BIRD_EYES,
    eyeR:SMALL_BIRD_EYE_R,
    // Crescents match the audition's flap vocabulary.
    up:smallCrescent(-38,9,20),
    level:smallCrescent(-4,9,20),
    down:smallCrescent(30,9,20),
    // Dive remains deliberately open-winged: 40..48 degrees, never a dart.
    diveOpen:smallCrescent(40,8.5,22),
    diveFlex:smallCrescent(48,8.5,22),
    // Separate folded/cape-like marching silhouette from the audition.
    marchOpen:smallSmoothClosed(SMALL_BIRD_MARCH_OPEN),
    marchClosed:smallSmoothClosed(SMALL_BIRD_MARCH_CLOSED),
    hip:[0.75,3.2], footX:1.1, ground:7.0
  }
};

function smallModel(){ return SMALL_BIRD_MODELS[SMALL_BIRD_MODEL]||SMALL_BIRD_MODELS.B; }
function smallSmooth(x){ return x*x*(3-2*x); }
// cycles elapsed, with a small per-column offset so the flock ripples
function smallClock(b,t,period){ return t/period + (b.col|0)*0.045; }
function smallFlapWing(m,cycles){
  const seq=[m.up,m.level,m.down,m.level];
  const x=(((cycles%1)+1)%1)*4, i=Math.floor(x);
  return gLerpPts(seq[i],seq[(i+1)%4],smallSmooth(x-i));
}

function smallPoseDominant(weights){
  let best='march', value=-1;
  for(const k of ['march','flight','dive']){
    const v=(weights&&weights[k])||0;
    if(v>value){ value=v; best=k; }
  }
  return best;
}
function desiredSmallVisualPose(b){
  if(b.entryFlying) return 'flight';
  const inFormation=b.state==='formation' && b.patternKind==='base';
  if(inFormation) return 'march';
  const vy=flightActive(b) ? (b.flyVY||0) : (b.visualMoveDY||0)*60;
  if(b.patternKind==='attack' && vy>15) return 'dive';
  return 'flight';
}
function desiredSmallVisualRotation(b,pose){
  if(b.entryFlying) return b.entryRotation||0;
  if(pose==='march') return 0;
  if(b.patternKind==='attack'){
    const ang=flightActive(b) ? (b.flyAng||0) : (b.angle||0);
    return ang+Math.PI/2;
  }
  return 0;
}
function currentSmallVisualBank(b){
  const inFormation=b.state==='formation' && b.patternKind==='base';
  return (!inFormation && b.patternKind==='attack' && flightActive(b)) ? (b.flyBank||0) : 0;
}
function angleDelta(a,b){
  let d=(b-a)%(Math.PI*2);
  if(d>Math.PI) d-=Math.PI*2;
  if(d<-Math.PI) d+=Math.PI*2;
  return d;
}
function initSmallVisualState(b,pose){
  pose=pose||desiredSmallVisualPose(b);
  b.visualPoseWeights={march:0,flight:0,dive:0};
  b.visualPoseWeights[pose]=1;
  b.visualPoseTarget=pose;
  b.visualRequestedPose=pose;
  b.visualPoseBridge=null;
  b.visualRotation=desiredSmallVisualRotation(b,pose);
}
function stepSmallVisualBird(b){
  if(!b.visualPoseWeights) initSmallVisualState(b);
  const requested=desiredSmallVisualPose(b);
  const dominant=smallPoseDominant(b.visualPoseWeights);
  if(b.visualRequestedPose!==requested){
    b.visualRequestedPose=requested;
    b.visualPoseBridge=null;
    if(requested==='dive' && dominant==='march'){
      b.visualPoseTarget='flight'; b.visualPoseBridge='dive';
    }else if(requested==='march' && dominant==='dive'){
      b.visualPoseTarget='flight'; b.visualPoseBridge='march';
    }else{
      b.visualPoseTarget=requested;
    }
  }
  if(b.visualPoseBridge && b.visualPoseTarget==='flight' && (b.visualPoseWeights.flight||0)>=0.78){
    b.visualPoseTarget=b.visualPoseBridge;
    b.visualPoseBridge=null;
  }
  const target=b.visualPoseTarget||requested;
  const w=b.visualPoseWeights;
  const frames=(target==='dive'||dominant==='dive')?8:13;
  const oldT=w[target]||0;
  if(oldT<0.999){
    const newT=Math.min(1,oldT+1/frames);
    const scale=(1-newT)/Math.max(1e-6,1-oldT);
    for(const k of ['march','flight','dive']) if(k!==target) w[k]=(w[k]||0)*scale;
    w[target]=newT;
  }else{
    for(const k of ['march','flight','dive']) w[k]=(k===target?1:0);
  }
  const rotTarget=desiredSmallVisualRotation(b,target);
  const rotRate=target==='march'?0.26:0.34;
  b.visualRotation=(b.visualRotation||0)+angleDelta(b.visualRotation||0,rotTarget)*rotRate;
  if(Math.abs(angleDelta(b.visualRotation||0,rotTarget))<0.004) b.visualRotation=rotTarget;
}
function stepSmallVisualFormation(f){
  if(!f) return;
  for(const b of f.birds) if(b.alive) stepSmallVisualBird(b);
}
function resamplePolyline(points,count){
  if(!points||points.length<2) return points||[];
  const dist=[0]; let total=0;
  for(let i=1;i<points.length;i++){
    total+=Math.hypot(points[i][0]-points[i-1][0],points[i][1]-points[i-1][1]);
    dist.push(total);
  }
  if(total<=1e-6) return Array.from({length:count},()=>[points[0][0],points[0][1]]);
  const out=[]; let seg=1;
  for(let n=0;n<count;n++){
    const target=total*n/(count-1);
    while(seg<dist.length-1 && dist[seg]<target) seg++;
    const d0=dist[seg-1], d1=dist[seg], span=Math.max(1e-6,d1-d0);
    const t=(target-d0)/span;
    const a=points[seg-1], b=points[seg];
    out.push([lerp(a[0],b[0],t),lerp(a[1],b[1],t)]);
  }
  return out;
}
function smallPoseWingPoints(m,b,t,pose){
  if(pose==='march'){
    const cyc=2*Math.PI*smallClock(b,t,880);
    const breath=0.5-0.5*Math.cos(cyc);
    return gLerpPts(m.marchOpen,m.marchClosed,breath);
  }
  if(pose==='dive'){
    const q=0.5+0.5*Math.sin(2*Math.PI*smallClock(b,t,380));
    return gLerpPts(m.diveOpen,m.diveFlex,q);
  }
  return smallFlapWing(m,smallClock(b,t,320));
}
function drawSmallTransitionLegs(m,pal,b,t,amount){
  if(amount<=0.01) return;
  const cyc=2*Math.PI*smallClock(b,t,880);
  const s=Math.sin(cyc);
  const gait=smallSmooth(clamp((amount-0.72)/0.28,0,1));
  const deploy=smallSmooth(clamp(amount/0.72,0,1));
  ctx.save(); ctx.globalAlpha*=Math.min(1,0.25+amount*0.75);
  ctx.lineWidth=0.62;
  for(const d of [-1,1]){
    const lift=smallSmooth(Math.max(0,d*s))*gait;
    const hx=d*m.hip[0], hy=m.hip[1];
    const fx=d*(m.footX+0.2-0.5*lift), ground=m.ground-2.6*lift;
    const fy=lerp(hy+0.8,ground,deploy);
    const kx=d*(m.footX+0.5+1.3*lift)*deploy;
    const ky=(hy+fy)/2-0.6*deploy-1.1*lift;
    gLine([[hx,hy],[kx,ky],[fx,fy]],pal.body);
    if(deploy>0.45){
      const toe=(deploy-0.45)/0.55;
      const drop=0.2+(0.55+0.9*lift)*0.4;
      gLine([[lerp(fx,fx-d*0.9,toe),lerp(fy,fy+drop,toe)],[fx,fy],[lerp(fx,fx+d*0.9,toe),lerp(fy,fy+drop,toe)]],pal.body);
    }
  }
  ctx.restore();
}
function drawSmallVisualBlend(cx,cy,pal,b,t){
  const w=b.visualPoseWeights||{march:0,flight:1,dive:0};
  const dominant=smallPoseDominant(w);
  const bank=currentSmallVisualBank(b)*(1-(w.march||0));
  if((w[dominant]||0)>0.995){
    if(dominant==='march') return drawSmallMarch(cx,cy,pal,b,t);
    if(dominant==='dive') return drawSmallDive(cx,cy,pal,b,t,b.visualRotation||0,bank);
    return drawSmallFlight(cx,cy,pal,b,t,b.visualRotation||0,bank);
  }
  const m=smallModel(), n=28;
  const poses={};
  for(const pose of ['march','flight','dive']) poses[pose]=resamplePolyline(smallPoseWingPoints(m,b,t,pose),n);
  const blend=[];
  for(let i=0;i<n;i++){
    let x=0,y=0;
    for(const pose of ['march','flight','dive']){
      const wt=w[pose]||0;
      x+=poses[pose][i][0]*wt; y+=poses[pose][i][1]*wt;
    }
    blend.push([x,y]);
  }
  smallBegin(cx,cy,b.visualRotation||0,bank);
  const accentAmount=clamp((w.flight||0)+(w.dive||0),0,1);
  for(const ww of [blend,gMirror(blend)]){
    ctx.lineWidth=0.72; gShape(ww,pal.wing,pal.mask);
    if(accentAmount>0.04){
      ctx.save(); ctx.globalAlpha*=accentAmount;
      ctx.lineWidth=0.45; gLine(smallWingAccent(ww),pal.body);
      ctx.restore();
    }
  }
  smallDrawBody(m,pal,(w.flight||0)+(w.dive||0)>0.35);
  drawSmallTransitionLegs(m,pal,b,t,w.march||0);
  ctx.restore();
}
function smallBegin(cx,cy,rotation,bank){
  ctx.save(); ctx.translate(cx,cy);
  if(rotation) ctx.rotate(rotation);
  if(bank) ctx.scale(1-bank,1);
  ctx.lineJoin='round'; ctx.lineCap='round';
}
function smallWingAccent(w){
  if(!w||w.length<8) return w||[];
  const half=Math.floor((w.length-1)/2);
  const innerCount=Math.max(1,w.length-half-1);
  const out=[];
  for(const f of [0.06,0.20,0.36,0.52]){
    const oi=Math.min(half,1+Math.round(Math.max(0,half-1)*f));
    const ii=Math.min(w.length-1,half+1+Math.round(Math.max(0,innerCount-1)*(1-f)));
    const a=w[oi],b=w[ii];
    out.push([a[0]*0.68+b[0]*0.32,a[1]*0.68+b[1]*0.32]);
  }
  return out;
}
function smallDrawWings(w,showAccent,pal){
  for(const ww of [w,gMirror(w)]){
    ctx.lineWidth=0.72; gShape(ww,pal.wing,pal.mask);
    if(showAccent){
      ctx.lineWidth=0.45; gLine(smallWingAccent(ww),pal.body);
    }
  }
}
function smallDrawBody(m,pal,withTail){
  // The audition body is intentionally rounder and more organic. It remains
  // a black masking fill with coloured outline, just like the rest of the game.
  ctx.lineWidth=0.72; gShape(m.body,pal.body,pal.mask);
  ctx.lineWidth=0.5; gShape(m.beak,pal.wing,pal.mask);
  ctx.fillStyle=pal.eye;
  for(const e of m.eyes){
    ctx.beginPath(); ctx.arc(e[0],e[1],m.eyeR,0,Math.PI*2); ctx.fill();
  }
}

function drawSmallMarch(cx,cy,pal,b,t){
  const m=smallModel();
  const cyc=2*Math.PI*smallClock(b,t,880);
  const breath=0.5-0.5*Math.cos(cyc);   // 0 = semi-open wings, 1 = closed
  const s=Math.sin(cyc);                // right leg up on +s, left on -s
  const bob=-0.8*Math.abs(s);           // body rises with a raised leg, drops on the stamp
  smallBegin(cx,cy,0);
  ctx.save(); ctx.translate(0,bob);
  smallDrawWings(gLerpPts(m.marchOpen,m.marchClosed,breath),false,pal);
  smallDrawBody(m,pal,false);
  ctx.restore();
  // legs in ground space: audition geometry, still driven by the existing march clock
  ctx.lineWidth=0.62;
  for(const d of [-1,1]){
    const l=smallSmooth(Math.max(0,d*s));
    const hx=d*0.75, hy=3.2+bob;
    const fx=d*(1.3-0.4*l), fy=7-2.2*l;
    const kx=d*(1.6+l), ky=(hy+fy)/2-0.5-0.9*l;
    const drop=0.35+0.5*l;
    gLine([[hx,hy],[kx,ky],[fx,fy]],pal.body);
    gLine([[fx-d*0.8,fy+drop],[fx,fy],[fx+d*0.8,fy+drop]],pal.body);
    gLine([[fx,fy],[fx,fy+drop+0.25]],pal.body);
  }
  ctx.restore();
}

function drawSmallFlight(cx,cy,pal,b,t,rotation,bank){
  const m=smallModel();
  smallBegin(cx,cy,rotation,bank);
  smallDrawWings(smallFlapWing(m,smallClock(b,t,320)),true,pal);
  smallDrawBody(m,pal,true);
  ctx.restore();
}

function drawSmallDive(cx,cy,pal,b,t,rotation,bank){
  const m=smallModel();
  const q=0.5+0.5*Math.sin(2*Math.PI*smallClock(b,t,380));   // small wing tremble
  const w=gLerpPts(m.diveOpen,m.diveFlex,q);
  smallBegin(cx,cy,rotation,bank);
  smallDrawWings(w,true,pal);
  smallDrawBody(m,pal,true);
  ctx.restore();
}

/* ---------- big birds: flat outline models ----------
   World units (1 = one arcade pixel), centred on the bird. Built to the ROM's
   56 x 16 frame. Right wing keyframes are listed; the left wing is mirrored.
   Each model's up/level/down keyframes share a point count so they tween.     */
const BIG_BIRD_MODEL_BY_WAVE={3:'broad',4:'broad'};  // 'broad' = Broadwing, 'blade' = Blade-phoenix
const BIG_BIRD_PALETTE_MODE='arcade';                 // uploaded arcade reference: cyan/magenta/lime
const BIG_BIRD_ARCADE_PALETTES={
  // Exact sampled colours from the supplied arcade sprite reference.
  // Wave 3 is cyan-dominant with magenta centre detail; wave 4 reverses those.
  // Both retain the acid yellow-green lower/detail colour.
  3:{wing:'#2db7e0',body:'#d11daa',eye:'#d11daa',detail:'#cdf03f',mask:'#000000'},
  4:{wing:'#d11daa',body:'#2db7e0',eye:'#2db7e0',detail:'#cdf03f',mask:'#000000'}
};
const BIG_BIRD_FLAP_MS=1100;       // one full flap cycle

function bbMirrorHalf(h){ return h.concat(h.slice(1,-1).reverse().map(p=>[-p[0],p[1]])); }
function bbMirror(pts){ return pts.map(p=>[-p[0],p[1]]); }
function bbLerp(a,b,t){ return a.map((p,i)=>[p[0]+(b[i][0]-p[0])*t, p[1]+(b[i][1]-p[1])*t]); }
function bbTrace(pts,close){
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  if(close!==false) ctx.closePath();
}
function bbShape(pts,stroke,mask){ bbTrace(pts,true); ctx.fillStyle=mask; ctx.fill(); ctx.strokeStyle=stroke; ctx.stroke(); }
function bbLine(pts,stroke){ bbTrace(pts,false); ctx.strokeStyle=stroke; ctx.stroke(); }
function bbDot(x,y,r,fill){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle=fill; ctx.fill(); }

const BIG_BIRD_GLYPHS={

    tail:[],
    eye:{x:1.55,y:-3.9,w:2.0},

    level:[[3.4,-1.4],[9,-2.6],[16,-3],[23,-2.6],[28.8,-1.4],[24.2,-0.2],[27.4,1.8],[21.2,1.4],[23.2,3.6],[17,2.8],[17.8,5],[12,3.6],[11.6,5.4],[3.8,1]],
    down: [[3.4,-1.4],[8.8,-0.6],[15,1],[21,3],[27.6,5.4],[23.2,5.2],[25,7.4],[19.4,6],[20.4,8],[14.8,6],[15.2,7.8],[10.8,4.8],[9.8,6.4],[3.8,1]],
    accent:[0,1,2,3,4]

function bigBirdWave(){
  return (currentFormation && currentFormation.kind==='big' && currentFormation.birdVariant===4) ? 4 : 3;
}
function bigBirdModel(b){
  return BIG_BIRD_GLYPHS[BIG_BIRD_MODEL_BY_WAVE[bigBirdWave()]] || BIG_BIRD_GLYPHS.broad;
}
function bigBirdPalette(b){
  if(BIG_BIRD_PALETTE_MODE==='arcade') return BIG_BIRD_ARCADE_PALETTES[bigBirdWave()];
  const p=birdRenderPalette(b);
  return {wing:p.wing,body:p.body,eye:p.eye,detail:p.eye,mask:p.mask};
}
// Wing points for both sides at the current flap and hatch spread.
function bigBirdWingPoints(b){
  const m=bigBirdModel(b);
  const cyc=birdVisualAnimationTimeMs()/BIG_BIRD_FLAP_MS + (b.col|0)*0.11;
  const seq=[m.up,m.level,m.down,m.level];
  const x=(((cyc%1)+1)%1)*4, i=Math.floor(x), f=x-i;
  const flap=bbLerp(seq[i],seq[(i+1)%4],f*f*(3-2*f));
  // ROM draw width 32..56 spreads the wings; the body stays full size
  const k=Math.max(0.18,(bigBirdDims(b).w-12)/44);
  const right=flap.map(p=>[p[0]<4?p[0]:4+(p[0]-4)*k, p[1]*(0.55+0.45*k)]);
  return {right, left:bbMirror(right)};
}
// Wing visibility is a property of the ROM bird state, not a timer.
// C = right wing missing, D = left wing missing, E = both missing.
function bigBirdWingVisibility(b){
  const s=b.growthState|0;
  if(s===0x0C) return {left:1,right:0};
  if(s===0x0D) return {left:0,right:1};
  if(s===0x0E) return {left:0,right:0};
  return {left:1,right:1};
}
function applyBigBirdWingStateHit(b,side){
  const s=b.growthState|0;
  if(side==='right'){
    if(s===0x0B) b.growthState=0x0C;
    else if(s===0x0D) b.growthState=0x0E;
  } else {
    if(s===0x0B) b.growthState=0x0D;
    else if(s===0x0C) b.growthState=0x0E;
  }
}

function drawBigBirdGlyph(b,px,py){
  const m=bigBirdModel(b), pal=bigBirdPalette(b), w=bigBirdWingPoints(b);
  const wingVis=bigBirdWingVisibility(b);
  const sides=[
    [w.right, wingVis.right],
    [w.left,  wingVis.left]
  ];
  ctx.save();
  ctx.translate(px,py);
  ctx.lineJoin='miter'; ctx.miterLimit=4; ctx.lineCap='round';

  for(const [pts,show] of sides){
    const root=pts[0], tail=pts[pts.length-1], s=root[0]<0?-1:1;
    if(show<=0){                                   // stump
      ctx.lineWidth=0.8;
      bbLine([root,[root[0]+s*2.4,root[1]+1],tail],pal.wing);
      continue;
    }
    ctx.save();
    if(show<1){ ctx.translate(root[0],0); ctx.scale(show,show); ctx.translate(-root[0],0); }
    ctx.lineWidth=0.8; bbShape(pts,pal.wing,pal.mask);
    ctx.lineWidth=0.5; bbLine(m.accent.map(i=>pts[i]),pal.body);
    ctx.restore();
  }

  ctx.lineWidth=0.6;
  for(const t of m.tail) bbLine(t,pal.detail||pal.body);
  ctx.lineWidth=0.85; bbShape(m.body,pal.body,pal.mask);

  // face: angled almond eyes with pupils, long hooked blade beak
  const e=m.eye;
  for(const s of [-1,1]){
    const eye=[[e.x-0.5*e.w,e.y-0.5],[e.x+0.05*e.w,e.y-0.55],[e.x+0.5*e.w,e.y+0.05],[e.x-0.05*e.w,e.y+0.45]]
      .map(p=>[s*p[0],p[1]]);
    ctx.lineWidth=0.45; bbShape(eye,pal.eye,pal.mask);
    bbDot(s*(e.x+0.08*e.w),e.y,0.32,pal.eye);
  }
  ctx.lineWidth=0.5;  bbShape(m.beak,pal.detail||pal.wing,pal.mask);
  ctx.lineWidth=0.35; bbLine([[0,-2.2],[0,-0.2]],pal.detail||pal.wing);

  ctx.restore();
}

// Small aliens are 2x1 character objects: L0788 draws the first tile at the
// alien's coordinate and the second one RightOneColumn, so the ROM object
// spans x..x+16 and its horizontal centre is x+8 (formations and the
// mothership pilot both centre on x=$68).  The vector art's feet already sit
// on the bottom of the 8px cell, so no vertical shift is applied.
const SMALL_ALIEN_CENTER_DX=8, SMALL_ALIEN_CENTER_DY=0;
function drawBird(b){
  const px=b.kind==='big' ? b.renderX : b.x+SMALL_ALIEN_CENTER_DX;
  const py=b.kind==='big' ? b.renderY : b.y+SMALL_ALIEN_CENTER_DY;
  const dims=bigBirdDims(b);

  if(b.kind==='big' && b.growthState<5){
    drawVectorEgg(b,px,py);
    return;
  }

  if(b.kind==='small'){
    const palette=birdRenderPalette(b);
    const t=birdVisualAnimationTimeMs();
    const pos=smallFlightPos(b);
    const fx=pos[0]+SMALL_ALIEN_CENTER_DX, fy=pos[1]+SMALL_ALIEN_CENTER_DY;
    drawSmallVisualBlend(fx,fy,palette,b,t);
    return;
  }

if(b.kind==='big'){
    drawBigBirdGlyph(b,px,py);
    return;
  }

  ctx.save();
  ctx.translate(px,py);
  ctx.strokeStyle=(b.palette&&b.palette[0])||'#ffffff';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.ellipse(0,0,dims.w*0.35,dims.h*0.45,0,0,Math.PI*2);
  ctx.stroke();
  ctx.restore();
}


/* Mothership: vector-outline saucer in the same black-mask / neon-stroke
   style as the birds and the player ship.  The ROM damage model is still the
   source of truth:
     - T1D00 rows 0-3 (b.body) give one hull height per tile column.  The
       lower hull outline is traced through those heights, so every bite a
       bullet takes (edge tiles $4F->$4C->gone, then the tile above becomes
       the new edge) visibly changes the silhouette.
     - The 36 belt half-fields (b.beltHalves) are sampled along the belt, so
       damaged halves are notched and open halves become real gaps that
       travel with the conveyor.
   The upper dome stays inside the ROM's rows 5-8 footprint so the T15E0
   escort arch still clears it exactly as in the arcade. */
const MS_COL={
  hull:'#ffa51f', hullGrid:'rgba(255,165,31,0.30)', scorch:'#ff4a1a', ember:'#ffd23f',
  belt:'#ff3fe0', beltMark:'#ff8cf0', beltMark2:'#c02cb0', beltFill:'#14030f',
  dome:'#e6f06a', domeDim:'rgba(230,240,106,0.35)', port:'#e6f06a',
  canopy:'#39d6ff', canopyFill:'rgba(10,40,60,0.55)',
  owl:'#b98bff', owlDim:'rgba(185,139,255,0.45)', eye:'#ffd23f', pupil:'#ff2a2a',
  brow:'#ff3048', beak:'#ffb020', beacon:'#ff3048', mask:'#000000', flash:'#ffffff'
};
const MS_BELT_HALF=4, MS_BELT_LEFT=-72, MS_BELT_RIGHT=72;

function msIsHullTile(v){ return v===0x5E || (v>=0x4C && v<=0x4F); }
function msColumnBottom(body,c){
  // Lowest surviving hull tile in this column; edge tiles lose 2px per hit.
  for(let r=0;r<4;r++){
    if(!msIsHullTile(MOTHERSHIP_T1D00[r][c])) continue;
    const v=body[r][c];
    if(!v) continue;
    const bite=(v>=0x4C && v<=0x4F) ? (0x4F-v)*2 : 0;
    return bossTileTopY(r)+MOTHERSHIP_TILE-bite;
  }
  return MOTHERSHIP_TILE/2; // eaten through to the belt
}
const MS_HULL_BASE=(function(){
  const out=[];
  for(let c=4;c<=21;c++) out[c]=msColumnBottom(MOTHERSHIP_T1D00,c);
  return out;
})();

// Undamaged hull: a smooth bowl through the ROM column heights, sampled
// once into a polyline so any x can be looked up.
const MS_HULL_CURVE=(function(){
  const pts=[[MS_BELT_LEFT,4]];
  for(let c=4;c<=21;c++) pts.push([bossTileLeftX(c)+MOTHERSHIP_TILE/2, MS_HULL_BASE[c]]);
  pts.push([MS_BELT_RIGHT,4]);
  const out=[];
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(0,i-1)], p1=pts[i], p2=pts[i+1], p3=pts[Math.min(pts.length-1,i+2)];
    const c1=[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6];
    const c2=[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
    for(let k=0;k<16;k++){
      const u=k/16, v=1-u;
      out.push([v*v*v*p1[0]+3*v*v*u*c1[0]+3*v*u*u*c2[0]+u*u*u*p2[0],
                v*v*v*p1[1]+3*v*v*u*c1[1]+3*v*u*u*c2[1]+u*u*u*p2[1]]);
    }
  }
  out.push(pts[pts.length-1]);
  return out;
})();
function msHullBaseY(x){
  const c=MS_HULL_CURVE;
  for(let i=1;i<c.length;i++){
    if(c[i][0]>=x){
      const a=c[i-1], b=c[i], f=b[0]===a[0]?0:(x-a[0])/(b[0]-a[0]);
      return a[1]+(b[1]-a[1])*f;
    }
  }
  return 4;
}
function msColumnDamaged(b,c){ return msColumnBottom(b.body,c) < MS_HULL_BASE[c]-0.01; }

function msHullBasePath(){
  // Full undamaged black backing mask. Damage removes coloured hull/grid,
  // but never becomes transparent to stars or other scenery behind the saucer.
  ctx.beginPath();
  ctx.moveTo(MS_BELT_LEFT,4);
  for(const p of MS_HULL_CURVE) ctx.lineTo(p[0],p[1]);
  ctx.lineTo(MS_BELT_RIGHT,4);
  ctx.closePath();
}

function msDamageNotchPoints(b,c){
  const x0=bossTileLeftX(c), x1=x0+MOTHERSHIP_TILE, xm=(x0+x1)*0.5;
  const baseL=msHullBaseY(x0), baseR=msHullBaseY(x1);
  const now=msColumnBottom(b.body,c);
  const depth=Math.max(0,Math.max(baseL,baseR)-now);
  const shoulder=clamp(1.6+depth*0.08,1.6,2.6);
  return [
    [x0,baseL],
    [x0+shoulder,lerp(baseL,now,0.30)],
    [xm-1.25,now+Math.min(1.5,depth*0.16)],
    [xm,now],
    [xm+1.15,now+Math.min(1.1,depth*0.12)],
    [x1-shoulder,lerp(baseR,now,0.34)],
    [x1,baseR]
  ];
}

function msHullPath(b){
  // Intact columns follow the smooth bowl. Damaged columns retain the exact
  // ROM damage depth but cut a compact jagged bite into the bowl instead of
  // producing a square-walled orange step.
  ctx.beginPath();
  ctx.moveTo(MS_BELT_LEFT,4);
  for(let c=4;c<=21;c++){
    const x0=bossTileLeftX(c), x1=x0+MOTHERSHIP_TILE;
    if(msColumnDamaged(b,c)){
      const notch=msDamageNotchPoints(b,c);
      for(const p of notch) ctx.lineTo(p[0],p[1]);
    } else {
      for(const p of MS_HULL_CURVE){ if(p[0]>=x0 && p[0]<=x1) ctx.lineTo(p[0],p[1]); }
      ctx.lineTo(x1,msHullBaseY(x1));
    }
  }
  ctx.lineTo(MS_BELT_RIGHT,4);
  ctx.closePath();
}

function drawMothershipHull(b,t,flash){
  // The damaged saucer should read as a genuine hole, so only the current
  // live silhouette is black-filled. Removed sections remain transparent and
  // show the starfield behind them.
  msHullPath(b);
  ctx.fillStyle=MS_COL.mask; ctx.fill();

  // Hull plating grid, clipped to the live silhouette so damage cuts it too.
  ctx.save();
  msHullPath(b); ctx.clip();
  ctx.strokeStyle=MS_COL.hullGrid; ctx.lineWidth=0.45;
  ctx.beginPath();
  for(let k=-4;k<=4;k++){ ctx.moveTo(k*16,4); ctx.lineTo(k*8.5,40); }
  for(const y of [12,20,28]){ ctx.moveTo(-80,y); ctx.quadraticCurveTo(0,y+2.5,80,y); }
  ctx.stroke();
  ctx.restore();

  msHullPath(b);
  ctx.strokeStyle=flash?MS_COL.flash:MS_COL.hull; ctx.lineWidth=0.9; ctx.stroke();

  // Scorched edge follows the same bite geometry; no separate rectangular tab.
  for(let c=4;c<=21;c++){
    if(!msColumnDamaged(b,c)) continue;
    const notch=msDamageNotchPoints(b,c);
    const inner=notch.slice(1,-1);
    ctx.strokeStyle=MS_COL.scorch; ctx.lineWidth=0.6;
    ctx.beginPath();
    ctx.moveTo(inner[0][0],inner[0][1]);
    for(let i=1;i<inner.length;i++) ctx.lineTo(inner[i][0],inner[i][1]);
    ctx.stroke();

    const apex=notch[3];
    const flick=0.5+0.5*Math.sin(t*9+c*1.7);
    ctx.fillStyle=MS_COL.ember;
    ctx.globalAlpha*=0.5+0.5*flick;
    ctx.fillRect(apex[0]-0.4,apex[1]+0.7+flick*0.5,0.8,0.8);
    ctx.globalAlpha/=(0.5+0.5*flick);
  }
}

function msDomePath(){
  ctx.beginPath();
  ctx.moveTo(-58,-4);
  ctx.bezierCurveTo(-50,-5.5,-45,-9.5,-40,-12.5);
  ctx.bezierCurveTo(-32,-17,-27,-24,-20,-29.5);
  ctx.bezierCurveTo(-15,-33.5,-10,-35,-6,-35);
  ctx.lineTo(6,-35);
  ctx.bezierCurveTo(10,-35,15,-33.5,20,-29.5);
  ctx.bezierCurveTo(27,-24,32,-17,40,-12.5);
  ctx.bezierCurveTo(45,-9.5,50,-5.5,58,-4);
  ctx.closePath();
}
function drawMothershipDome(b,t){
  msDomePath();
  ctx.fillStyle=MS_COL.mask; ctx.fill();
  ctx.strokeStyle=MS_COL.dome; ctx.lineWidth=0.9; ctx.stroke();

  // Skirt seam just above the belt.
  ctx.strokeStyle=MS_COL.domeDim; ctx.lineWidth=0.45;
  ctx.beginPath(); ctx.moveTo(-47,-8); ctx.lineTo(47,-8); ctx.stroke();

  // Portholes with a running light chasing outwards from the canopy.
  const lit=Math.floor(t*6)%3;
  for(const s of [-1,1]){
    for(let i=0;i<3;i++){
      const x=s*(19+i*8.5), y=-11.5+i*0.4;
      ctx.beginPath(); ctx.arc(x,y,1.35,0,Math.PI*2);
      if(i===lit){ ctx.fillStyle=MS_COL.port; ctx.fill(); }
      else { ctx.fillStyle=MS_COL.mask; ctx.fill(); ctx.strokeStyle=MS_COL.domeDim; ctx.lineWidth=0.45; ctx.stroke(); }
    }
  }

  // Rotating sensor dish on a short mast, with a pulsing beacon.
  ctx.strokeStyle=MS_COL.dome; ctx.lineWidth=0.7;
  ctx.beginPath(); ctx.moveTo(0,-35); ctx.lineTo(0,-39.2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-3,-35); ctx.lineTo(0,-37.2); ctx.lineTo(3,-35); ctx.stroke();
  const spin=Math.cos(t*2.4);
  const w=Math.max(0.6,Math.abs(spin)*5.2);
  ctx.save(); ctx.translate(0,-40.2);
  ctx.beginPath(); ctx.ellipse(0,0,w,2.1,0,0,Math.PI); ctx.closePath();
  ctx.fillStyle=MS_COL.mask; ctx.fill();
  ctx.strokeStyle=MS_COL.dome; ctx.lineWidth=0.6; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,0.3); ctx.lineTo(spin*1.2,-2.2); ctx.stroke();
  ctx.restore();
  const pulse=0.5+0.5*Math.sin(t*5);
  ctx.beginPath(); ctx.arc(spin*1.2,-42.6,0.9,0,Math.PI*2);
  ctx.fillStyle=MS_COL.beacon; ctx.globalAlpha*=0.45+0.55*pulse; ctx.fill(); ctx.globalAlpha/=(0.45+0.55*pulse);
}

const OWL_HALF=[[0,-4],[6.3,-4],[7.4,-8],[7.0,-12.6],[7.9,-16.6],[7.4,-20.2],[8.6,-24.6],[5.3,-21.4],[2.6,-20.3],[0,-19.5]];
const OWL_SHAPE=OWL_HALF.concat(OWL_HALF.slice(1,-1).reverse().map(p=>[-p[0],p[1]]));
function drawMothershipCanopy(b,t,exposed){
  // Canopy glass
  ctx.beginPath();
  ctx.moveTo(-11,-4); ctx.lineTo(-11,-18);
  ctx.arc(0,-18,11,Math.PI,0);
  ctx.lineTo(11,-4); ctx.closePath();
  ctx.fillStyle=MS_COL.canopyFill; ctx.fill();

  // Evil owl commander
  const jit=exposed ? Math.sin(t*47)*0.35 : 0;
  ctx.save(); ctx.translate(jit,0);
  ctx.beginPath();
  ctx.moveTo(OWL_SHAPE[0][0],OWL_SHAPE[0][1]);
  for(let i=1;i<OWL_SHAPE.length;i++) ctx.lineTo(OWL_SHAPE[i][0],OWL_SHAPE[i][1]);
  ctx.closePath();
  ctx.fillStyle=MS_COL.mask; ctx.fill();
  ctx.strokeStyle=MS_COL.owl; ctx.lineWidth=0.7; ctx.lineJoin='miter'; ctx.stroke();

  // folded wings and chest feathers
  ctx.strokeStyle=MS_COL.owlDim; ctx.lineWidth=0.45;
  ctx.beginPath();
  for(const s of [-1,1]){
    ctx.moveTo(s*6.6,-12); ctx.quadraticCurveTo(s*3.8,-8.5,s*4.6,-4.2);
  }
  for(const [y,w] of [[-9.6,1.4],[-7.4,2.2],[-5.4,1.4]]){
    for(const x of (w>2?[-2,2]:[0])){
      ctx.moveTo(x-w*0.6,y-0.8); ctx.lineTo(x,y); ctx.lineTo(x+w*0.6,y-0.8);
    }
  }
  ctx.stroke();

  // facial disc
  ctx.beginPath();
  ctx.moveTo(-6.4,-16); ctx.quadraticCurveTo(-6.6,-11.2,0,-10.2);
  ctx.quadraticCurveTo(6.6,-11.2,6.4,-16);
  ctx.stroke();

  // eyes track the player; blink now and then; go wide when the belt under
  // the cockpit has been shot open
  const blink=!exposed && (t%3.4)<0.12;
  const er=exposed?2.9:2.5;
  let look=0;
  if(player) look=clamp((player.x+4-b.x)/70,-1,1)*(er-1.3);
  for(const s of [-1,1]){
    const ex=s*3.3, ey=-15.4;
    if(blink){
      ctx.strokeStyle=MS_COL.eye; ctx.lineWidth=0.6;
      ctx.beginPath(); ctx.moveTo(ex-er,ey); ctx.lineTo(ex+er,ey); ctx.stroke();
      continue;
    }
    ctx.beginPath(); ctx.arc(ex,ey,er,0,Math.PI*2);
    ctx.fillStyle=MS_COL.mask; ctx.fill();
    ctx.strokeStyle=MS_COL.eye; ctx.lineWidth=0.6; ctx.stroke();
    ctx.beginPath(); ctx.arc(ex+look,ey+0.4,exposed?0.7:1.05,0,Math.PI*2);
    ctx.fillStyle=MS_COL.pupil; ctx.fill();
  }
  // scowl
  ctx.strokeStyle=MS_COL.brow; ctx.lineWidth=0.8; ctx.lineCap='round';
  const lift=exposed?1.0:0;
  ctx.beginPath();
  ctx.moveTo(-0.5,-16.9-lift); ctx.lineTo(-6.3,-19.6-lift);
  ctx.moveTo(0.5,-16.9-lift);  ctx.lineTo(6.3,-19.6-lift);
  ctx.stroke();
  // hooked beak
  ctx.beginPath();
  ctx.moveTo(-1.2,-13.4); ctx.lineTo(1.2,-13.4); ctx.quadraticCurveTo(0.6,-11.6,0,-10.6);
  ctx.quadraticCurveTo(-0.4,-11.8,-1.2,-13.4); ctx.closePath();
  ctx.fillStyle=MS_COL.beak; ctx.fill();
  ctx.restore();

  // canopy frame + glint drawn over the owl
  ctx.beginPath();
  ctx.moveTo(-11,-4); ctx.lineTo(-11,-18);
  ctx.arc(0,-18,11,Math.PI,0);
  ctx.lineTo(11,-4);
  const glass=exposed && (Math.floor(t*10)&1) ? MS_COL.brow : MS_COL.canopy;
  ctx.strokeStyle=glass; ctx.lineWidth=0.8; ctx.stroke();
  ctx.strokeStyle='rgba(57,214,255,0.55)'; ctx.lineWidth=0.5;
  ctx.beginPath(); ctx.arc(0,-18,8.4,Math.PI*1.12,Math.PI*1.32); ctx.stroke();
}

function msBeltStateAt(b,x,shift){
  const total=b.beltHalves.length;
  const src=bossWrapIdx(Math.floor((x-MS_BELT_LEFT)/MS_BELT_HALF - shift), total);
  return b.beltHalves[src];
}
function drawMothershipBelt(b,t,flash){
  const top=-4, bot=4;
  const shift=bossBeltVisualShift(b);
  const total=b.beltHalves.length;
  const step=0.5;

  // Sample the belt: solid halves are full height, damaged halves are torn
  // up from the bottom, open halves are gaps.
  const xs=[], ys=[];
  for(let x=MS_BELT_LEFT; x<=MS_BELT_RIGHT+0.001; x+=step){
    const sx=Math.min(x,MS_BELT_RIGHT-0.01);
    const s=msBeltStateAt(b,sx,shift);
    let y;
    if(s===1) y=null;
    else if(s===3){
      const ph=((sx-MS_BELT_LEFT)/MS_BELT_HALF - shift);
      const f=ph-Math.floor(ph);
      y=0.2+Math.abs(f-0.5)*2.4; // torn zig-zag edge
    } else y=bot;
    xs.push(x); ys.push(y);
  }
  const runs=[];
  let start=-1;
  for(let i=0;i<=xs.length;i++){
    const open=i===xs.length || ys[i]===null;
    if(!open && start<0) start=i;
    if(open && start>=0){ runs.push([start,i-1]); start=-1; }
  }
  const stroke=flash?MS_COL.flash:MS_COL.belt;
  for(const [i0,i1] of runs){
    ctx.beginPath();
    ctx.moveTo(xs[i0],top); ctx.lineTo(xs[i1],top);
    for(let i=i1;i>=i0;i--) ctx.lineTo(xs[i],ys[i]);
    ctx.closePath();
    ctx.fillStyle=MS_COL.beltFill; ctx.fill();
    ctx.strokeStyle=stroke; ctx.lineWidth=0.8; ctx.lineJoin='miter'; ctx.stroke();
  }

  // Link windows ride with the conveyor on intact halves.
  ctx.save();
  ctx.beginPath(); ctx.rect(MS_BELT_LEFT,top-1,MS_BELT_RIGHT-MS_BELT_LEFT,10); ctx.clip();
  ctx.lineWidth=0.45;
  for(let src=0;src<total;src++){
    const s=b.beltHalves[src];
    if(s!==2) continue; // $6A tiles carry the link windows -> pairs every 16px
    const pos=bossWrapIdx(src+shift,total);
    for(const x of [MS_BELT_LEFT+pos*MS_BELT_HALF, MS_BELT_LEFT+(pos-total)*MS_BELT_HALF]){
      if(x<MS_BELT_LEFT-MS_BELT_HALF || x>MS_BELT_RIGHT) continue;
      ctx.strokeStyle=MS_COL.beltMark;
      ctx.strokeRect(x+1.0,top+2.0,2.0,4.0);
    }
  }
  ctx.restore();

  // Glowing hot edges on open gaps.
  for(let i=1;i<xs.length;i++){
    if((ys[i]===null)!==(ys[i-1]===null)){
      const x=xs[i]-step/2;
      const g=0.5+0.5*Math.sin(t*12+x);
      ctx.strokeStyle=MS_COL.ember; ctx.globalAlpha*=0.4+0.6*g; ctx.lineWidth=0.5;
      ctx.beginPath(); ctx.moveTo(x,top+0.8); ctx.lineTo(x+(ys[i]===null?0.6:-0.6),bot-0.8); ctx.stroke();
      ctx.globalAlpha/=(0.4+0.6*g);
    }
  }

  // Rounded end caps.
  for(const s of [-1,1]){
    const cx=s*MS_BELT_RIGHT;
    ctx.beginPath();
    ctx.ellipse(cx,0,6.5,4.6,0,s<0?Math.PI*0.5:-Math.PI*0.5,s<0?Math.PI*1.5:Math.PI*0.5);
    ctx.closePath();
    ctx.fillStyle=MS_COL.mask; ctx.fill();
    ctx.strokeStyle=flash?MS_COL.flash:MS_COL.hull; ctx.lineWidth=0.8; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx+s*3.1,0,1.1,0,Math.PI*2);
    ctx.strokeStyle=MS_COL.hull; ctx.lineWidth=0.45; ctx.stroke();
  }
}

function drawBossExplosionDamageMask(b){
  if(!b || b.state!=='dead' || b.deadFrames<=0x20) return;
  const e=0x60-(b.deadFrames|0);
  const cuts=[];
  if(e>=10) cuts.push([[-82,-17],[-57,-22],[-45,-10],[-55,5],[-82,8]]);
  if(e>=20) cuts.push([[82,-17],[57,-22],[45,-10],[55,5],[82,8]]);
  if(e>=30) cuts.push([[-54,1],[-31,-7],[-17,2],[-25,14],[-51,13]]);
  if(e>=40) cuts.push([[54,1],[31,-7],[17,2],[25,14],[51,13]]);
  if(e>=50) cuts.push([[-27,-34],[-6,-38],[8,-24],[-1,-10],[-24,-14]]);
  if(e>=58) cuts.push([[3,-29],[31,-25],[36,-8],[15,2],[-2,-8]]);
  ctx.fillStyle='#000000';
  for(const poly of cuts){
    ctx.beginPath(); ctx.moveTo(poly[0][0],poly[0][1]);
    for(let i=1;i<poly.length;i++) ctx.lineTo(poly[i][0],poly[i][1]);
    ctx.closePath(); ctx.fill();
  }
}
function drawBossExplosionCore(b){
  if(!b || b.state!=='dead' || b.deadFrames<=0 || b.deadFrames>0x20) return;
  const p=(0x20-b.deadFrames)/0x20;
  const inner=4+8*p, outer=14+30*p;
  ctx.save();
  ctx.translate(b.x,b.y);
  ctx.lineCap='round';
  for(let i=0;i<16;i++){
    const a=(Math.PI*2*i/16)+(i&1?0.07:-0.05);
    const r0=inner+(i%3)*1.6;
    const r1=outer-(i%4)*2.1;
    ctx.strokeStyle=(i%3===0)?MS_COL.flash:(i%3===1?MS_COL.ember:MS_COL.hull);
    ctx.lineWidth=(i%4===0)?1.0:0.65;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*r0,Math.sin(a)*r0);
    ctx.lineTo(Math.cos(a)*r1,Math.sin(a)*r1);
    ctx.stroke();
  }
  // Two hard geometric breakup rings — outlines only, no glow.
  ctx.strokeStyle=MS_COL.flash; ctx.lineWidth=0.6;
  ctx.beginPath(); ctx.ellipse(0,0,8+20*p,4+10*p,0,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle=MS_COL.ember;
  ctx.beginPath(); ctx.ellipse(0,0,14+34*p,7+16*p,0,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}
function drawBoss(){
  const b=currentBoss;
  if(!b) return;
  if(b.state==='dead' && b.deadFrames<=0x20){ drawBossExplosionCore(b); return; }
  const t=performance.now()/1000;
  const exploding=b.state==='dead';
  const flash=!!b.hitFlashT && (performance.now()-b.hitFlashT)<70;
  // Cockpit is exposed once either half of the belt under the pilot is open.
  let exposed=false;
  for(const wx of [b.x-6,b.x-2,b.x+2,b.x+6]){
    const h=bossBeltSourceAtX(b,wx);
    if(h && h.state===1){ exposed=true; break; }
  }
  ctx.save();
  const shakeX=exploding ? Math.sin((b.deadFrames||0)*2.11)*0.9 : 0;
  const shakeY=exploding ? Math.cos((b.deadFrames||0)*1.73)*0.55 : 0;
  ctx.translate(b.x+shakeX,b.y+shakeY);
  ctx.lineCap='round'; ctx.lineJoin='round';
  drawMothershipHull(b,t,flash);
  drawMothershipDome(b,t);
  drawMothershipCanopy(b,t,exposed);
  drawMothershipBelt(b,t,flash);
  if(exploding) drawBossExplosionDamageMask(b);
  if(exploding){
    // Hard fracture strokes: visible break-up without any glow/halo treatment.
    const e=0x60-(b.deadFrames|0);
    ctx.strokeStyle=(e&4)?MS_COL.flash:MS_COL.scorch;
    ctx.lineWidth=0.7;
    for(let i=0;i<5;i++){
      const xx=-50+i*25+Math.sin(e*0.19+i)*3;
      const yy=-5+((i*11+e)>>2)%22;
      ctx.beginPath();
      ctx.moveTo(xx-4,yy-3); ctx.lineTo(xx,yy); ctx.lineTo(xx+3,yy+4);
      ctx.stroke();
    }
  }
  ctx.restore();
}
/* Bolts instead of dots — the previous build's 3px circles were nearly
   invisible against the black field. */
function drawBullets(){
  for(const b of bullets){
    if(b.dead) continue;
    ctx.save();
    const len = b.friendly ? 7 : 5;
    const speed = Math.hypot(b.vx||0,b.vy||0);
    let dx=0, dy=0;
    if(speed>0.0001){
      dx=((b.vx||0)/speed)*len/2;
      dy=((b.vy||0)/speed)*len/2;
    } else {
      // ROM-fidelity bullets are advanced by the frame dispatcher rather than
      // velocity integration. They are still vertical shots: player bullets up,
      // enemy bullets down. Do not let vx=vy=0 collapse the rendered bolt.
      dy=(b.friendly ? -1 : 1)*len/2;
    }
    ctx.strokeStyle = b.friendly ? '#a8f3ff' : '#ffab7a';
    ctx.lineWidth = b.friendly ? 1.5 : 1.7;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(b.x-dx,b.y-dy);
    ctx.lineTo(b.x+dx,b.y+dy);
    ctx.stroke();
    ctx.restore();
  }
}
function drawParticles(){
  for(const pt of particles){
    const lifeAlpha=clamp(pt.life/pt.maxLife,0,1);
    if(pt.kind==='vdebris'){
      const shrink=0.72+0.28*lifeAlpha;
      ctx.save();
      ctx.translate(pt.x,pt.y);
      ctx.rotate(pt.rot);
      ctx.scale(shrink,shrink);
      ctx.globalAlpha=lifeAlpha;
      ctx.strokeStyle=pt.color;
      ctx.lineWidth=pt.lineWidth;
      ctx.lineCap='round';
      ctx.lineJoin='round';
      const pts=pt.points||[];
      if(pts.length){
        ctx.beginPath();
        ctx.moveTo(pts[0][0],pts[0][1]);
        for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
        if(pt.closed) ctx.closePath();
        ctx.stroke();
      }
      ctx.restore();
    }else if(pt.kind==='shell'){
      const shrink=(pt.shellLargeRounded?0.82:0.58)+(pt.shellLargeRounded?0.18:0.42)*lifeAlpha;
      const w=pt.shellW*shrink, h=pt.shellH*shrink;
      ctx.save();
      ctx.translate(pt.x,pt.y);
      ctx.rotate(pt.rot);
      ctx.globalAlpha=lifeAlpha*lifeAlpha;
      ctx.strokeStyle='#ffffff';
      ctx.lineWidth=pt.shellLargeRounded?0.62:0.48;
      ctx.lineCap='round';
      ctx.lineJoin='round';
      ctx.beginPath();
      if(pt.shellLargeRounded){
        // Near-half egg shell: rounded outside wall, but one of six visibly
        // different broken centre seams matching the egg's crack family.
        const s=pt.shellHalfSide||1;
        const sv=pt.shellSeamVariant|0;
        ctx.moveTo(0,-h*0.49);
        ctx.quadraticCurveTo(s*w*0.76,-h*0.42,s*w*0.94,-h*0.08);
        ctx.quadraticCurveTo(s*w*1.02,h*0.24,s*w*0.66,h*0.47);
        ctx.quadraticCurveTo(s*w*0.27,h*0.55,0,h*0.48);
        if(sv===0){ ctx.lineTo(-s*w*.14,h*.29); ctx.lineTo(s*w*.10,h*.10); ctx.lineTo(-s*w*.13,-h*.07); ctx.lineTo(s*w*.11,-h*.26); }
        else if(sv===1){ ctx.lineTo(s*w*.10,h*.31); ctx.lineTo(-s*w*.16,h*.18); ctx.lineTo(s*w*.05,-h*.02); ctx.lineTo(-s*w*.18,-h*.19); }
        else if(sv===2){ ctx.lineTo(-s*w*.06,h*.34); ctx.lineTo(s*w*.17,h*.20); ctx.lineTo(-s*w*.04,h*.02); ctx.lineTo(s*w*.15,-h*.18); }
        else if(sv===3){ ctx.lineTo(s*w*.15,h*.34); ctx.lineTo(-s*w*.05,h*.16); ctx.lineTo(s*w*.18,-h*.02); ctx.lineTo(-s*w*.08,-h*.23); }
        else if(sv===4){ ctx.lineTo(-s*w*.18,h*.31); ctx.lineTo(s*w*.03,h*.22); ctx.lineTo(-s*w*.15,h*.01); ctx.lineTo(s*w*.06,-h*.23); }
        else { ctx.lineTo(s*w*.05,h*.35); ctx.lineTo(-s*w*.18,h*.13); ctx.lineTo(s*w*.14,-h*.04); ctx.lineTo(-s*w*.04,-h*.27); }
        ctx.lineTo(0,-h*0.49);
      }else{
        ctx.moveTo(-w*0.52,0);
        ctx.quadraticCurveTo(0,-h*pt.shellBend,w*0.52,0);
        ctx.lineTo(w*0.16,h*0.48);
        ctx.lineTo(-w*0.22,h*0.36);
        ctx.closePath();
      }
      ctx.stroke();
      ctx.restore();
    }else if(pt.kind==='feather'){
      const dissolve=clamp(1-pt.age,0,1);
      const visibleBarbs=pt.age<0.42 ? 3 : (pt.age<0.72 ? 2 : (pt.age<0.90 ? 1 : 0));
      const len=pt.length*(0.96-pt.age*0.20);
      const half=len*0.5;
      const barbLen=(1.2+len*0.22)*(0.85-pt.age*0.35);
      ctx.save();
      ctx.translate(pt.x,pt.y);
      ctx.rotate(pt.rot);
      ctx.globalAlpha=lifeAlpha*(0.82+0.18*dissolve);
      ctx.strokeStyle=pt.color;
      ctx.lineWidth=pt.quill;
      ctx.lineCap='round';
      ctx.lineJoin='round';
      ctx.beginPath();
      ctx.moveTo(0,-half);
      ctx.quadraticCurveTo(len*pt.curve*0.24,0,0,half);
      ctx.stroke();
      if(visibleBarbs>0){
        ctx.beginPath();
        for(let i=0;i<visibleBarbs;i++){
          const t=(i+1)/(visibleBarbs+1);
          const yy=-half+len*t;
          const sideScale=(1-Math.abs(t-0.5)*1.1);
          const reach=barbLen*sideScale;
          ctx.moveTo(0,yy);
          ctx.lineTo(-reach,yy+reach*pt.barbTilt);
          ctx.moveTo(0,yy+0.1);
          ctx.lineTo(reach*0.78,yy+reach*(pt.barbTilt*0.8));
        }
        ctx.stroke();
      }
      if(pt.age>0.76){
        ctx.globalAlpha*=0.45;
        ctx.beginPath();
        ctx.moveTo(-0.8,half*0.22);
        ctx.lineTo(0.8,half*0.30);
        ctx.stroke();
      }
      ctx.restore();
    }else{
      ctx.globalAlpha=lifeAlpha;
      ctx.fillStyle=pt.color;
      ctx.fillRect(pt.x-pt.size/2,pt.y-pt.size/2,pt.size,pt.size);
    }
  }
  ctx.globalAlpha=1;
}
/* Score numerals popping up at the hit location — present in the arcade
   original, omitted in the previous build entirely. */
function drawPopups(){
  ctx.save();
  ctx.font="4.4px 'Share Tech Mono', monospace";
  ctx.textAlign='center';
  for(const p of popups){
    ctx.globalAlpha=clamp(p.life/p.maxLife,0,1);
    ctx.fillStyle='#ffffff';
    ctx.fillText(p.text,p.x,p.y);
  }
  ctx.globalAlpha=1;
  ctx.restore();
}
function drawCenterText(text,color){
  ctx.save();
  ctx.font="7.2px 'Share Tech Mono', monospace";
  ctx.fillStyle=color;
  ctx.textAlign='center';
  ctx.fillText(text, LOGICAL_W/2, LOGICAL_H/2);
  ctx.restore();
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.setTransform(viewScale,0,0,viewScale,viewOffsetX,viewOffsetY);
  drawBackground();
  if(state==='title') ctx.setTransform(viewScale,0,0,viewScale,viewOffsetX,viewOffsetY);
  if(currentFormation){ for(const b of currentFormation.birds) if(b.alive) drawBird(b); }
  if(currentBoss){
    drawBoss();
    // Original Phoenix draws mothership in background VRAM and escorts in the
    // foreground plane, so diving escorts legitimately pass in FRONT of it.
    if(bossEscortFormation){ for(const b of bossEscortFormation.birds) if(b.alive) drawBird(b); }
  }
  drawBullets();
  drawPlayer();
  drawParticles();
  drawPopups();
  drawScreenFX();
  if(state==='roundclear') drawCenterText(roundBannerText, '#ffd23f');
  if(state==='paused') drawCenterText('PAUSED', '#39d6ff');
}

/* ---------- game flow ---------- */
function startGame(){
  VectorSynth.init(); VectorSynth.resume();
  score=0; cycle=1; roundIndex=0; extraLifeIdx=0;
  bullets=[]; particles=[]; popups=[]; escortBirds=[]; bossEscortFormation=null; bossEscortRespawnTimer=0;
  player=new Player();
  spawnRound();
  state='playing';
  document.body.classList.remove('title-mode','gameover-mode');
  fitCanvas();
  titleScreen.classList.remove('show');
  gameoverScreen.classList.remove('show');
  void 0;
  requestFS();
}
function requestFS(){
  if(fullscreenElementNow()) { focusGameSurface(); return; }
  const el=document.getElementById('cabinet');
  const req=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
  if(req){
    try{
      const p=req.call(el);
      if(p && p.catch) p.catch(()=>{});
    }catch(e){ /* ignore */ }
  }
}
function togglePause(){
  if(state==='playing'){
    state='paused';
    stopVectorSynthAmbience();
    setVectorShieldSound(false);
  } else if(state==='paused'){
    state='playing';
    syncVectorSynthState(true);
    if(player&&player.shieldState==='active') setVectorShieldSound(true);
  }
}


/* ======================================================================
   ROM FIDELITY PASS 1
   Fixed 61.03515625 Hz frame clock, original frame dispatch, player/shield
   states, ROM score rules, state-driven vector animation, authentic wing
   damage, death reset, and exact stage-5 9 -> A -> B reveal/escort lifecycle.
   ====================================================================== */
const PHOENIX_HZ = 5500000 / (352 * 256); // 61.03515625 Hz
const PHOENIX_FRAME = 1 / PHOENIX_HZ;     // 16.384 ms
const EXTRA_LIFE_THRESHOLDS_ROM = [3000, 30000]; // default Phoenix 3K / 30K DIP
let phoenixAccumulator = 0;
let phoenixRenderAlpha = 0;
let romCounter16 = 0;
let transitionFrames = 0;

// T0B38: exact sub-cell mapping used by player/alien/bomb collision code.
const PLAYER_LEFT_MAP  = [0,1,2,3,3,2,1,0];
const PLAYER_RIGHT_MAP = [8,9,10,11,11,10,9,8];
function mappedPlayerBounds(){
  const x=(player ? player.x : PLAYER_START_X);
  const i=x&7;
  // Normal ROM-range positions are unchanged. Only the deliberate extended
  // edge travel is clipped to the visible logical playfield instead of byte-wrapping.
  return {
    left:clamp(x-PLAYER_LEFT_MAP[i],0,LOGICAL_W),
    right:clamp(x+PLAYER_RIGHT_MAP[i],0,LOGICAL_W)
  };
}
function shieldIsActive(){ return !!player && player.shieldState==='active'; }
function enemyBulletLimit(){ return cycle<=1 ? 3 : (cycle===2 ? 4 : 5); }
function enemyBulletCount(){ return bullets.reduce((n,b)=>n+(!b.friendly&&!b.dead?1:0),0); }
function allowEnemyFireAttempt(){
  const rate=difficultyConfig().enemyFireRate;
  if(rate>=0.999) return true;
  enemyFireBudget+=rate;
  if(enemyFireBudget>=1){ enemyFireBudget-=1; return true; }
  return false;
}
function spawnEnemyBullet(x,y){
  if(enemyBulletCount()>=enemyBulletLimit()) return false;
  const cfg=difficultyConfig();
  const sy=y&0xFF;
  // Modern difficulty aid only: on Relaxed/Standard an enemy cannot create a
  // fresh downward bomb almost on top of the ship. Existing bombs are never
  // removed or slowed. Arcade uses 0 and therefore keeps the ROM behaviour.
  if(cfg.minBombLead>0 && player && sy>=(player.y-cfg.minBombLead)) return false;
  if(!allowEnemyFireAttempt()) return false;
  const b=new Bullet(x&0xFF,sy,0,0,false);
  b.romEnemy=true;
  bullets.push(b);
  void 0;
  return true;
}
function spawnPlayerBullet(slot){
  const b=new Bullet((player.x+4)&0xFF,(player.y-8)&0xFF,0,0,true);
  b.playerSlot=slot;
  bullets.push(b);
  VectorSynth.playerShot();
}
function romanPlayerBulletSlots(){ return roundIndex===1 ? 2 : 1; }

Player = class PlayerFidelity{
  constructor(){
    this.x=PLAYER_START_X; this.y=PLAYER_Y; this.w=16; this.h=16;
    this.lives=difficultyConfig().lives;
    this.alive=true;
    this.deathFrames=0;
    this.respawnFrames=0;
    this.shieldCounter=0;
    this.shieldState='ready';
    this.shieldTimer=0;
    this.romPose=this.x&7;
    this.walkPhase=0; // retained only for old helper compatibility
    this.invuln=0;
  }
};

Boss = class BossFidelity{
  constructor(level){
    this.x=LOGICAL_W/2;
    // StarsScrollDown writes T1D00 rows at background rows $0E..$06 during
    // level 9, so the belt (source row 4) sits on background row $0A.  With
    // screenY = row*8 - CounterB9, CounterB9=$F9 puts the belt tile top at
    // y=87, i.e. belt centre 91.  CounterB9=$71 at the start of level 9 is
    // exactly $78 scroll steps earlier.
    this.entryY=91;
    this.y=this.entryY-0x78;
    this.width=160; this.height=72;
    this.state='fade9';            // level 9 -> level A -> level B/live
    this.phaseCounter=0x48;        // T05CC CounterB4 for level 9
    this.revealAlpha=0;
    this.counterB9=0x71;           // L22E0 after the level-8 spiral
    this.houseCounter=0;           // $43AA
    this.pilotAlive=true;
    this.deadFrames=0;
    this.bonusFrames=0;
    this.bonusScore=0;
    this.body=cloneMothershipBody();
    this.beltHalves=makeInitialBeltHalves();
    this.beltShift=0;
    this.beltVisualPhase=0;
  }
};

function prepareSmallFormationFidelity(f){
  f.movementCounter=0;       // $435F, the 4-phase dispatcher byte
  f.fastMode=false;
  f.clearCounter=0;
  f.revealAlpha=1;
  f.behaviorCounter=0;       // Counter93; AlienBehaviorUpdate increments it
  f.behaviorState=0;
  f.nextPattern=null;
  f.attackerCount=1;
  f.leadIndex=0;
  f.attackDelay=0;
  f.startPtrMatch=0;
  f.escalation=0;
  f.angryInterval=0;
  f.groupTimers=[0,0,0];
  f.startPtrRotor=0;
  f.basePatternStep=0;
  f.baseClockX=0;
  f.baseClockY=0;
  for(const b of f.birds){
    b.pattern=ROM_BASE_PATTERN; b.patternKind='base'; b.patternStep=0; b.state='formation';
    b.x=b.tickToX&0xFF; b.y=b.tickToY&0xFF;
    b.renderX=b.x; b.renderY=b.y;
    b.interpFromX=b.x; b.interpFromY=b.y; b.interpToX=b.x; b.interpToY=b.y;
    b.interpFrame=0; b.interpFrames=1;
    b.romShapeCode=0x20;
    b.romFlap=0;
  }
  setupSmallFormationEntrance(f);
}

function easeOutBack(t){
  const c1=1.70158, c3=c1+1;
  return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2);
}
function setupSmallFormationEntrance(f){
  f.entranceActive = true;
  f.entranceFrame = 0;
  f.entranceTotalFrames = 54;
  if(!f.entranceActive) return;
  const center=LOGICAL_W/2;
  for(let i=0;i<f.birds.length;i++){
    const b=f.birds[i];
    const tx=b.tickToX&0xFF, ty=b.tickToY&0xFF;
    const side = tx < center ? -1 : 1;
    const wave = Math.floor(i/2);
    const sideKick = 54 + wave*5 + Math.abs(tx-center)*0.12;
    b.entryDelay = wave*2;
    b.entryFrames = 22 + (wave%3)*2;
    b.entryFromX = tx + side*sideKick;
    b.entryFromY = -22 - wave*7;
    b.entryArc = 7 + (wave%4)*2;
    b.entryFlying = true;
    b.entryRotation = Math.atan2(ty-b.entryFromY,tx-b.entryFromX)+Math.PI/2;
    initSmallVisualState(b,'flight');
    b.x = b.entryFromX;
    b.y = b.entryFromY;
    b.renderX = b.x; b.renderY = b.y;
    b.interpFromX=b.x; b.interpFromY=b.y; b.interpToX=tx; b.interpToY=ty;
    b.interpFrame=0; b.interpFrames=1;
  }
}
function stepSmallFormationEntrance(f){
  if(!f.entranceActive) return false;
  f.entranceFrame++;
  let allDone=true;
  for(const b of f.birds){
    if(!b.alive) continue;
    const raw=(f.entranceFrame - (b.entryDelay||0))/Math.max(1,b.entryFrames||1);
    const t=clamp(raw,0,1);
    if(t<1) allDone=false;
    const e=easeOutBack(t);
    const arc=Math.sin(Math.PI*t)*(b.entryArc||0)*(1-t*0.35);
    const oldX=b.x, oldY=b.y;
    b.x = b.entryFromX + ((b.tickToX&0xFF) - b.entryFromX)*e;
    b.y = b.entryFromY + ((b.tickToY&0xFF) - b.entryFromY)*e - arc;
    const dx=b.x-oldX, dy=b.y-oldY;
    if(Math.abs(dx)+Math.abs(dy)>0.001) b.entryRotation=Math.atan2(dy,dx)+Math.PI/2;
    if(t>=1){
      b.x=b.tickToX&0xFF; b.y=b.tickToY&0xFF;
      b.entryFlying=false;
    }
    b.flapPhase += 0.24;
  }
  stepSmallVisualFormation(f);
  if(!allDone) return true;
  f.entranceActive=false;
  for(const b of f.birds){
    if(!b.alive) continue;
    b.x=b.tickToX&0xFF; b.y=b.tickToY&0xFF;
    b.renderX=b.x; b.renderY=b.y;
    b.interpFromX=b.x; b.interpFromY=b.y; b.interpToX=b.x; b.interpToY=b.y;
    b.interpFrame=0; b.interpFrames=1;
  }
  return false;
}
function prepareBigFormationFidelity(f){
  f.clearCounter=0;
  f.bigCounter16=romCounter16;
  for(const b of f.birds){
    b.prevX=b.x; b.prevY=b.y; b.renderX=b.x; b.renderY=b.y;
  }
}

spawnRound = function spawnRoundFidelity(){
  currentFormation=null; currentBoss=null; bossEscortFormation=null; escortBirds=[];
  const meta=ROUND_META[roundIndex];
  const level=cycle+roundIndex*0.25;
  if(meta.kind==='boss'){
    currentBoss=new Boss(level);
    // Deliberately NO escort here. T15E0 is materialised only near the end of level A.
  } else {
    currentFormation=new Formation(meta,level);
    if(meta.kind==='small') prepareSmallFormationFidelity(currentFormation);
    else prepareBigFormationFidelity(currentFormation);
  }
  if(meta.kind==='small') syncVectorSynthState(true);
  else if(meta.kind==='big') syncVectorSynthState(true);
  else if(meta.kind==='boss') syncVectorSynthState(true);
};

addScore = function addScoreFidelity(v){
  score += Math.max(0,Math.round(v));
  if(score>highScore) highScore=score;
  checkExtraLife();
};
checkExtraLife = function checkExtraLifeFidelity(){
  if(TEST_UNLIMITED_LIVES || !player) return;
  while(extraLifeIdx<EXTRA_LIFE_THRESHOLDS_ROM.length && score>EXTRA_LIFE_THRESHOLDS_ROM[extraLifeIdx]){
    player.lives++;
    extraLifeIdx++;
    VectorSynth.extraLife();
    spawnPopup(player.x,player.y-10,'EXTRA LIFE');
  }
};

advanceRound = function advanceRoundFidelity(){
  stopVectorSynthAmbience();
  if(player){
    player.shieldCounter=0;
    player.shieldState='ready';
    player.shieldTimer=0;
    setVectorShieldSound(false);
  }
  roundIndex++;
  if(roundIndex>=ROUND_META.length){ roundIndex=0; cycle++; }
  bullets=[];
  state='roundclear';
  transitionFrames=0x60; // ROM handover countdown uses 96 decrements
  const nextMeta=ROUND_META[roundIndex];
  roundBannerText=nextMeta.kind==='boss'?'MOTHERSHIP APPROACHING':('ROUND '+cycle+'-'+(roundIndex+1));
};
checkRoundClear = function(){ /* handled by the ROM frame dispatchers below */ };

tryActivateShield = function tryActivateShieldFidelity(){
  const p=player;
  if(!p || !p.alive || p.deathFrames>0 || state!=='playing') return;
  if(p.shieldCounter===0){
    p.shieldCounter=0xFF;
    p.shieldState='active';
    p.shieldTimer=(0xFF-0xC0)/PHOENIX_HZ;
    setVectorShieldSound(true);
  }
};

function currentFireDown(){ return keys.has('Space')||touchState.fire||gamepadState.fire; }
function sampleFireInputFrame(){
  const down=currentFireDown();
  firePressedThisFrame=down&&!firePrev;
  firePrev=down;
}
function stepPlayerWeaponsFrame(){
  // The ROM clears a player shot below $1F because the top 32 pixels belong
  // to its score band. Our HUD now lives in the sidebar, so preserve the
  // 8-pixel step but let the visible shot traverse the whole playfield.
  for(const b of bullets){
    if(!b.friendly || b.dead) continue;
    b.y-=8;
    if(b.y<0) b.dead=true;
  }

  // Testing-only cheat: while fire is held, launch an independent shot every
  // three Phoenix frames. These do not occupy the ROM player-bullet slots.
  if(TEST_RAPID_FIRE){
    if(currentFireDown()){
      if(rapidFireCheatFrames<=0){
        spawnPlayerBullet('rapid');
        rapidFireCheatFrames=RAPID_FIRE_CHEAT_INTERVAL-1;
      } else rapidFireCheatFrames--;
    } else rapidFireCheatFrames=0;
    return;
  }
  rapidFireCheatFrames=0;

  // Normal mode stays ROM-style: fresh press only. Level 3 really does have
  // the second bullet slot; the first free slot consumes the press.
  if(!firePressedThisFrame) return;
  const max=romanPlayerBulletSlots();
  for(let slot=0;slot<max;slot++){
    const occupied=bullets.some(b=>b.friendly&&!b.dead&&b.playerSlot===slot);
    if(!occupied){ spawnPlayerBullet(slot); return; }
  }
}

function stepPlayerFrame(){
  const p=player;
  if(!p || !p.alive || p.deathFrames>0) return;

  if(p.shieldState==='active'){
    p.shieldCounter=(p.shieldCounter-1)&0xFF;
    if(p.shieldCounter===0xC0){
      // ShieldsExpired snaps the low three X bits to 3. Preserve that feel,
      // but clamp the result to the remake's deliberately wider signed range.
      p.x=clamp(Math.floor(p.x/8)*8+3,PLAYER_MIN_X,PLAYER_MAX_X);
      p.shieldState='cooldown';
      p.shieldCounter=difficultyConfig().shieldCooldownFrames;
      p.shieldTimer=p.shieldCounter/PHOENIX_HZ;
      setVectorShieldSound(false);
    }
  } else {
    if(p.shieldCounter>0){
      p.shieldCounter=(p.shieldCounter-1)&0xFF;
      if(p.shieldCounter===0){ p.shieldState='ready'; p.shieldTimer=0; }
      else p.shieldTimer=p.shieldCounter/PHOENIX_HZ;
    }
    let mv=0;
    const keyLeft=keys.has('ArrowLeft')||keys.has('KeyA');
    const keyRight=keys.has('ArrowRight')||keys.has('KeyD');
    if(keyLeft||keyRight){
      // ROM checks left first, so left wins if both directions are held.
      mv=keyLeft?-1:1;
    } else if(touchState.left||touchState.right){
      mv=touchState.left?-1:1;
    } else if(gamepadState.left||gamepadState.right){
      // Standard Gamepad API: D-pad or left stick. Like the ROM and keyboard,
      // left wins if a controller somehow reports both directions at once.
      mv=gamepadState.left?-1:1;
    }
    if(mv<0 && p.x>PLAYER_MIN_X) p.x-=1;
    else if(mv>0 && p.x<PLAYER_MAX_X) p.x+=1;
  }
  p.romPose=p.x&7;
  stepPlayerWeaponsFrame();
}

function beginPlayerDeath(){
  const p=player;
  if(!p || !p.alive || p.deathFrames>0 || TEST_INVULNERABLE) return;
  p.alive=false;
  p.deathFrames=0x60;
  setVectorShieldSound(false);
  VectorSynth.explosion('player');
  spawnPlayerShipExplosion(p.x+4,p.y+PLAYER_VECTOR_Y_OFFSET);
}
damagePlayer = beginPlayerDeath;
function keepFirstAlive(f,count){
  for(let i=0;i<f.birds.length;i++) f.birds[i].alive=i<count;
}
function keepTailAlive(f,count){
  const first=Math.max(0,f.birds.length-count);
  for(let i=0;i<f.birds.length;i++) f.birds[i].alive=i>=first;
}
function resetEnemyFormationAfterDeath(){
  const meta=ROUND_META[roundIndex];
  const level=cycle+roundIndex*0.25;
  if(currentFormation){
    const alive=currentFormation.birds.reduce((n,b)=>n+(b.alive?1:0),0);
    const fresh=new Formation(meta,level);
    if(meta.kind==='big'){
      prepareBigFormationFidelity(fresh);
      // L32B0 offsets both source and destination to the tail when fewer
      // than eight birds survive.
      keepTailAlive(fresh,alive);
    } else {
      prepareSmallFormationFidelity(fresh);
      // Alien init routines rebuild exactly AliensLeft records from slot 0.
      keepFirstAlive(fresh,alive);
    }
    currentFormation=fresh;
  }

function currentSmallOpcode(b,f){
  if(b.patternKind==='base') return ROM_BASE_PATTERN[f.basePatternStep]&0x1F;
  const p=b.pattern||ROM_BASE_PATTERN;
  const op=p[Math.min(b.patternStep,p.length-1)];
  return (op||1)&0x1F;
}
function updateSmallAlienAnimationPose(f){
  for(const b of f.birds){
    if(!b.alive) continue;
    const op=currentSmallOpcode(b,f);
    const d=SMALL_ANIM_DESC[op];
    if(!d) continue;
    const type=d[0], base=d[1], arr=SMALL_ANIM_TABLE[base];
    if(!arr) continue;
    const x=b.tickToX&0xFF, y=b.tickToY&0xFF;
    let idx;
    if(type===2) idx=(x>>>1)&3;
    else if(type===4) idx=(y>>>1)&3;
    else idx=((y>>>1)&3)+((x&4)?4:0);
    const code=arr[idx];
    if(code!==undefined && code!==0xFF) b.romShapeCode=code;
    const pose=((b.romShapeCode||0)>>>1)&3;
    b.romFlap=[0.08,0.38,0.82,0.38][pose];
  }
}
function scheduleSmallInterpolation(f,frames){
  for(const b of f.birds){
    if(!b.alive) continue;
    b.interpFromX=b.x; b.interpFromY=b.y;
    b.interpToX=b.tickToX&0xFF; b.interpToY=b.tickToY&0xFF;
    b.interpFrame=0; b.interpFrames=frames;
  }
}
function advanceSmallInterpolation(f){
  for(const b of f.birds){
    if(!b.alive) continue;
    if(!b.interpFrames){ b.x=b.tickToX; b.y=b.tickToY; continue; }
    b.interpFrame=Math.min(b.interpFrames,b.interpFrame+1);
    const t=b.interpFrame/b.interpFrames;
    b.x=lerpByte(b.interpFromX,b.interpToX,t);
    b.y=lerpByte(b.interpFromY,b.interpToY,t);
  }
}

smallRomRandom = function(){

romReloadAttackDelay = function(f,aliveCount){
  let c=romScaledMagnitude(f,aliveCount);
  let a=romCounter16&0xFF;
  if(a>=0x10) a=0x0F;
  c=((0x0F-a)+c)&0xFF;
  let b=1;
  for(let i=0;i<3;i++){
    if(f.groupTimers[i]!==0) continue;
    c=rrc8(c,1)&0x7F;
    if(b!==0){ b--; f.groupTimers[i]=0x0C; }
  }
  f.attackDelay=((rrc8(rrc8(c,1),1)&0x3F)+1)&0xFF;
};

trySmallAlienBombDrop = function trySmallAlienBombDropFidelity(f){
  if(enemyBulletCount()>=enemyBulletLimit()) return;
  const start=(f.behaviorCounter&1)?8:0; // Counter93 bit 0
  const end=Math.min(start+8,f.birds.length);
  const depth=((f.escalation<<3)+0xAD)&0xFF;
  const pb=mappedPlayerBounds();
  const left=(pb.left-0x0A)&0xFF;
  const right=(pb.right+0x03)&0xFF;
  for(let i=start;i<end;i++){
    const b=f.birds[i];
    if(!b.alive) continue;
    const x=b.tickToX&0xFF, y=b.tickToY&0xFF;
    const inX=left<=right ? (x>=left&&x<right) : (x>=left||x<right);
    if(!inX || y<0x80 || y>=depth) continue;
    // L25E0 decides from the ROM position; only the visible spawn point
    // follows the flown bird so bombs leave from where the bird is drawn.
    const ox=(b.flyX!==undefined)?Math.round(b.flyX-b.x):0;
    const oy=(b.flyY!==undefined)?Math.round(b.flyY-b.y):0;
    spawnEnemyBullet((x+4+ox)&0xFF,(y+12+oy)&0xFF);
    return;
  }
};

const SMALL_FORMATION_TILE_PAIRS={
  0x20:[0x60,0x61], 0x22:[0x62,0x63], 0x24:[0x64,0x65], 0x26:[0x66,0x67]
};
const SMALL_T1740=[
  [0x08,0x00, 0], [0x01,0x00,-8], [0x08,0x01, 2], [0x04,0x00,-6],
  [0x08,0x01, 4], [0x08,0x00,-4], [0x08,0x05, 6], [0x08,0x00,-2]
];
function formationTileMap(f){
  const map=new Map();
  for(const b of f.birds){
    if(!b.alive || b.patternKind!=='base') continue;
    const pair=SMALL_FORMATION_TILE_PAIRS[b.romShapeCode&0xFF];
    if(!pair) continue;
    const cx=(b.tickToX&0xF8), cy=(b.tickToY&0xF8);
    // L0788: first tile at the alien address, second one RightOneColumn.
    map.set(((cx&0xFF)<<8)|(cy&0xFF),pair[0]);
    if(pair[1]!==0) map.set(((((cx+8)&0xFF)<<8)|(cy&0xFF)),pair[1]);
  }
  return map;
}
function formationAlienHit(f,shot,tileMap){
  const sx=Math.round(shot.x)&0xFF, sy=Math.round(shot.y)&0xFF;
  const cellX=sx&0xF8, cellY=sy&0xF8;
  const ch=tileMap.get((cellX<<8)|cellY);
  if(ch===undefined || ch<0x60 || ch>=0x68) return null;
  const t=SMALL_T1740[ch-0x60];
  const px=sx&7;
  if(px<t[1] || px>=t[0]) return null;
  const targetX=(cellX+t[2])&0xFF;
  const targetY=cellY;
  // L0E70/L0E90 then finds the owning active alien from its byte coordinates.
  for(const b of f.birds){
    if(!b.alive) continue;
    const x=b.tickToX&0xFF, y=b.tickToY&0xFF;
    if(targetX>(x-3) && targetX<=((x+2)&0xFF) && (y&0xF8)===targetY) return b;
  }
  return null;
}
function processSmallBulletCollisions(f){
  if(f && f.entranceActive) return;
  for(const shot of bullets){
    if(!shot.friendly||shot.dead) continue;
    const seg=vcFriendlyBulletSegment(shot);
    for(const b of f.birds){
      if(!b.alive) continue;
      const poly=vcSmallBirdPoly(b);
      if(vcSegmentHitsPoly(seg.x1,seg.y1,seg.x2,seg.y2,poly)){
        shot.dead=true;
        destroySmallAlien(b,b.patternKind==='base'?20:smallKillScore(b));
        break;
      }
    }
  }
}
function processSmallPlayerCollision(f){
  if(f && f.entranceActive) return;
  if(!player||!player.alive) return;
  const shield=shieldIsActive();
  const playerPoly=shield?null:vcPlayerPoly();
  for(const b of f.birds){
    if(!b.alive) continue;
    const birdPoly=vcSmallBirdPoly(b);
    const hit=shield
      ? vcPolyHitsEllipse(birdPoly,player.x+4,player.y+PLAYER_SHIELD_Y_OFFSET,16.2,17.5)
      : vcPolysIntersect(birdPoly,playerPoly);
    if(!hit) continue;
    if(shield) destroySmallAlien(b,20);
    else { beginPlayerDeath(); destroySmallAlien(b,40); }
    return;
  }
}

function stepSmallMovement(f,framesToNext){

function bossHousekeepingFrame(b){
  if(!b||b.state!=='active') return;
  // L24E0 sees the OLD $43AA, then L24C4 increments it.
  if((b.houseCounter&0x0F)===0 && b.counterB9>=0xA0){

    b.y=Math.min(b.entryY+((0xF9-b.counterB9)&0xFF),b.entryY+0x5A); // stops at CounterB9=$9F
  }

/* ---------- sweeping flight: small birds chase their ROM "ghost" ----------
   The ROM still moves every small bird exactly as before (b.x/b.y, patterns,
   timing). This layer flies a visible bird that chases that ghost with
   momentum, aiming slightly ahead along the known pattern, so sharp ROM
   turns become banked arcs. Collision, bombs and effects use the flown
   position; its distance from the ghost is capped for fairness.            */
const FLIGHT_SWEEP_BY_DIFFICULTY={relaxed:1, standard:1, arcade:1};  // 0 = pure ROM, 1 = max sweep
const FLIGHT_MAX_DEVIATION=12;   // world px the flown bird may stray from the ROM ghost
const FLIGHT_SNAP_DISTANCE=40;   // further than this (wrap, respawn, reset): snap to the ghost

function flightSweep(){
  const v=FLIGHT_SWEEP_BY_DIFFICULTY[difficultyKey];
  return v===undefined ? 1 : clamp(v,0,1);
}
function flightActive(b){ return flightSweep()>0.01 && b.flyX!==undefined; }
function unwrapNear(ref,v){ return ref+(((v-ref+128)&255)-128); }

// Where the ROM ghost will be `leadTicks` movement ticks from now, found by
// reading ahead through the bird's own pattern (no state is modified).
function smallGhostLead(b,leadTicks){
  const fromX=b.interpFromX!==undefined?b.interpFromX:b.x;
  const fromY=b.interpFromY!==undefined?b.interpFromY:b.y;
  const toX=unwrapNear(fromX,b.interpToX!==undefined?b.interpToX:b.x);
  const toY=unwrapNear(fromY,b.interpToY!==undefined?b.interpToY:b.y);
  const t=b.interpFrames?clamp(b.interpFrame/b.interpFrames,0,1):1;
  const q=[[fromX,fromY],[toX,toY]];
  if(b.patternKind!=='base' && b.pattern){
    let x=toX,y=toY,step=b.patternStep|0;
    for(let k=0;k<Math.ceil(leadTicks)+1;k++){
      const op=b.pattern[step]; if(!op) break;
      const mv=ROM_MOVE_TABLE[op]; if(!mv) break;
      x+=mv[0]; y+=mv[1]; q.push([x,y]);
      const g=mv[1]!==0?y:x;
      if((g&7)===0) step++;
    }
  }
  const s=Math.min(t+leadTicks,q.length-1);
  const i=Math.min(Math.floor(s),q.length-2), fr=s-i;
  return [q[i][0]+(q[i+1][0]-q[i][0])*fr, q[i][1]+(q[i+1][1]-q[i][1])*fr];
}

// Advance every small bird's flown position by one ROM frame.
function updateSmallFlight(f){
  if(!f||!f.birds) return;
  const s=flightSweep(), dt=PHOENIX_FRAME;
  const lead=s*3.5, freq=6-s*4.8, w=2*Math.PI*freq, z=0.72, amax=3000-s*2600;
  for(const b of f.birds){
    if(!b.alive) continue;
    const gx=b.x, gy=b.y;
    const far=b.flyX!==undefined && Math.hypot(b.flyX-gx,b.flyY-gy)>FLIGHT_SNAP_DISTANCE;
    if(b.flyX===undefined || s<=0.01 || far){
      b.flyX=b.flyPX=gx; b.flyY=b.flyPY=gy; b.flyVX=0; b.flyVY=0; b.flyBank=0;
      b.flyAng=(b.patternKind==='base'||b.angle===undefined)?-Math.PI/2:b.angle;
      continue;
    }
    b.flyPX=b.flyX; b.flyPY=b.flyY;
    const tgt=smallGhostLead(b,lead);
    for(let k=0;k<4;k++){
      const h=dt/4;
      let ax=w*w*(tgt[0]-b.flyX)-2*z*w*b.flyVX;
      let ay=w*w*(tgt[1]-b.flyY)-2*z*w*b.flyVY;
      const am=Math.hypot(ax,ay); if(am>amax){ ax*=amax/am; ay*=amax/am; }
      b.flyVX+=ax*h; b.flyVY+=ay*h;
      b.flyX+=b.flyVX*h; b.flyY+=b.flyVY*h;
    }
    // fairness: never more than FLIGHT_MAX_DEVIATION from the ROM ghost
    const dx=b.flyX-gx, dy=b.flyY-gy, d=Math.hypot(dx,dy);
    if(d>FLIGHT_MAX_DEVIATION){
      const k=FLIGHT_MAX_DEVIATION/d; b.flyX=gx+dx*k; b.flyY=gy+dy*k;
      const nx=dx/d, ny=dy/d, vo=b.flyVX*nx+b.flyVY*ny;
      if(vo>0){ b.flyVX-=vo*nx; b.flyVY-=vo*ny; }
    }
    // heading follows the flown velocity; formation birds settle to upright
    const sp=Math.hypot(b.flyVX,b.flyVY);
    const want=b.patternKind==='base' ? -Math.PI/2 : (sp>3 ? Math.atan2(b.flyVY,b.flyVX) : b.flyAng);
    let da=want-b.flyAng;
    while(da>Math.PI) da-=2*Math.PI;
    while(da<-Math.PI) da+=2*Math.PI;
    const turn=da*Math.min(1,dt*14);
    b.flyAng+=turn;
    b.flyBank+=(Math.min(0.35,Math.abs(turn)/dt*0.05)-b.flyBank)*Math.min(1,dt*8);
  }
}
// Render position, interpolated between ROM frames for smooth drawing.
function smallFlightPos(b){
  if(!flightActive(b)) return [b.x,b.y];
  const a=phoenixRenderAlpha;
  return [b.flyPX+(b.flyX-b.flyPX)*a, b.flyPY+(b.flyY-b.flyPY)*a];
}

function stepSmallLevelDispatcher(f){
  if(f.entranceActive){
    stepSmallFormationEntrance(f);
    updateSmallAlienAnimationPose(f);
    return;
  }
  advanceSmallInterpolation(f);
  updateSmallFlight(f);
  stepSmallVisualFormation(f);
  const alive=f.birds.reduce((n,b)=>n+(b.alive?1:0),0);
  const phase=f.movementCounter&3;
  f.movementCounter=(f.movementCounter+1)&0xFF;

  if(alive===0){
    if(f.isMothershipEscort){
      // L21BA: only the odd phase reloads the level-B 16-alien escort.
      if(phase&1){ stepEnemyBulletsFrame(); bossHousekeepingFrame(currentBoss); resetBossEscortFormation(); }
      return;
    }
    if(phase&1) stepEnemyBulletsFrame();
    f.clearCounter++;
    if(f.clearCounter>=0x60) advanceRound();
    return;
  }

  // L2130 flips permanently into the fast two-phase dispatcher once <5 remain.
  if(!f.fastMode && alive<5 && phase===0) f.fastMode=true;

  if(f.fastMode){
    if((phase&1)===0){
      stepAlienBehaviorScheduler(f,alive);
      processSmallPlayerCollision(f);
      trySmallAlienBombDrop(f);
      stepEnemyBulletsFrame();
    } else {
      stepSmallMovement(f,2);
      updateSmallAlienAnimationPose(f);
      if(f.isMothershipEscort) bossHousekeepingFrame(currentBoss);
    }
    return;
  }

  switch(phase){
    case 0:
      stepAlienBehaviorScheduler(f,alive);
      processSmallPlayerCollision(f);
      break;
    case 1:
      if(f.isMothershipEscort) bossHousekeepingFrame(currentBoss);
      stepEnemyBulletsFrame();
      stepSmallMovement(f,4);
      break;
    case 2:
      updateSmallAlienAnimationPose(f);
      trySmallAlienBombDrop(f);
      break;
    case 3:
      if(f.isMothershipEscort) bossHousekeepingFrame(currentBoss);
      stepEnemyBulletsFrame();
      break;
  }
}

function buildBigBirdCollisionVRAM(f){

  // We do not render these sprite bytes; they exist only so L3800's collision
  // masks can be reproduced exactly while the visible bird remains vector art.
  const vram=new Map();
  for(const b of f.birds){
    if(!b.alive) continue;
    let width=BIG_BIRD_WIDTH_BY_STATE[(b.growthState|0)&0x0F]||0;
    let ptr=bigBirdShapePointer(b);
    if(width<=0 || ptr<0) continue;
    let addr=b.screenAddr&0xFFFF;

    // bottom of the background page. It advances the shape pointer in lockstep.
    if((addr>>>8)===0x4B){

function processBigBirdBulletCollisions(f){
  for(const shot of bullets){
    if(!shot.friendly||shot.dead) continue;
    const seg=vcFriendlyBulletSegment(shot);
    for(const bird of f.birds){
      if(!bird.alive) continue;
      // L3800: displayed characters below $90 pass through untouched. The
      // initial star/hatch state is therefore invulnerable, but states 2+ are not.
      if((bird.growthState|0)===1) continue;
      const g=vcBigBirdGeometry(bird);
      if(g.egg){
        if(vcSegmentHitsEllipse(seg.x1,seg.y1,seg.x2,seg.y2,g.egg.cx,g.egg.cy,g.egg.rx,g.egg.ry)){
          shot.dead=true;
          hitBigBirdBody(bird,shot.x,shot.y,14);
          break;
        }
        continue;
      }
      const visible=vcBigBirdVisibleParts(bird,g);
      // Body wins where the wing root overlaps it, matching the visible glyph.
      if(g.body&&vcSegmentHitsPoly(seg.x1,seg.y1,seg.x2,seg.y2,g.body)){
        shot.dead=true; hitBigBirdBody(bird,shot.x,shot.y,24); break;
      }
      if(visible.left&&vcSegmentHitsPoly(seg.x1,seg.y1,seg.x2,seg.y2,g.left)){
        shot.dead=true; hitBigBirdWing(bird,'left',shot.x,shot.y); break;
      }
      if(visible.right&&vcSegmentHitsPoly(seg.x1,seg.y1,seg.x2,seg.y2,g.right)){
        shot.dead=true; hitBigBirdWing(bird,'right',shot.x,shot.y); break;
      }
    }
  }
