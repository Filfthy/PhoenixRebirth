<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PHOENIX — Arcade Revival</title>
<style>
  :root{
    --bg-void:#07050c;
    --fire-1:#ff3b1f;
    --fire-2:#ff8c1a;
    --fire-3:#ffd23f;
    --ice:#39d6ff;
    --ice-dim:#1a4a5c;
    --paper:#f5efe6;
    --paper-dim:#a89e90;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body, body *{
    user-select:none;
    -webkit-user-select:none;
    -moz-user-select:none;
  }
  html,body{height:100%; background:#07091b; overflow:hidden;}
  body{
    font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;
    color:var(--paper);
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  #cabinet{
    position:relative;
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    padding:12px;
    padding-top:calc(12px + env(safe-area-inset-top,0px));
    padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
    overflow:hidden;
    isolation:isolate;
    background-color:#07091b;
    background-image:
      radial-gradient(circle at 6% 14%, rgba(255,162,43,0.18) 0 1.5px, transparent 2px),
      radial-gradient(circle at 18% 72%, rgba(198,88,255,0.16) 0 1.8px, transparent 2.4px),
      radial-gradient(circle at 66% 26%, rgba(255,239,255,0.70) 0 1px, transparent 3px),
      radial-gradient(circle at 83% 76%, rgba(255,255,255,0.50) 0 1px, transparent 2.8px),
      radial-gradient(circle at 74% 40%, rgba(255,116,32,0.20) 0 3px, transparent 4.5px),
      linear-gradient(rgba(33,78,180,0.22) 1px, transparent 1px),
      linear-gradient(90deg, rgba(33,78,180,0.22) 1px, transparent 1px),
      linear-gradient(180deg, #0a0d25 0%, #060817 100%);
    background-size:100% 100%,100% 100%,100% 100%,100% 100%,100% 100%,40px 40px,40px 40px,100% 100%;
    background-position:center,center,center,center,center,0 0,0 0,center;
  }
  #cabinet::before{
    content:'';
    position:absolute; inset:0;
    z-index:0;
    pointer-events:none;
    background:
      linear-gradient(145deg, transparent 0 12%, rgba(255,164,33,0.82) 12% 12.8%, transparent 13.2% 100%),
      linear-gradient(122deg, transparent 0 9%, rgba(255,72,171,0.75) 9% 9.7%, transparent 10.1% 100%),
      linear-gradient(25deg, transparent 0 77%, rgba(255,169,34,0.85) 77% 77.8%, transparent 78.2% 100%),
      linear-gradient(205deg, transparent 0 82%, rgba(255,84,163,0.72) 82% 82.7%, transparent 83.1% 100%),
      radial-gradient(circle at 91% 16%, rgba(255,131,41,0.92) 0 16px, transparent 17px),
      radial-gradient(circle at 8% 76%, rgba(255,131,41,0.85) 0 20px, transparent 21px),
      radial-gradient(circle at 78% 70%, rgba(194,78,255,0.72) 0 10px, transparent 11px);
    opacity:0.28;
  }
  #cabinet::after{
    content:'';
    position:absolute; inset:0;
    z-index:0;
    pointer-events:none;
    background:
      linear-gradient(135deg, transparent 0 3.9%, rgba(255,206,77,0.85) 4% 8%, rgba(237,94,220,0.82) 8.2% 12.4%, rgba(81,118,255,0.85) 12.6% 16.8%, transparent 17.2% 100%),
      linear-gradient(319deg, transparent 0 5.5%, rgba(255,208,96,0.84) 5.7% 9.7%, rgba(241,102,224,0.78) 9.9% 13.5%, rgba(91,127,255,0.82) 13.7% 17.3%, transparent 17.7% 100%),
      linear-gradient(340deg, transparent 0 85.8%, rgba(255,182,45,0.90) 86% 86.8%, transparent 87.1% 100%),
      linear-gradient(28deg, transparent 0 88.5%, rgba(255,72,171,0.86) 88.7% 89.4%, transparent 89.8% 100%);
    background-size:240px 240px, 260px 260px, 100% 100%, 100% 100%;
    background-position:-58px -42px, calc(100% + 76px) calc(100% + 48px), center, center;
    background-repeat:no-repeat;
    opacity:0.24;
  }
  #cabinet:fullscreen{ background-color:#07091b; }
  #frame{
    position:relative;
    z-index:1;
    width:min(calc(100vw - 24px), calc((100vh - 24px) * 1.15625));
    aspect-ratio:296 / 256;
    height:auto;
    border-radius:20px;
    padding:0;
    background:linear-gradient(155deg, rgba(9,11,20,0.98), rgba(5,7,14,0.98) 48%, rgba(3,4,8,0.99) 100%);
    box-shadow:
      0 0 0 1px rgba(76,98,170,0.26) inset,
      0 24px 54px rgba(0,0,0,0.62);
  }
  #screen{
    position:relative;
    width:100%; height:100%;
    border-radius:9px;
    overflow:hidden;
    display:flex;
    background:#000000;
    box-shadow:0 0 0 2px rgba(0,0,0,0.88) inset;
  }
  #playfield{
    position:relative;
    flex:0 0 70.27027%;
    height:100%;
    overflow:hidden;
    background:#000000;
    box-shadow:0 0 0 1px rgba(0,0,0,0.7) inset;
  }
  #sidebar{
    position:relative;
    flex:0 0 29.72973%;
    height:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:12px 10px;
    background:#000000;
    border-left:1px solid rgba(245,239,230,0.14);
  }
  canvas#game{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  body.title-mode #playfield,
  body.gameover-mode #playfield{ flex-basis:100%; }
  body.title-mode #sidebar,
  body.gameover-mode #sidebar{ display:none; }
  body.title-mode #screen,
  body.gameover-mode #screen{ background:#000000; }

  #hud{
    display:flex; flex-direction:column; gap:10px;
    font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;
    font-size:11px;
    letter-spacing:0.45px;
    pointer-events:none;
  }
  .hud-block{ display:flex; flex-direction:column; gap:5px; }
  .hud-label{ color:var(--paper-dim); font-size:9px; }
  .hud-value{ color:var(--fire-3); font-size:12px; line-height:1.35; }
  .side-section{
    display:flex; flex-direction:column; gap:7px;
    padding-top:10px;
    border-top:1px solid rgba(255,255,255,0.08);
  }
  .side-title{
    font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;
    font-size:9px;
    color:var(--paper-dim);
    letter-spacing:0.6px;
  }
  .volume-heading{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .volume-value{
    font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;
    font-size:8px; color:var(--paper);
    letter-spacing:0;
  }
  .volume-slider{
    width:100%; height:12px; margin:0;
    appearance:none; -webkit-appearance:none;
    background:transparent; cursor:pointer;
  }
  .volume-slider:focus{ outline:none; }
  .volume-slider::-webkit-slider-runnable-track{
    height:7px; box-sizing:border-box;
    border:1px solid rgba(255,210,63,0.45); border-radius:0;
    background:
      repeating-linear-gradient(90deg,rgba(255,210,63,0.34) 0 1px,transparent 1px 8px);
  }
  .volume-slider::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:8px; height:8px; margin-top:-1.5px;
    border:1px solid #ffd23f; background:#000; border-radius:0;
    transform:rotate(45deg);
  }
  .volume-slider::-moz-range-track{
    height:7px; box-sizing:border-box;
    border:1px solid rgba(255,210,63,0.45); border-radius:0;
    background:
      repeating-linear-gradient(90deg,rgba(255,210,63,0.34) 0 1px,transparent 1px 8px);
  }
  .volume-slider::-moz-range-progress{ background:transparent; }
  .volume-slider::-moz-range-thumb{
    width:8px; height:8px;
    border:1px solid #ffd23f; background:#000; border-radius:0;
    transform:rotate(45deg);
  }

  .cheat-section{ gap:6px; }
  /* Development cheats remain implemented but are hidden from the shipped UI. */
  #cheat-panel{ display:none !important; }
  .cheat-toggle{
    display:flex; align-items:center; gap:6px;
    font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;
    font-size:8px; line-height:1.4; color:var(--paper-dim);
    cursor:pointer; user-select:none;
  }
  .cheat-toggle input{
    margin:0; width:12px; height:12px; accent-color:#39d6ff;
  }
  .cheat-note{
    font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;
    font-size:7px; line-height:1.45; color:rgba(220,235,225,0.50);
  }

  #lives-wrap{ display:flex; flex-direction:row; flex-wrap:nowrap; gap:5px; align-items:center; justify-content:flex-start; }
  .life-icon{
    width:30px; height:22px; display:block; background:transparent;
  }

  #shieldbar-wrap{
    width:100%;
    font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace; font-size:9px; color:var(--paper-dim);
    margin-top:0;
  }
  #sidebar-bottom{
    margin-top:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
    min-height:0;
  }
  #sidebar-brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    padding:6px 6px 2px;
  }
  #sidebar-brand img{
    display:block;
    width:min(36%, 63px);
    height:auto;
    object-fit:contain;
  }
  #sidebar-brand .bugvictim-credit{
    width:100%;
    text-align:center;
    font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;
    font-size:9px;
    line-height:1.1;
    letter-spacing:1px;
    color:var(--paper-dim);
  }
  body.touch #shieldbar-wrap{ bottom:auto; }
  #shieldbar-track{
    width:100%; height:7px; box-sizing:border-box; overflow:hidden; margin-top:4px;
    border-radius:0; background:transparent;
    border:1px solid rgba(57,214,255,0.42);
    background-image:
      repeating-linear-gradient(90deg,rgba(57,214,255,0.11) 0 1px,transparent 1px 7px);
  }
  #shield-fill{
    height:100%; width:100%; color:#39d6ff; background:transparent;
    transition:width .08s linear; position:relative;
    background-image:
      repeating-linear-gradient(90deg,currentColor 0 1px,transparent 1px 7px);
  }
  #shield-fill::after{
    content:''; position:absolute; right:0; top:0; bottom:0; width:1px;
    background:currentColor;
  }

  .overlay{
    position:absolute; inset:0;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; text-align:center; padding:28px; z-index:10;
    background:radial-gradient(ellipse at 50% 30%, rgba(255,60,20,0.15), transparent 60%), rgba(5,3,10,0.9);
  }
  .overlay.show{ display:flex; }
  .overlay-birds{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; }
  .overlay > :not(.overlay-birds){ position:relative; z-index:1; }
  .logo{
    font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;
    font-size:clamp(26px, 8.5vw, 40px);
    color:var(--fire-3);
    letter-spacing:3px;
  }
  .logo small{ display:block; font-size:9px; color:var(--ice); letter-spacing:3px; margin-top:12px; }
  .hint{ font-size:11px; line-height:1.8; color:var(--paper-dim); max-width:290px; }
  .hint b{ color:var(--paper); font-weight:600; }
  .btn{
    font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;
    font-size:11px;
    padding:14px 26px;
    color:#1a0e06;
    background:linear-gradient(180deg, var(--fire-3), var(--fire-2));
    border:none; border-radius:6px; cursor:pointer;
    box-shadow:0 4px 0 #a4400d;
    letter-spacing:1px;
  }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #a4400d; }
  .btn:focus-visible{ outline:3px solid var(--ice); outline-offset:3px; }
  #final-score, #final-hi{ color:var(--fire-3); }
  .difficulty-buttons{
    display:flex; flex-wrap:wrap; align-items:stretch; justify-content:center; gap:10px;
    margin:14px 0 12px;
  }
  .difficulty-btn{
    min-width:126px; padding:12px 13px 10px; line-height:1.25;
  }
  .difficulty-btn small{
    display:block; margin-top:7px; color:#4b2410; font-size:6px; line-height:1.45;
    letter-spacing:0; white-space:normal;
  }
  .difficulty-btn[data-start-difficulty="standard"],
  .difficulty-btn[data-restart-difficulty="standard"]{
    box-shadow:0 4px 0 #a4400d, 0 0 0 1px rgba(57,214,255,.32);
  }
  .difficulty-note{ min-height:20px; max-width:500px; margin:3px auto 8px !important; }
  body.touch #controls-hint{ display:none; }

  #touch-controls{
    position:absolute; left:0; right:0; bottom:0;
    display:none; justify-content:space-between; align-items:flex-end;
    padding:14px; padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
    z-index:8;
  }
  body.touch #touch-controls{ display:flex; }
  .tc-group{ display:flex; gap:10px; }
  .tc-btn{
    width:54px; height:54px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(20,10,20,0.55);
    border:1px solid rgba(255,140,26,0.35);
    color:var(--fire-3); font-size:18px;
    user-select:none; -webkit-user-select:none;
  }
  .tc-btn.active{ background:rgba(255,90,30,0.35); }
  #tc-shield.active{ background:rgba(57,214,255,0.35); border-color:var(--ice); color:var(--ice); }
  .tc-btn:focus-visible{ outline:2px solid var(--ice); }

  #title-screen{
    background:transparent;
    justify-content:flex-start;
    gap:12px;
    padding:14px 24px 18px;
  }
  #title-screen .logo-canvas{
    width:min(76%, 520px);
    margin:-8px auto 2px;
  }
  #title-screen .start-frame{
    position:absolute;
    top:51.5%;
    left:50%;
    transform:translateX(-50%);
    width:min(52%, 300px);
    margin-top:0;
    padding:13px 14px 14px;
    border:1px solid rgba(255,210,63,0.42);
    border-radius:14px;
    background:transparent;
  }
  #title-screen .start-label{
    margin:0 0 10px;
    font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;
    font-size:12px;
    letter-spacing:1.4px;
    color:var(--fire-3);
  }
  #title-screen #controls-hint{
    position:absolute;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    width:min(88%, 560px);
    max-width:none;
    margin:0;
  }
  #title-screen .difficulty-buttons{
    margin:0;
    gap:8px;
    flex-wrap:nowrap;
    flex-direction:column;
    align-items:stretch;
  }
  #title-screen .difficulty-btn{
    min-width:0;
    width:100%;
    flex:0 0 auto;
    padding:11px 10px 9px;
    color:var(--paper);
    background:transparent;
    border:1px solid rgba(245,239,230,0.34);
    border-radius:8px;
    box-shadow:none;
  }
  #title-screen .difficulty-btn small{
    color:var(--paper-dim);
  }
  #title-screen .difficulty-btn:hover,
  #title-screen .difficulty-btn:focus-visible{
    border-color:rgba(255,210,63,0.78);
    color:var(--fire-3);
    background:rgba(255,210,63,0.045);
    box-shadow:none;
  }
  #title-screen .difficulty-btn:active{
    transform:translateY(1px);
    box-shadow:none;
  }
  #title-screen .difficulty-btn[data-start-difficulty="standard"]{
    box-shadow:none;
  }

  #gameover-screen{
    background:transparent;
    justify-content:flex-start;
    gap:12px;
    padding:14px 24px 18px;
  }
  #gameover-screen .logo-canvas{
    width:min(76%, 520px);
    margin:-8px auto 2px;
  }
  #gameover-screen .gameover-frame{
    position:absolute;
    top:31.5%;
    left:50%;
    transform:translateX(-50%);
    width:min(52%, 300px);
    padding:0;
    border:0;
    border-radius:0;
    background:transparent;
  }
  #gameover-screen .replay-frame{
    position:absolute;
    top:51.5%;
    left:50%;
    transform:translateX(-50%);
    width:min(52%, 300px);
    margin-top:0;
    padding:13px 14px 14px;
    border:1px solid rgba(255,210,63,0.42);
    border-radius:14px;
    background:transparent;
  }
  #gameover-screen .gameover-title,
  #gameover-screen .replay-label{
    font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;
    font-size:12px;
    letter-spacing:1.4px;
    color:var(--fire-3);
  }
  #gameover-screen .gameover-title{ margin-bottom:12px; }
  #gameover-screen .score-card{
    display:grid;
    grid-template-columns:1fr auto;
    gap:7px 14px;
    align-items:center;
    padding:10px 0 12px;
    border-top:1px solid rgba(255,255,255,0.10);
    border-bottom:1px solid rgba(255,255,255,0.10);
    font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;
    font-size:10px;
    line-height:1.35;
    text-align:left;
  }
  #gameover-screen .score-label{ color:var(--paper-dim); }
  #gameover-screen .score-value{ color:var(--paper); text-align:right; }
  #gameover-screen #final-score,
  #gameover-screen #final-hi{ color:var(--fire-3); }
  #gameover-screen #final-difficulty{ color:var(--ice); }
  #gameover-screen .replay-label{ margin:0 0 10px; }
  #gameover-screen .difficulty-buttons{
    margin:0;
    gap:8px;
    flex-wrap:nowrap;
    flex-direction:column;
    align-items:stretch;
  }
  #gameover-screen .difficulty-btn{
    min-width:0;
    width:100%;
    flex:0 0 auto;
    padding:11px 10px 9px;
    color:var(--paper);
    background:transparent;
    border:1px solid rgba(245,239,230,0.34);
    border-radius:8px;
    box-shadow:none;
  }
  #gameover-screen .difficulty-btn small{ color:var(--paper-dim); }
  #gameover-screen .difficulty-btn:hover,
  #gameover-screen .difficulty-btn:focus-visible{
    border-color:rgba(255,210,63,0.78);
    color:var(--fire-3);
    background:rgba(255,210,63,0.045);
    box-shadow:none;
  }
  #gameover-screen .difficulty-btn:active{
    transform:translateY(1px);
    box-shadow:none;
  }
  #gameover-screen .difficulty-btn[data-restart-difficulty="standard"]{ box-shadow:none; }

  .logo-canvas{
    display:block;
    width:min(92%, 520px);
    aspect-ratio:5 / 2;
    margin:0 auto;
  }
  .logo-canvas--sidebar{
    width:100%;
    max-width:none;
  }


  /* Fullscreen/focus capture front door. Kept separate from the normal
     Start and Game Over screens. */
  #capture-gate{
    position:fixed; inset:0; z-index:1000;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    background:#000; color:#fff;
    cursor:pointer;
    user-select:none; -webkit-user-select:none;
  }
  #capture-gate[hidden]{ display:none; }
  #capture-stars,
  #capture-birds{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
    pointer-events:none;
  }
  #capture-stars{ z-index:0; }
  #capture-birds{ z-index:0; }
  #capture-gate .capture-inner{
    position:relative; z-index:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px;
    width:min(92vw,780px);
    padding:24px 26px 28px;
    text-align:center;
  }
  #capture-gate .capture-phoenix-logo{
    display:block;
    width:min(82vw,680px);
    max-width:100%;
    aspect-ratio:5 / 2;
    margin:-10px auto -4px;
  }
  #capture-brand{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px;
    margin-top:-2px;
  }
  #capture-brand img{
    display:block;
    width:min(13vw,86px);
    min-width:58px;
    height:auto;
  }
  #capture-brand .capture-brand-text{
    font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;
    font-size:clamp(10px,1.4vw,14px);
    letter-spacing:1.2px;
    color:#fff;
  }
  #capture-enter{
    appearance:none; -webkit-appearance:none;
    border:0; padding:7px 10px;
    margin:6px 0 2px;
    background:transparent;
    cursor:pointer;
    font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;
    font-size:clamp(27px,5vw,58px);
    line-height:1.05;
    letter-spacing:clamp(1.5px,.45vw,4px);
    color:transparent;
    -webkit-text-stroke:1.15px #fff;
    text-transform:uppercase;
    white-space:nowrap;
  }
  @supports not (-webkit-text-stroke: 1px white){
    #capture-enter{ color:#fff; }
  }
  #capture-enter:hover{
    -webkit-text-stroke-color:var(--fire-3);
  }
  #capture-enter:focus-visible{
    outline:1px solid rgba(255,255,255,.75);
    outline-offset:5px;
  }
  #capture-volume{
    width:min(74vw,420px);
    padding:9px 14px 12px;
    cursor:default;
  }
  #capture-volume .volume-heading{
    margin-bottom:6px;
    font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;
    font-size:9px;
    letter-spacing:.8px;
    color:var(--paper-dim);
  }
  /* Larger capture-screen slider target only. The in-game/sidebar sliders

    width:15px;
    height:15px;
    margin-top:-4px;
    border-width:1px;
  }

    height:9px;
  }
  #capture-volume .volume-slider::-moz-range-thumb{
    width:15px;
    height:15px;
    border-width:1px;
  }

      const following = points[Math.min(points.length - 1, index + 2)]
      const control1X = current[0] + (next[0] - previous[0]) / 6
      const control1Y = current[1] + (next[1] - previous[1]) / 6
      const control2X = next[0] - (following[0] - current[0]) / 6
      const control2Y = next[1] - (following[1] - current[1]) / 6

      context.bezierCurveTo(
        control1X,
        control1Y,
        control2X,
        control2Y,
        next[0],
        next[1]
      )
    }
  }

  static applyTransforms(context, transforms) {
    for (const transform of transforms) {
      context.transform(...transform)
    }
  }

  static strokePath(context, path, transforms, colour) {
    context.save()
    MarchingBird.applyTransforms(context, transforms)
    context.strokeStyle = colour
    context.stroke(path)
    context.restore()
  }

  static drawEye(context, eye) {
    context.save()
    MarchingBird.applyTransforms(context, eye.transforms)
    context.beginPath()
    context.ellipse(eye.cx, eye.cy, eye.rx, eye.ry, 0, 0, Math.PI * 2)
    context.fillStyle = MarchingBird.COLOURS.mask
    context.strokeStyle = MarchingBird.COLOURS.eye
    context.fill()
    context.stroke()
    context.restore()
  }

  static drawBodyMask(context) {
    context.beginPath()
    context.moveTo(170, 43)
    context.bezierCurveTo(158, 44, 151, 58, 149, 78)
    context.bezierCurveTo(147, 98, 149, 122, 157, 136)
    context.bezierCurveTo(161, 142, 165, 145, 170, 145)
    context.bezierCurveTo(175, 145, 179, 142, 183, 136)
    context.bezierCurveTo(191, 122, 193, 98, 191, 78)
    context.bezierCurveTo(189, 58, 182, 44, 170, 43)
    context.closePath()
    context.fillStyle = MarchingBird.COLOURS.mask
    context.fill()
  }

  static drawBody(context, localLineWidth) {
    const prepared = MarchingBird.prepareBody()
    const crop = MarchingBird.BODY.crop

    context.save()
    context.translate(prepared.offsetX, prepared.offsetY)
    context.scale(prepared.fitScale, prepared.fitScale)
    context.translate(-crop.x, -crop.y)
    context.lineWidth = localLineWidth / prepared.fitScale
    context.lineCap = 'round'
    context.lineJoin = 'round'

    for (const bodyPath of prepared.paths) {
      MarchingBird.strokePath(
        context,
        bodyPath.path,
        bodyPath.transforms,
        MarchingBird.COLOURS.body
      )
    }

    for (const eye of MarchingBird.BODY.eyes) {
      MarchingBird.drawEye(context, eye)
    }

    context.restore()
  }

  static drawWingPair(context, wingPoints) {
    const leftAnchors = MarchingBird.LEFT_WING_ANCHORS
    const rightAnchors = MarchingBird.RIGHT_WING_ANCHORS
    const anchoredLeftWing = MarchingBird.anchorWing(
      wingPoints,
      leftAnchors.upper,
      leftAnchors.lower
    )
    const mirroredWing = MarchingBird.mirrorPoints(wingPoints)
    const anchoredRightWing = MarchingBird.anchorWing(
      mirroredWing,
      rightAnchors.upper,
      rightAnchors.lower
    )

    context.strokeStyle = MarchingBird.COLOURS.wing
    MarchingBird.traceSmoothPath(context, anchoredLeftWing)
    context.stroke()
    MarchingBird.traceSmoothPath(context, anchoredRightWing)
    context.stroke()
  }

  static drawFeet(context, feet) {
    context.strokeStyle = MarchingBird.COLOURS.body

    for (const foot of feet) {
      context.beginPath()
      context.moveTo(foot[0][0], foot[0][1])
      for (let index = 1; index < foot.length; index += 1) {
        context.lineTo(foot[index][0], foot[index][1])
      }
      context.stroke()

      const mirroredFoot = MarchingBird.mirrorPoints(foot)
      context.beginPath()
      context.moveTo(mirroredFoot[0][0], mirroredFoot[0][1])
      for (let index = 1; index < mirroredFoot.length; index += 1) {
        context.lineTo(mirroredFoot[index][0], mirroredFoot[index][1])
      }
      context.stroke()
    }
  }

  static drawAtPhase(context, x, y, scale, lineWidth, phase) {
    const clampedPhase = Math.max(0, Math.min(1, phase))
    const localLineWidth = lineWidth / Math.max(scale, 0.0001)
    const wings = MarchingBird.tweenPointSets(
      MarchingBird.MEDIUM_WING,
      MarchingBird.SMALL_WING,
      clampedPhase
    )
    const feet = MarchingBird.MEDIUM_FEET.map((foot, index) =>
      MarchingBird.tweenPointSets(foot, MarchingBird.SMALL_FEET[index], clampedPhase)
    )

    context.save()
    context.translate(
      x + MarchingBird.WIDTH * 0.5 * scale,
      y + MarchingBird.HEIGHT * 0.5 * scale
    )
    context.scale(scale, scale)
    context.translate(-MarchingBird.WIDTH * 0.5, -MarchingBird.HEIGHT * 0.5)
    context.lineWidth = localLineWidth
    context.lineCap = 'round'
    context.lineJoin = 'round'

    MarchingBird.drawWingPair(context, wings)
    MarchingBird.drawBodyMask(context)
    MarchingBird.drawBody(context, localLineWidth)
    MarchingBird.drawFeet(context, feet)

    context.restore()
  }

  draw(context, x, y, scale, lineWidth, timeMs) {
    MarchingBird.drawAtPhase(
      context,
      x,
      y,
      scale,
      lineWidth,
      MarchingBird.getAnimationPhase(timeMs)
    )
  }
}

  static smoothstep(amount) { return amount * amount * (3 - 2 * amount) }

    const wrapped = ((timeMs % MarchingDuck.CYCLE_DURATION) + MarchingDuck.CYCLE_DURATION) % MarchingDuck.CYCLE_DURATION

    const raw = wrapped < halfCycle ? wrapped / halfCycle : 1 - (wrapped - halfCycle) / halfCycle

  static cubicPoint(start, control1, control2, end, amount) {
    const inverse = 1 - amount
    const inverseSquared = inverse * inverse
    const amountSquared = amount * amount

      x: inverseSquared * inverse * start.x + 3 * inverseSquared * amount * control1.x + 3 * inverse * amountSquared * control2.x + amountSquared * amount * end.x,
      y: inverseSquared * inverse * start.y + 3 * inverseSquared * amount * control1.y + 3 * inverse * amountSquared * control2.y + amountSquared * amount * end.y
    }
  }

    const tokens = pathData.match(/[A-Za-z]|[-+]?(?:\d*\.\d+|\d+\.?)(?:[eE][-+]?\d+)?/g) || []
    const points = []
    let index = 0
    let command = ''
    let current = { x: 0, y: 0 }
    const readNumber = () => Number(tokens[index++])

    while (index < tokens.length) {
      if (/^[A-Za-z]$/.test(tokens[index])) command = tokens[index++]
      if (command === 'M') {
        current = { x: readNumber(), y: readNumber() }
        points.push({ x: current.x + offsetX, y: current.y + offsetY })
        command = 'L'
      } else if (command === 'L') {
        current = { x: readNumber(), y: readNumber() }
        points.push({ x: current.x + offsetX, y: current.y + offsetY })
      } else if (command === 'C') {
        const control1 = { x: readNumber(), y: readNumber() }
        const control2 = { x: readNumber(), y: readNumber() }
        const end = { x: readNumber(), y: readNumber() }
        const start = { ...current }
        for (let step = 1; step <= 28; step += 1) {
          const point = MarchingDuck.cubicPoint(start, control1, control2, end, step / 28)
          points.push({ x: point.x + offsetX, y: point.y + offsetY })

    for (let index = 1; index < points.length; index += 1) {
      totalLength += Math.hypot(points[index].x - points[index - 1].x, points[index].y - points[index - 1].y)
      distances.push(totalLength)
    }
    const result = []
    let segmentIndex = 1
    for (let sampleIndex = 0; sampleIndex < count; sampleIndex += 1) {
      const targetDistance = totalLength * sampleIndex / (count - 1)
      while (segmentIndex < distances.length - 1 && distances[segmentIndex] < targetDistance) segmentIndex += 1
      const startDistance = distances[segmentIndex - 1]
      const endDistance = distances[segmentIndex]
      const span = endDistance - startDistance
      const amount = span === 0 ? 0 : (targetDistance - startDistance) / span
      const start = points[segmentIndex - 1]
      const end = points[segmentIndex]
      result.push({ x: MarchingDuck.lerp(start.x, end.x, amount), y: MarchingDuck.lerp(start.y, end.y, amount) })
    }
    return result
  }

    if (MarchingDuck.preparedWingFrames !== null) return MarchingDuck.preparedWingFrames
    MarchingDuck.preparedWingFrames = MarchingDuck.WING_POSES.map(pose => MarchingDuck.resample(MarchingDuck.flattenPath(pose.path, pose.offsetX, pose.offsetY), MarchingDuck.WING_SAMPLE_COUNT))
    return MarchingDuck.preparedWingFrames
  }

  static prepareBodyFrames() {
    if (MarchingDuck.preparedBodyFrames !== null) return MarchingDuck.preparedBodyFrames
    MarchingDuck.preparedBodyFrames = MarchingDuck.BODY_POSES.map(pose => MarchingDuck.resample(MarchingDuck.flattenPath(pose.path, pose.offsetX, pose.offsetY), MarchingDuck.BODY_SAMPLE_COUNT))
    return MarchingDuck.preparedBodyFrames
  }

    const crop = MarchingDuck.SOURCE_CROP
    const fitScale = Math.min(MarchingDuck.WIDTH / crop.width, MarchingDuck.HEIGHT / crop.height)
    const offsetX = (MarchingDuck.WIDTH - crop.width * fitScale) * 0.5
    const offsetY = (MarchingDuck.HEIGHT - crop.height * fitScale) * 0.5
    context.translate(offsetX, offsetY)
    context.scale(fitScale, fitScale)
    context.translate(-crop.x, -crop.y)
    return fitScale
  }

  static traceTweenedPath(context, fromPoints, toPoints, amount, mirror = false) {
    const firstX = MarchingDuck.lerp(fromPoints[0].x, toPoints[0].x, amount)
    const firstY = MarchingDuck.lerp(fromPoints[0].y, toPoints[0].y, amount)
    context.beginPath()
    context.moveTo(mirror ? MarchingDuck.AXIS_X * 2 - firstX : firstX, firstY)
    for (let index = 1; index < fromPoints.length; index += 1) {
      const x = MarchingDuck.lerp(fromPoints[index].x, toPoints[index].x, amount)
      const y = MarchingDuck.lerp(fromPoints[index].y, toPoints[index].y, amount)
      context.lineTo(mirror ? MarchingDuck.AXIS_X * 2 - x : x, y)
    }
  }

  static drawFixedUpperBody(context) {
    context.strokeStyle = MarchingDuck.COLOURS.body
    for (const path of MarchingDuck.FIXED_BODY_PATHS) context.stroke(path)
    for (const eye of MarchingDuck.EYES) {
      context.save()
      context.transform(...eye.transform)
      context.beginPath()
      context.ellipse(eye.cx, eye.cy, eye.rx, eye.ry, 0, 0, Math.PI * 2)
      context.fillStyle = MarchingDuck.COLOURS.mask
      context.strokeStyle = MarchingDuck.COLOURS.eye
      context.fill()
      context.stroke()
      context.restore()
    }
  }

  static drawAtPhase(context, x, y, scale, lineWidth, phase) {
    const wingFrames = MarchingDuck.prepareWingFrames()
    const bodyFrames = MarchingDuck.prepareBodyFrames()
    context.save()
    context.translate(x, y)
    context.scale(scale, scale)
    const fitScale = MarchingDuck.applyViewTransform(context)
    context.lineWidth = lineWidth / (scale * fitScale)
    context.lineCap = 'round'
    context.lineJoin = 'round'

    context.strokeStyle = MarchingDuck.COLOURS.wing
    MarchingDuck.traceTweenedPath(context, wingFrames[0], wingFrames[1], phase, false)
    context.stroke()
    MarchingDuck.traceTweenedPath(context, wingFrames[0], wingFrames[1], phase, true)
    context.stroke()

    MarchingDuck.traceTweenedPath(context, bodyFrames[0], bodyFrames[1], phase, false)
    context.strokeStyle = MarchingDuck.COLOURS.body
    context.stroke()

    MarchingDuck.drawFixedUpperBody(context)
    context.restore()
  }

  draw(context, x, y, scale, lineWidth, timeMs) {
    MarchingDuck.drawAtPhase(context, x, y, scale, lineWidth, MarchingDuck.getAnimationPhase(timeMs))
  }
}

    const offsetX = (MarchingVulture.WIDTH - crop.width * fitScale) * 0.5
    const offsetY = (MarchingVulture.HEIGHT - crop.height * fitScale) * 0.5
    context.translate(offsetX, offsetY)
    context.scale(fitScale, fitScale)
    context.translate(-crop.x, -crop.y)
    return fitScale
  }

  static traceTweenedPath(context, fromPoints, toPoints, amount, mirror = false, closePath = false) {
    const firstX = MarchingVulture.lerp(fromPoints[0].x, toPoints[0].x, amount)
    const firstY = MarchingVulture.lerp(fromPoints[0].y, toPoints[0].y, amount)
    context.beginPath()
    context.moveTo(mirror ? MarchingVulture.AXIS_X * 2 - firstX : firstX, firstY)

    for (let index = 1; index < fromPoints.length; index += 1) {
      const x = MarchingVulture.lerp(fromPoints[index].x, toPoints[index].x, amount)
      const y = MarchingVulture.lerp(fromPoints[index].y, toPoints[index].y, amount)
      context.lineTo(mirror ? MarchingVulture.AXIS_X * 2 - x : x, y)
    }

    if (closePath) {
      context.closePath()
    }
  }

    context.strokeStyle = MarchingVulture.COLOURS.body
    for (const bodyPath of MarchingVulture.FIXED_BODY_PATHS) {
      context.stroke(bodyPath)
    }

    for (const eye of MarchingVulture.EYES) {
      context.save()
      context.transform(...eye.transform)
      context.beginPath()
      context.ellipse(eye.cx, eye.cy, eye.rx, eye.ry, 0, 0, Math.PI * 2)
      context.fillStyle = MarchingVulture.COLOURS.mask
      context.strokeStyle = MarchingVulture.COLOURS.eye
      context.fill()
      context.stroke()
      context.restore()
    }
  }

  static drawAtPhase(context, x, y, scale, lineWidth, phase) {
    const wingFrames = MarchingVulture.prepareWingFrames()
    const bodyFrames = MarchingVulture.prepareBodyFrames()
    const localLineWidth = lineWidth / Math.max(scale, 0.000001)

    context.save()
    context.translate(x, y)
    context.scale(scale, scale)
    const fitScale = MarchingVulture.applyViewTransform(context)
    context.lineWidth = localLineWidth / fitScale
    context.lineCap = 'round'
    context.lineJoin = 'round'

    context.strokeStyle = MarchingVulture.COLOURS.wing
    MarchingVulture.traceTweenedPath(context, wingFrames[0], wingFrames[1], phase, false, false)
    context.stroke()
    MarchingVulture.traceTweenedPath(context, wingFrames[0], wingFrames[1], phase, true, false)
    context.stroke()

    MarchingVulture.traceTweenedPath(context, bodyFrames[0], bodyFrames[1], phase, false, false)
    context.fillStyle = MarchingVulture.COLOURS.mask
    context.fill()
    context.strokeStyle = MarchingVulture.COLOURS.body
    context.stroke()

    MarchingVulture.drawFixedBody(context)
    context.restore()
  }

  draw(context, x, y, scale, lineWidth, timeMs) {
    MarchingVulture.drawAtPhase(
      context,
      x,
      y,
      scale,
      lineWidth,
      MarchingVulture.getAnimationPhase(timeMs)
    )
  }

        command = tokens[index++]
      }

      if (command === 'M') {
        current = { x: readNumber(), y: readNumber() }
        points.push({ x: current.x + offsetX, y: current.y + offsetY })
        command = 'L'
      } else if (command === 'L') {
        current = { x: readNumber(), y: readNumber() }
        points.push({ x: current.x + offsetX, y: current.y + offsetY })
      } else if (command === 'C') {
        const control1 = { x: readNumber(), y: readNumber() }
        const control2 = { x: readNumber(), y: readNumber() }
        const end = { x: readNumber(), y: readNumber() }
        const start = { ...current }
        for (let step = 1; step <= 32; step += 1) {
          const point = FlyingVulture.cubicPoint(start, control1, control2, end, step / 32)
          points.push({ x: point.x + offsetX, y: point.y + offsetY })
        }
        current = end
      } else {
        throw new Error(`Unsupported flying vulture path command: ${command}`)
      }
    }

    return points
  }

  static resample(points, count) {
    const distances = [0]
    let totalLength = 0

    for (let index = 1; index < points.length; index += 1) {
      totalLength += Math.hypot(
        points[index].x - points[index - 1].x,
        points[index].y - points[index - 1].y
      )
      distances.push(totalLength)
    }

    const result = []
    let segmentIndex = 1

    for (let sampleIndex = 0; sampleIndex < count; sampleIndex += 1) {
      const targetDistance = totalLength * sampleIndex / (count - 1)
      while (segmentIndex < distances.length - 1 && distances[segmentIndex] < targetDistance) {
        segmentIndex += 1
      }
      const startDistance = distances[segmentIndex - 1]
      const endDistance = distances[segmentIndex]
      const span = endDistance - startDistance
      const amount = span === 0 ? 0 : (targetDistance - startDistance) / span
      const start = points[segmentIndex - 1]
      const end = points[segmentIndex]
      result.push({
        x: FlyingVulture.lerp(start.x, end.x, amount),
        y: FlyingVulture.lerp(start.y, end.y, amount)
      })
    }

    return result
  }

  static prepareWingFrames() {
    if (FlyingVulture.preparedWingFrames !== null) {
      return FlyingVulture.preparedWingFrames
    }

    FlyingVulture.preparedWingFrames = FlyingVulture.WING_POSES.map(pose =>
      FlyingVulture.resample(
        FlyingVulture.flattenPath(pose.path, pose.offsetX, pose.offsetY),
        FlyingVulture.WING_SAMPLE_COUNT
      )
    )

    return FlyingVulture.preparedWingFrames
  }

  static applyViewTransform(context) {
    const crop = FlyingVulture.SOURCE_CROP
    const fitScale = Math.min(
      FlyingVulture.WIDTH / crop.width,
      FlyingVulture.HEIGHT / crop.height
    )
    const offsetX = (FlyingVulture.WIDTH - crop.width * fitScale) * 0.5
    const offsetY = (FlyingVulture.HEIGHT - crop.height * fitScale) * 0.5
    context.translate(offsetX, offsetY)
    context.scale(fitScale, fitScale)
    context.translate(-crop.x, -crop.y)
    return fitScale
  }

  static traceTweenedWing(context, fromPoints, toPoints, amount, mirror) {
    const firstX = FlyingVulture.lerp(fromPoints[0].x, toPoints[0].x, amount)
    const firstY = FlyingVulture.lerp(fromPoints[0].y, toPoints[0].y, amount)
    context.beginPath()
    context.moveTo(mirror ? FlyingVulture.AXIS_X * 2 - firstX : firstX, firstY)

    for (let index = 1; index < fromPoints.length; index += 1) {
      const x = FlyingVulture.lerp(fromPoints[index].x, toPoints[index].x, amount)
      const y = FlyingVulture.lerp(fromPoints[index].y, toPoints[index].y, amount)
      context.lineTo(mirror ? FlyingVulture.AXIS_X * 2 - x : x, y)
    }
  }

  static drawBody(context) {
    context.fillStyle = FlyingVulture.COLOURS.mask
    context.fill(FlyingVulture.BODY_MASK)

    context.strokeStyle = FlyingVulture.COLOURS.body
    for (const bodyPath of FlyingVulture.BODY_PATHS) {
      context.stroke(bodyPath)
    }

    for (const eye of FlyingVulture.EYES) {
      context.save()
      context.transform(...eye.transform)
      context.beginPath()
      context.ellipse(eye.cx, eye.cy, eye.rx, eye.ry, 0, 0, Math.PI * 2)
      context.fillStyle = FlyingVulture.COLOURS.mask
      context.strokeStyle = FlyingVulture.COLOURS.eye
      context.fill()
      context.stroke()
      context.restore()
    }
  }

  static drawAtPhase(context, x, y, scale, lineWidth, phase) {
    const wingFrames = FlyingVulture.prepareWingFrames()
    const localLineWidth = lineWidth / Math.max(scale, 0.000001)

    context.save()
    context.translate(x, y)
    context.scale(scale, scale)
    const fitScale = FlyingVulture.applyViewTransform(context)
    context.lineWidth = localLineWidth / fitScale
    context.lineCap = 'round'
    context.lineJoin = 'round'

    context.strokeStyle = FlyingVulture.COLOURS.wing
    FlyingVulture.traceTweenedWing(context, wingFrames[0], wingFrames[1], phase, false)
    context.stroke()
    FlyingVulture.traceTweenedWing(context, wingFrames[0], wingFrames[1], phase, true)
    context.stroke()

    FlyingVulture.drawBody(context)
    context.restore()
  }

  draw(context, x, y, scale, lineWidth, timeMs) {
    FlyingVulture.drawAtPhase(
      context,
      x,
      y,
      scale,
      lineWidth,
      FlyingVulture.getAnimationPhase(timeMs)
    )
  }
}

    const segmentIndex = Math.floor(wrapped / segmentDuration)
    const rawAmount = (wrapped % segmentDuration) / segmentDuration

      toFrame: sequence[(segmentIndex + 1) % sequence.length],
      amount: FlyingBird.smoothstep(rawAmount)
    }

  static cubicPoint(start, control1, control2, end, amount) {
    const inverse = 1 - amount
    const inverseSquared = inverse * inverse
    const amountSquared = amount * amount
    return {
      x: inverseSquared * inverse * start.x
        + 3 * inverseSquared * amount * control1.x
        + 3 * inverse * amountSquared * control2.x
        + amountSquared * amount * end.x,
      y: inverseSquared * inverse * start.y
        + 3 * inverseSquared * amount * control1.y
        + 3 * inverse * amountSquared * control2.y
        + amountSquared * amount * end.y
    }
  }

  static flattenPath(pathData) {
    const tokens = pathData.match(/[A-Za-z]|[-+]?(?:\d*\.\d+|\d+\.?)(?:[eE][-+]?\d+)?/g) || []
    const points = []
    let index = 0
    let command = ''
    let current = { x: 0, y: 0 }
    const readNumber = () => Number(tokens[index++])

    while (index < tokens.length) {
      if (/^[A-Za-z]$/.test(tokens[index])) {
        command = tokens[index++]
      }

      if (command === 'M') {
        current = { x: readNumber(), y: readNumber() }
        points.push({ ...current })
        command = 'L'
      } else if (command === 'L') {
        current = { x: readNumber(), y: readNumber() }
        points.push({ ...current })
      } else if (command === 'C') {
        const control1 = { x: readNumber(), y: readNumber() }
        const control2 = { x: readNumber(), y: readNumber() }
        const end = { x: readNumber(), y: readNumber() }
        const start = { ...current }
        for (let step = 1; step <= 28; step += 1) {
          points.push(FlyingBird.cubicPoint(start, control1, control2, end, step / 28))

      }
    }

  }

    const distances = [0]
    let totalLength = 0

    for (let index = 1; index < points.length; index += 1) {
      totalLength += Math.hypot(
        points[index].x - points[index - 1].x,
        points[index].y - points[index - 1].y
      )
      distances.push(totalLength)
    }

    const result = []
    let segment = 1

    for (let sampleIndex = 0; sampleIndex < count; sampleIndex += 1) {
      const target = totalLength * sampleIndex / (count - 1)
      while (segment < distances.length - 1 && distances[segment] < target) {
        segment += 1
      }

      const previousDistance = distances[segment - 1]
      const nextDistance = distances[segment]
      const distanceRange = Math.max(nextDistance - previousDistance, 0.000001)
      const localAmount = (target - previousDistance) / distanceRange
      const previous = points[segment - 1]
      const next = points[segment]

      result.push({
        x: FlyingBird.lerp(previous.x, next.x, localAmount),
        y: FlyingBird.lerp(previous.y, next.y, localAmount)
      })

    const sourceStart = points[0]

    const targetStart = {
      x: FlyingBird.LEFT_WING_ANCHOR_TOP[0],
      y: FlyingBird.LEFT_WING_ANCHOR_TOP[1]
    }
    const targetEnd = {
      x: FlyingBird.LEFT_WING_ANCHOR_BOTTOM[0],
      y: FlyingBird.LEFT_WING_ANCHOR_BOTTOM[1]
    }

    const sourceDx = sourceEnd.x - sourceStart.x
    const sourceDy = sourceEnd.y - sourceStart.y
    const targetDx = targetEnd.x - targetStart.x
    const targetDy = targetEnd.y - targetStart.y

    const scale = targetLength / sourceLength
    const rotation = Math.atan2(targetDy, targetDx) - Math.atan2(sourceDy, sourceDx)
    const cosine = Math.cos(rotation)
    const sine = Math.sin(rotation)

      const localX = (point.x - sourceStart.x) * scale
      const localY = (point.y - sourceStart.y) * scale
      const rotatedX = localX * cosine - localY * sine

        x: targetStart.x + rotatedX - FlyingBird.SOURCE_ORIGIN_X,
        y: targetStart.y + rotatedY - FlyingBird.SOURCE_ORIGIN_Y

    context.strokeStyle = FlyingBird.COLOURS.body
    context.fill(preparedBody.body)
    context.stroke(preparedBody.body)

    context.lineCap = 'round'

    FlyingBird.traceWing(context, fromWing, toWing, amount, true)
    context.stroke()

    FlyingBird.drawBody(context)
    context.restore()
  }

    FlyingBird.drawBetweenPoses(

      scale,

      state.toFrame,
      state.amount

  static lerp(a, b, amount) {
    return a + (b - a) * amount
  }

  static smoothstep(amount) {
    return amount * amount * (3 - 2 * amount)
  }

  static getAnimationPhase(timeMs) {
    const wrapped = ((timeMs % FlyingDuck.CYCLE_DURATION) + FlyingDuck.CYCLE_DURATION)
      % FlyingDuck.CYCLE_DURATION
    const halfCycle = FlyingDuck.CYCLE_DURATION / 2
    const rawPhase = wrapped < halfCycle
      ? wrapped / halfCycle
      : 1 - (wrapped - halfCycle) / halfCycle
    return FlyingDuck.smoothstep(rawPhase)
  }

  static cubicPoint(start, control1, control2, end, amount) {
    const inverse = 1 - amount
    const inverseSquared = inverse * inverse
    const amountSquared = amount * amount
    return {
      x: inverseSquared * inverse * start.x
        + 3 * inverseSquared * amount * control1.x
        + 3 * inverse * amountSquared * control2.x
        + amountSquared * amount * end.x,
      y: inverseSquared * inverse * start.y
        + 3 * inverseSquared * amount * control1.y
        + 3 * inverse * amountSquared * control2.y
        + amountSquared * amount * end.y
    }
  }

  static flattenPath(pathData, offsetX = 0, offsetY = 0) {
    const tokens = pathData.match(/[A-Za-z]|[-+]?(?:\d*\.\d+|\d+\.?)(?:[eE][-+]?\d+)?/g) || []
    const points = []
    let index = 0
    let command = ''
    let current = { x: 0, y: 0 }
    const readNumber = () => Number(tokens[index++])

    while (index < tokens.length) {
      if (/^[A-Za-z]$/.test(tokens[index])) {
        command = tokens[index++]
      }

      if (command === 'M') {
        current = { x: readNumber(), y: readNumber() }
        points.push({ x: current.x + offsetX, y: current.y + offsetY })
        command = 'L'
      } else if (command === 'L') {
        current = { x: readNumber(), y: readNumber() }
        points.push({ x: current.x + offsetX, y: current.y + offsetY })
      } else if (command === 'C') {
        const control1 = { x: readNumber(), y: readNumber() }
        const control2 = { x: readNumber(), y: readNumber() }
        const end = { x: readNumber(), y: readNumber() }
        const start = { ...current }
        for (let step = 1; step <= 32; step += 1) {
          const point = FlyingDuck.cubicPoint(start, control1, control2, end, step / 32)
          points.push({ x: point.x + offsetX, y: point.y + offsetY })
        }
        current = end
      } else {
        throw new Error(`Unsupported flying duck path command: ${command}`)
      }
    }

    return points
  }

  static resample(points, count) {
    const distances = [0]
    let totalLength = 0

    for (let index = 1; index < points.length; index += 1) {
      totalLength += Math.hypot(
        points[index].x - points[index - 1].x,
        points[index].y - points[index - 1].y
      )
      distances.push(totalLength)
    }

    const result = []
    let segmentIndex = 1

    for (let sampleIndex = 0; sampleIndex < count; sampleIndex += 1) {
      const targetDistance = totalLength * sampleIndex / (count - 1)
      while (segmentIndex < distances.length - 1 && distances[segmentIndex] < targetDistance) {
        segmentIndex += 1
      }
      const startDistance = distances[segmentIndex - 1]
      const endDistance = distances[segmentIndex]
      const span = endDistance - startDistance
      const amount = span === 0 ? 0 : (targetDistance - startDistance) / span
      const start = points[segmentIndex - 1]
      const end = points[segmentIndex]
      result.push({
        x: FlyingDuck.lerp(start.x, end.x, amount),
        y: FlyingDuck.lerp(start.y, end.y, amount)
      })
    }

    return result
  }

  static prepareWingFrames() {
    if (FlyingDuck.preparedWingFrames !== null) {
      return FlyingDuck.preparedWingFrames
    }

    FlyingDuck.preparedWingFrames = FlyingDuck.WING_POSES.map(pose =>
      FlyingDuck.resample(
        FlyingDuck.flattenPath(pose.path, pose.offsetX, pose.offsetY),
        FlyingDuck.WING_SAMPLE_COUNT
      )
    )

    return FlyingDuck.preparedWingFrames
  }

  static applyViewTransform(context) {
    const crop = FlyingDuck.VIEW_CROP
    const fitScale = Math.min(
      FlyingDuck.WIDTH / crop.width,
      FlyingDuck.HEIGHT / crop.height
    )
    const offsetX = (FlyingDuck.WIDTH - crop.width * fitScale) * 0.5
    const offsetY = (FlyingDuck.HEIGHT - crop.height * fitScale) * 0.5
    context.translate(offsetX, offsetY)
    context.scale(fitScale, fitScale)
    context.translate(-crop.x, -crop.y)
    return fitScale
  }

  static traceTweenedWing(context, fromPoints, toPoints, amount, mirror) {
    const firstX = FlyingDuck.lerp(fromPoints[0].x, toPoints[0].x, amount)
    const firstY = FlyingDuck.lerp(fromPoints[0].y, toPoints[0].y, amount)
    context.beginPath()
    context.moveTo(mirror ? FlyingDuck.AXIS_X * 2 - firstX : firstX, firstY)

    for (let index = 1; index < fromPoints.length; index += 1) {
      const x = FlyingDuck.lerp(fromPoints[index].x, toPoints[index].x, amount)
      const y = FlyingDuck.lerp(fromPoints[index].y, toPoints[index].y, amount)
      context.lineTo(mirror ? FlyingDuck.AXIS_X * 2 - x : x, y)
    }
  }

  static drawBody(context) {
    context.fillStyle = FlyingDuck.COLOURS.mask
    for (const maskPath of FlyingDuck.BODY_MASK_PATHS) {
      context.fill(maskPath)
    }

    context.strokeStyle = FlyingDuck.COLOURS.body
    for (const bodyPath of FlyingDuck.BODY_PATHS) {
      context.stroke(bodyPath)
    }

    for (const eye of FlyingDuck.EYES) {
      context.save()
      context.transform(...eye.transform)
      context.beginPath()
      context.ellipse(eye.cx, eye.cy, eye.rx, eye.ry, 0, 0, Math.PI * 2)
      context.fillStyle = FlyingDuck.COLOURS.mask
      context.strokeStyle = FlyingDuck.COLOURS.eye
      context.fill()
      context.stroke()
      context.restore()
    }
  }

  static drawAtPhase(context, x, y, scale, lineWidth, phase) {
    const wingFrames = FlyingDuck.prepareWingFrames()

    context.save()
    context.translate(x, y)
    context.scale(scale, scale)
    const fitScale = FlyingDuck.applyViewTransform(context)
    context.lineWidth = lineWidth / (scale * fitScale)
    context.lineCap = 'round'
    context.lineJoin = 'round'

    context.strokeStyle = FlyingDuck.COLOURS.wing
    FlyingDuck.traceTweenedWing(context, wingFrames[0], wingFrames[1], phase, false)
    context.stroke()
    FlyingDuck.traceTweenedWing(context, wingFrames[0], wingFrames[1], phase, true)
    context.stroke()

    FlyingDuck.drawBody(context)
    context.restore()
  }

  draw(context, x, y, scale, lineWidth, timeMs) {
    FlyingDuck.drawAtPhase(
      context,
      x,
      y,
      scale,
      lineWidth,
      FlyingDuck.getAnimationPhase(timeMs)
    )
  }
}

  const DEFAULT_PALETTE = Object.freeze({
    wing: '#ffff00',
    body: '#ff00ff',
    eye: '#ffffff',
    mask: '#000000'
  })

  const SPECIES_ASSETS = Object.freeze({
    bird: Object.freeze({
      marching: 'bird.marching',
      flying: 'bird.flying'
    }),
    vulture: Object.freeze({
      marching: 'vulture.marching',
      flying: 'vulture.flying'
    }),
    duck: Object.freeze({
      marching: 'duck.marching',
      flying: 'duck.flying'
    })
  })

  function clamp(value, minimum, maximum) {
    return Math.max(minimum, Math.min(maximum, value))
  }

  function positiveModulo(value, divisor) {
    return ((value % divisor) + divisor) % divisor
  }

  function normalisePalette(palette = {}) {
    return {
      wing: palette.wing ?? DEFAULT_PALETTE.wing,
      body: palette.body ?? DEFAULT_PALETTE.body,
      eye: palette.eye ?? DEFAULT_PALETTE.eye,
      mask: palette.mask ?? DEFAULT_PALETTE.mask
    }
  }

  const paletteContextCache = new WeakMap()

  function createPaletteContext(context, palette) {
    const colours = normalisePalette(palette)
    const cacheKey = `${colours.wing}|${colours.body}|${colours.eye}|${colours.mask}`
    let contextCache = paletteContextCache.get(context)
    if (!contextCache) {
      contextCache = new Map()
      paletteContextCache.set(context, contextCache)
    }
    if (contextCache.has(cacheKey)) {
      return contextCache.get(cacheKey)
    }

    const replacements = new Map([
      [DEFAULT_PALETTE.wing.toLowerCase(), colours.wing],
      [DEFAULT_PALETTE.body.toLowerCase(), colours.body],
      [DEFAULT_PALETTE.eye.toLowerCase(), colours.eye],
      [DEFAULT_PALETTE.mask.toLowerCase(), colours.mask]
    ])

    const proxy = new Proxy(context, {
      get(target, property) {
        const value = Reflect.get(target, property, target)
        return typeof value === 'function' ? value.bind(target) : value
      },
      set(target, property, value) {
        if ((property === 'strokeStyle' || property === 'fillStyle') && typeof value === 'string') {
          value = replacements.get(value.toLowerCase()) ?? value
        }
        return Reflect.set(target, property, value, target)
      }
    })

    contextCache.set(cacheKey, proxy)
    return proxy
  }

  class BirdAssetDefinition {
    constructor({
      id,
      species,
      mode,
      title,
      description,
      rendererClass,
      defaultScale = 1,
      defaultLineWidth = 2,
      phaseDrawer = null
    }) {
      if (!id || !species || !mode || typeof rendererClass !== 'function') {
        throw new TypeError('A bird asset definition requires id, species, mode and rendererClass')
      }

      this.id = id
      this.species = species
      this.mode = mode
      this.title = title ?? id
      this.description = description ?? ''
      this.rendererClass = rendererClass
      this.renderer = new rendererClass()
      this.defaultScale = defaultScale
      this.defaultLineWidth = defaultLineWidth
      this.phaseDrawer = phaseDrawer
      Object.freeze(this)
    }

    get width() {
      return this.rendererClass.WIDTH
    }

    get height() {
      return this.rendererClass.HEIGHT
    }

    get cycleDurationMs() {
      return this.rendererClass.CYCLE_DURATION
    }

    get centreX() {
      return this.width / 2
    }

    get centreY() {
      return this.height / 2
    }

    drawAtTime(context, x, y, scale, lineWidth, timeMs, palette = null) {
      const drawingContext = palette ? createPaletteContext(context, palette) : context
      this.renderer.draw(drawingContext, x, y, scale, lineWidth, timeMs)
    }

    drawAtPhase(context, x, y, scale, lineWidth, phase, palette = null) {
      const amount = clamp(phase, 0, 1)
      const drawingContext = palette ? createPaletteContext(context, palette) : context

      if (this.phaseDrawer !== null) {
        this.phaseDrawer(drawingContext, x, y, scale, lineWidth, amount)
        return
      }

      if (typeof this.rendererClass.drawAtPhase !== 'function') {
        throw new Error(`Asset ${this.id} does not expose drawAtPhase`)
      }

      this.rendererClass.drawAtPhase(
        drawingContext,
        x,
        y,
        scale,
        lineWidth,
        amount
      )
    }

    scaleToFit(targetWidth, targetHeight) {
      if (!(targetWidth > 0) || !(targetHeight > 0)) {
        throw new RangeError('Target width and height must be greater than zero')
      }
      return Math.min(targetWidth / this.width, targetHeight / this.height)
    }
  }

  class BirdAssetRegistry {
    constructor(definitions = []) {
      this.definitions = new Map()
      for (const definition of definitions) {
        this.register(definition)
      }
    }

    register(definition) {
      if (!(definition instanceof BirdAssetDefinition)) {
        throw new TypeError('Only BirdAssetDefinition instances can be registered')
      }
      if (this.definitions.has(definition.id)) {
        throw new Error(`Bird asset already registered: ${definition.id}`)
      }
      this.definitions.set(definition.id, definition)
      return this
    }

    has(id) {
      return this.definitions.has(id)
    }

    get(id) {
      const definition = this.definitions.get(id)
      if (!definition) {
        throw new Error(`Unknown bird asset: ${id}`)
      }
      return definition
    }

    list() {
      return Array.from(this.definitions.values())
    }

    listBySpecies(species) {
      return this.list().filter(definition => definition.species === species)
    }

    createSprite(id, options = {}) {
      return new BirdSprite(this.get(id), options)
    }
  }

  class BirdSprite {
    constructor(definition, options = {}) {
      if (!(definition instanceof BirdAssetDefinition)) {
        throw new TypeError('BirdSprite requires a BirdAssetDefinition')
      }

      this.definition = definition
      this.x = options.x ?? 0
      this.y = options.y ?? 0
      this.scale = options.scale ?? definition.defaultScale
      this.lineWidth = options.lineWidth ?? definition.defaultLineWidth
      this.rotation = options.rotation ?? 0
      this.animationSpeed = options.animationSpeed ?? 1
      this.animationTimeMs = options.animationTimeMs ?? 0
      this.palette = options.palette ? normalisePalette(options.palette) : null
      this.visible = options.visible ?? true
    }

    get id() {
      return this.definition.id
    }

    get species() {
      return this.definition.species
    }

    get mode() {
      return this.definition.mode
    }

    get width() {
      return this.definition.width * this.scale
    }

    get height() {
      return this.definition.height * this.scale
    }

    setPosition(x, y) {
      this.x = x
      this.y = y
      return this
    }

    setScale(scale) {
      if (!(scale > 0)) {
        throw new RangeError('Sprite scale must be greater than zero')
      }
      this.scale = scale
      return this
    }

    setScaleToFit(width, height) {
      this.scale = this.definition.scaleToFit(width, height)
      return this
    }

    setLineWidth(lineWidth) {
      if (!(lineWidth > 0)) {
        throw new RangeError('Line width must be greater than zero')
      }
      this.lineWidth = lineWidth
      return this
    }

    setRotation(rotation) {
      this.rotation = rotation
      return this
    }

    setAnimationSpeed(animationSpeed) {
      if (!Number.isFinite(animationSpeed)) {
        throw new TypeError('Animation speed must be a finite number')
      }
      this.animationSpeed = animationSpeed
      return this
    }

    setPalette(palette) {
      this.palette = palette ? normalisePalette(palette) : null
      return this
    }

    resetAnimation(timeMs = 0) {
      this.animationTimeMs = timeMs
      return this
    }

    update(deltaSeconds) {
      if (!Number.isFinite(deltaSeconds)) {
        throw new TypeError('Delta time must be a finite number')
      }
      this.animationTimeMs += deltaSeconds * 1000 * this.animationSpeed
      return this
    }

    draw(context, overrides = {}) {
      if (!this.visible) {
        return
      }

      const x = overrides.x ?? this.x
      const y = overrides.y ?? this.y
      const scale = overrides.scale ?? this.scale
      const lineWidth = overrides.lineWidth ?? this.lineWidth
      const rotation = overrides.rotation ?? this.rotation
      const timeMs = overrides.timeMs ?? this.animationTimeMs
      const palette = overrides.palette ?? this.palette

      this.#withRotation(context, x, y, scale, rotation, () => {
        this.definition.drawAtTime(
          context,
          x,
          y,
          scale,
          lineWidth,
          timeMs,
          palette
        )
      })
    }

    drawAtPhase(context, phase, overrides = {}) {
      if (!this.visible) {
        return
      }

      const x = overrides.x ?? this.x
      const y = overrides.y ?? this.y
      const scale = overrides.scale ?? this.scale
      const lineWidth = overrides.lineWidth ?? this.lineWidth
      const rotation = overrides.rotation ?? this.rotation
      const palette = overrides.palette ?? this.palette

      this.#withRotation(context, x, y, scale, rotation, () => {
        this.definition.drawAtPhase(
          context,
          x,
          y,
          scale,
          lineWidth,
          phase,
          palette
        )
      })
    }

    getBounds(overrides = {}) {
      const x = overrides.x ?? this.x
      const y = overrides.y ?? this.y
      const scale = overrides.scale ?? this.scale
      const rotation = overrides.rotation ?? this.rotation
      const width = this.definition.width * scale
      const height = this.definition.height * scale
      const centreX = x + width / 2
      const centreY = y + height / 2

      if (rotation === 0) {
        return { x, y, width, height, centreX, centreY }
      }

      const cosine = Math.abs(Math.cos(rotation))
      const sine = Math.abs(Math.sin(rotation))
      const rotatedWidth = width * cosine + height * sine
      const rotatedHeight = width * sine + height * cosine

      return {
        x: centreX - rotatedWidth / 2,
        y: centreY - rotatedHeight / 2,
        width: rotatedWidth,
        height: rotatedHeight,
        centreX,
        centreY
      }
    }

    getCollisionCircle(radiusFactor = 0.34, overrides = {}) {
      const bounds = this.getBounds(overrides)
      return {
        x: bounds.centreX,
        y: bounds.centreY,
        radius: Math.min(bounds.width, bounds.height) * radiusFactor
      }
    }

    #withRotation(context, x, y, scale, rotation, draw) {
      if (rotation === 0) {
        draw()
        return
      }

      const centreX = x + this.definition.centreX * scale
      const centreY = y + this.definition.centreY * scale
      context.save()
      context.translate(centreX, centreY)
      context.rotate(rotation)
      context.translate(-centreX, -centreY)
      draw()
      context.restore()
    }
  }

  class BirdActor {
    constructor(species = 'bird', options = {}) {
      if (!SPECIES_ASSETS[species]) {
        throw new Error(`Unknown bird species: ${species}`)
      }

      this.registry = options.registry ?? registry
      this.species = species
      this.mode = options.mode ?? 'marching'
      this.sprites = new Map()
      this.sharedOptions = {
        x: options.x ?? 0,
        y: options.y ?? 0,
        scale: options.scale,
        lineWidth: options.lineWidth,
        rotation: options.rotation ?? 0,
        animationSpeed: options.animationSpeed ?? 1,
        palette: options.palette
      }
      this.#ensureSprite(this.mode)
    }

    get sprite() {
      return this.#ensureSprite(this.mode)
    }

    setSpecies(species, options = {}) {
      if (!SPECIES_ASSETS[species]) {
        throw new Error(`Unknown bird species: ${species}`)
      }
      this.species = species
      this.sprites.clear()
      if (options.mode) {
        this.mode = options.mode
      }
      this.#ensureSprite(this.mode)
      return this
    }

    setMode(mode, options = {}) {
      if (!SPECIES_ASSETS[this.species][mode]) {
        throw new Error(`Species ${this.species} has no ${mode} asset`)
      }
      this.mode = mode
      const sprite = this.#ensureSprite(mode)
      if (options.resetAnimation) {
        sprite.resetAnimation()
      }
      return this
    }

    setPosition(x, y) {
      this.sharedOptions.x = x
      this.sharedOptions.y = y
      for (const sprite of this.sprites.values()) {
        sprite.setPosition(x, y)
      }
      return this
    }

    setScale(scale) {
      this.sharedOptions.scale = scale
      for (const sprite of this.sprites.values()) {
        sprite.setScale(scale)
      }
      return this
    }

    setLineWidth(lineWidth) {
      this.sharedOptions.lineWidth = lineWidth
      for (const sprite of this.sprites.values()) {
        sprite.setLineWidth(lineWidth)
      }
      return this
    }

    setRotation(rotation) {
      this.sharedOptions.rotation = rotation
      for (const sprite of this.sprites.values()) {
        sprite.setRotation(rotation)
      }
      return this
    }

    setAnimationSpeed(animationSpeed) {
      this.sharedOptions.animationSpeed = animationSpeed
      for (const sprite of this.sprites.values()) {
        sprite.setAnimationSpeed(animationSpeed)
      }
      return this
    }

    setPalette(palette) {
      this.sharedOptions.palette = palette ? normalisePalette(palette) : null
      for (const sprite of this.sprites.values()) {
        sprite.setPalette(this.sharedOptions.palette)
      }
      return this
    }

    update(deltaSeconds) {
      this.sprite.update(deltaSeconds)
      return this
    }

    draw(context, overrides = {}) {
      this.sprite.draw(context, overrides)
    }

    drawAtPhase(context, phase, overrides = {}) {
      this.sprite.drawAtPhase(context, phase, overrides)
    }

    getBounds(overrides = {}) {

function rlca8(v){ v&=255; return ((v<<1)|(v>>>7))&255; }
function nextBigBirdSeed(f){
  // Deterministic pseudo-random source: closer to a hardware free-running
  // counter feel than Math.random() changing every frame.
  let s=f.bigSeed&0xFF;
  const fb=((s>>7)^(s>>5)^(s>>4)^(s>>3))&1;
  s=((s<<1)&0xFE)|fb;
  if(s===0) s=0x5D;
  f.bigSeed=s;
  return s;
}

  if(b.kind!=='big') return {w:b.width,h:b.height};
  const w=BIG_BIRD_SHAPE_WIDTH[b.growthState|0] || 56;

/* ---------- helpers ---------- */
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function circleRectHit(cx,cy,cr, rx,ry,rw,rh){
  const nx = clamp(cx, rx, rx+rw), ny = clamp(cy, ry, ry+rh);
  const dx = cx-nx, dy = cy-ny;
  return dx*dx+dy*dy <= cr*cr;
}
function rectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){
  return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
}
function lerp(a,b,t){ return a+(b-a)*t; }
// Real target-seek from the ROM (L3672/L3695): a bird doesn't wander around
// where it started — it re-centers on the PLAYER's current X each time it
// reaches a target, alternating a "near" leg (toward the player, offset
// short) and a "far" leg (away from the player, offset long), clamped to
// the playfield edges. The previous build picked a random point around a
// fixed home position and never looked at the player at all.
function pickBigBirdTarget(b){
  const playerX = clamp(player.x, 17, LOGICAL_W-17);
  const spread = 10 + (b.col%4)*6;
  if(b.targetSide==='near'){
    b.targetX = clamp(Math.max(b.x, playerX) + spread, 17, LOGICAL_W-17);
    b.targetSide='far';
  } else {
    b.targetX = clamp(Math.min(b.x, playerX) - spread, 17, LOGICAL_W-17);
    b.targetSide='near';
  }
}

// Game integration for the low-cost VectorSynth. The 120 kHz Phoenix
// reference circuit is intentionally absent from this build.
const VECTOR_T3DE0=[
  0x40,0x40,0x40,0x40,0x40,0x40,0x40,0x34,
  0x2C,0x26,0x20,0x1C,0x18,0x14,0x12,0x0F,
  0x0D,0x0B,0x09,0x08,0x07,0x06,0x05,0x04,
  0x03,0x02,0x02,0x02,0x02,0x02,0x02,0x02

let vectorSoundMode='none';
let vectorShieldSoundHeld=false;
function setVectorShieldSound(active){
  active=!!active;

}
function vectorSmallAttackerCount(f){
  if(!f||!f.birds) return 0;
  let n=0;
  for(const b of f.birds) if(b&&b.alive&&b.patternKind!=='base') n++;
  return Math.min(8,n);
}
function stopVectorSynthAmbience(){
  if(vectorSoundMode==='big') VectorSynth.birdWave(null);
  if(vectorSoundMode==='small') VectorSynth.alienAttack(0);
  if(vectorSoundMode==='boss') VectorSynth.mothership(false);
  vectorSoundMode='none';
}
function syncVectorSynthState(force=false){
  if(typeof state==='undefined'||state!=='playing'){
    if(vectorSoundMode!=='none') stopVectorSynthAmbience();
    return;
  }
  let mode='none';
  if(typeof currentBoss!=='undefined'&&currentBoss&&currentBoss.state==='active') mode='boss';
  else if(typeof currentFormation!=='undefined'&&currentFormation) mode=currentFormation.kind||'none';

  if(force||mode!==vectorSoundMode){
    if(vectorSoundMode==='big') VectorSynth.birdWave(null);
    if(vectorSoundMode==='small') VectorSynth.alienAttack(0);
    if(vectorSoundMode==='boss') VectorSynth.mothership(false);
    vectorSoundMode=mode;
    if(mode==='big'&&currentFormation){
      currentFormation.vectorBirdSoundPhase=0;
      currentFormation.vectorBirdSoundTimer=0;
      const idx=Number.isFinite(currentFormation.bigBD6)?(currentFormation.bigBD6&31):0;
      VectorSynth.birdWave(0,VECTOR_T3DE0[idx]);
    }else if(mode==='boss'){
      VectorSynth.mothership('active',vectorSmallAttackerCount(bossEscortFormation));
    }
  }

  if(mode==='small'){
    VectorSynth.alienAttack(vectorSmallAttackerCount(currentFormation));
  }else if(mode==='big'&&currentFormation){
    const f=currentFormation;
    if(!Number.isFinite(f.vectorBirdSoundPhase)) f.vectorBirdSoundPhase=0;
    if(!Number.isFinite(f.vectorBirdSoundTimer)) f.vectorBirdSoundTimer=0;
    const idx=Number.isFinite(f.bigBD6)?(f.bigBD6&31):0;
    const threshold=VECTOR_T3DE0[idx];
    const old=f.vectorBirdSoundTimer&255;
    f.vectorBirdSoundTimer=(f.vectorBirdSoundTimer+1)&255;
    if(old===0) f.vectorBirdSoundPhase=(f.vectorBirdSoundPhase+1)&255;
    else if(threshold<f.vectorBirdSoundTimer) f.vectorBirdSoundTimer=0;
    VectorSynth.birdWave(f.vectorBirdSoundPhase,threshold);
  }else if(mode==='boss'){
    // Mothership timing runs inside VectorSynth; only escort attack intensity changes here.
    VectorSynth.alienAttack(vectorSmallAttackerCount(bossEscortFormation));
  }
}

      this.rotSpeed=(-2.0+Math.random()*4.0);

        this.shellH=opts.shellH===undefined ? 9 : opts.shellH;
        this.shellBend=0;
      }else{
        const ang=launchAngle===undefined ? (side<0 ? Math.PI : 0) : launchAngle;
        this.vx=Math.cos(ang)*speed;
        this.vy=Math.sin(ang)*speed;
        this.life=0.96;
        this.rotSpeed=(-5.0+Math.random()*10.0);
        this.gravity=42+Math.random()*24;
        this.drag=0.993;
        this.shellW=1.8+Math.random()*2.8;
        this.shellH=0.8+Math.random()*1.5;
        this.shellBend=(Math.random()<0.5?-1:1)*(0.25+Math.random()*0.45);

    }else{

class Popup{
  constructor(x,y,text){ this.x=x; this.y=y; this.text=text; this.life=0.7; this.maxLife=0.7; }

// One flat scrolling space layer: no near-star speed/size tier and no
// depth/parallax split.  Planets use this exact same scroll rate.
const BACKGROUND_SCROLL_SPEED = 26;
class Star{
  constructor(){ this.reset(true); }
  reset(initial){
    this.x = Math.random()*LOGICAL_W;
    this.y = initial ? Math.random()*LOGICAL_H : -4;
    this.speed = BACKGROUND_SCROLL_SPEED;
    this.size = 0.5;

    // Each star still twinkles independently; brightness changes only, not
    // movement speed or apparent depth.
    this.brightness = Math.random();
    this.twinkleDir = Math.random()<0.5 ? 1 : -1;
    this.twinkleSpeed = 0.015 + Math.random()*0.035; // per ~60 Hz frame
    this.baseAlpha = 0.10 + Math.random()*0.25;
    this.maxAlphaBoost = 0.45 + Math.random()*0.35;
  }
}

// Sparse vector planets adapted from the older game's background.  They are
// part of the SAME flat scrolling layer as the stars: no independent depth or
// parallax speed.  Up to two may be visible, but new bodies are given a hard
// vertical clearance so their outlines/rings can never clash.
const backgroundPlanets=[];
const MAX_BACKGROUND_PLANETS=2;
const MIN_PLANET_CLEARANCE=36;
let backgroundPlanetDelay=4+Math.random()*4;
const BACKGROUND_PLANET_COLORS=[
  '#ff4040','#ff8c00','#ffd000','#80ff00',
  '#00d5c4','#3f6cff','#ff40ff','#dddddd'
];

function planetRng(seed){
  return function(){
    let t=(seed+=0x6D2B79F5);
    t=Math.imul(t^(t>>>15),t|1);
    t^=t+Math.imul(t^(t>>>7),t|61);
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
function planetEffectiveRadius(p){ return p.type==='ringed' ? p.radius*1.55 : p.radius; }
function spawnBackgroundPlanet(){
  if(backgroundPlanets.length>=MAX_BACKGROUND_PLANETS) return false;
  const types=['rocky','continent','ringed'];
  const type=types[(Math.random()*types.length)|0];
  const radius = type==='rocky' ? 7+Math.random()*4
               : type==='continent' ? 8+Math.random()*5
               : 10+Math.random()*5;
  const p={
    type, radius, seed:(Math.random()*0xFFFFFFFF)>>>0,
    x:0, y:0, speed:BACKGROUND_SCROLL_SPEED
  };
  const er=planetEffectiveRadius(p);
  const edge=er+4;
  p.x=edge+Math.random()*Math.max(1,LOGICAL_W-edge*2);
  p.y=-er-3;

  // Since every background object has the same Y speed, this clearance can
  // never close up later.  It is deliberately based on effective ring radius,
  // so even two ringed planets cannot touch.
  for(const other of backgroundPlanets){
    const required=er+planetEffectiveRadius(other)+MIN_PLANET_CLEARANCE;
    if(Math.abs(p.y-other.y)<required) return false;
  }
  backgroundPlanets.push(p);
  return true;
}
function updateBackgroundPlanets(dt){
  for(const p of backgroundPlanets) p.y+=BACKGROUND_SCROLL_SPEED*dt;
  for(let i=backgroundPlanets.length-1;i>=0;i--){
    const p=backgroundPlanets[i];
    if(p.y-planetEffectiveRadius(p)>LOGICAL_H+4) backgroundPlanets.splice(i,1);
  }

  backgroundPlanetDelay-=dt;
  if(backgroundPlanetDelay<=0){
    if(spawnBackgroundPlanet()) backgroundPlanetDelay=6+Math.random()*6;
    else backgroundPlanetDelay=1;
  }
}
function planetPaint(seed){
  const rand=planetRng(seed);
  return {
    rand,
    color:()=>BACKGROUND_PLANET_COLORS[(rand()*BACKGROUND_PLANET_COLORS.length)|0],
    range:(a,b)=>a+rand()*(b-a)
  };
}
function drawRockyBackgroundPlanet(targetCtx,p){
  const q=planetPaint(p.seed), r=p.radius;
  targetCtx.save(); targetCtx.translate(p.x,p.y);
  targetCtx.fillStyle='#000000';
  targetCtx.beginPath(); targetCtx.arc(0,0,r,0,Math.PI*2); targetCtx.fill();
  const body=q.color(), feature=q.color();
  targetCtx.globalAlpha=0.48; targetCtx.lineWidth=0.65; targetCtx.strokeStyle=body;
    targetCtx.beginPath(); targetCtx.arc(0,0,r,0,Math.PI*2); targetCtx.stroke();
  targetCtx.strokeStyle=feature;
  const craters=[];
  const count=3+((q.rand()*5)|0);
  for(let i=0;i<count;i++){
    let cx=0,cy=0,cr=1;
    for(let attempt=0;attempt<40;attempt++){
      const a=q.range(0,Math.PI*2), d=q.range(r*0.2,r*0.68);
      cx=Math.cos(a)*d; cy=Math.sin(a)*d; cr=q.range(r*0.06,r*0.15);
      if(craters.every(c=>Math.hypot(cx-c.x,cy-c.y)>=cr+c.r)) break;
    }
    craters.push({x:cx,y:cy,r:cr});
    targetCtx.beginPath(); targetCtx.arc(cx,cy,cr,0,Math.PI*2); targetCtx.stroke();
  }
  targetCtx.restore();
}
function drawRingedBackgroundPlanet(targetCtx,p){
  const q=planetPaint(p.seed), r=p.radius;
  const body=q.color(), ring=q.color(), tilt=q.range(-0.5,0.5);
  const oa=r*1.5, ob=oa*0.4, ia=r*1.1, ib=ia*0.4;
  targetCtx.save(); targetCtx.translate(p.x,p.y); targetCtx.rotate(tilt);
  targetCtx.globalAlpha=0.48; targetCtx.lineWidth=0.65; targetCtx.strokeStyle=ring;
    targetCtx.beginPath(); targetCtx.ellipse(0,0,oa,ob,0,0,Math.PI*2); targetCtx.stroke();
  targetCtx.beginPath(); targetCtx.ellipse(0,0,ia,ib,0,0,Math.PI*2); targetCtx.stroke();
  targetCtx.shadowBlur=0; targetCtx.globalAlpha=1; targetCtx.fillStyle='#000000';
  targetCtx.beginPath(); targetCtx.arc(0,0,r,0,Math.PI*2); targetCtx.fill();
  targetCtx.globalAlpha=0.48; targetCtx.strokeStyle=ring;
  targetCtx.beginPath(); targetCtx.ellipse(0,0,oa,ob,0,0,Math.PI); targetCtx.stroke();
  targetCtx.beginPath(); targetCtx.ellipse(0,0,ia,ib,0,0,Math.PI); targetCtx.stroke();
  targetCtx.strokeStyle=body;   targetCtx.beginPath(); targetCtx.arc(0,0,r,0,Math.PI*2); targetCtx.stroke();
  targetCtx.restore();
}
function drawContinentBackgroundPlanet(targetCtx,p){
  // Preserve the older game's continent placement geometry.  Continents are
  // deliberately allowed to extend beyond the circular limb and are clipped
  // by the planet disc, which gives the impression that land continues around
  // the globe.  Their bounding radii are kept apart before drawing so separate
  // continents do not pile over one another.
  const q=planetPaint(p.seed), radius=p.radius;
  const bodyColor=q.color(), landColor=q.color();

  targetCtx.save();
  targetCtx.translate(p.x,p.y);

  targetCtx.fillStyle='#000000';
  targetCtx.beginPath();
  targetCtx.arc(0,0,radius,0,Math.PI*2);
  targetCtx.fill();

  targetCtx.globalAlpha=0.48;
  targetCtx.lineWidth=0.65;
  targetCtx.strokeStyle=bodyColor;
  targetCtx.beginPath();
  targetCtx.arc(0,0,radius,0,Math.PI*2);
  targetCtx.stroke();

  const continentCount=3+((q.rand()*2)|0);
  const continents=[];
  const sizeFactors=[0.68,0.48,0.33];

  // Same deterministic shuffle used by the old background generator.
  for(let i=sizeFactors.length-1;i>0;i--){
    const j=(q.rand()*(i+1))|0;
    [sizeFactors[i],sizeFactors[j]]=[sizeFactors[j],sizeFactors[i]];
  }

  targetCtx.save();
  targetCtx.beginPath();
  targetCtx.arc(0,0,radius,0,Math.PI*2);
  targetCtx.clip();

  for(let i=0;i<continentCount;i++){
    let cx,cy,contR,baseSize;
    const sizeFactor=sizeFactors[i];

    let attempts=0;
    while(attempts<120){
      const centreAngle=q.range(0,Math.PI*2);
      const centreDist=q.range(radius*0.45,radius*0.95);
      cx=Math.cos(centreAngle)*centreDist;
      cy=Math.sin(centreAngle)*centreDist;

      baseSize=radius*sizeFactor*q.range(0.85,1.15);
      contR=baseSize*1.25;

      // Push this continent clear of every already accepted continent.
      for(const c of continents){
        const required=contR+c.r+radius*0.12;
        let dx=cx-c.x, dy=cy-c.y;
        let dist=Math.hypot(dx,dy);
        if(dist<required){
          if(dist<1e-3){
            const ang=q.range(0,Math.PI*2);
            dx=Math.cos(ang); dy=Math.sin(ang); dist=1;
          }
          const push=required-dist;
          cx+=(dx/dist)*push;
          cy+=(dy/dist)*push;
        }
      }

      // Keep the continent centre towards the limb.  Its outline may extend
      // outside the planet and is intentionally clipped, producing the old
      // wrap-around-the-globe look.
      const dCentre=Math.hypot(cx,cy);
      if(dCentre<radius*0.6){
        const scale=(radius*0.6)/(dCentre||1);
        cx*=scale; cy*=scale;
      }

      let ok=true;
      for(const c of continents){
        const required=contR+c.r+radius*0.12;
        if(Math.hypot(cx-c.x,cy-c.y)<required){ ok=false; break; }
      }
      if(ok) break;
      attempts++;
    }

    // This matches the old generator's behaviour: if its optional fourth
    // continent has no size factor, or placement failed numerically, skip it.
    if(!isFinite(cx)||!isFinite(cy)||!isFinite(contR)) continue;
    continents.push({x:cx,y:cy,r:contR});

    const points=7+((q.rand()*5)|0);
    targetCtx.beginPath();
    for(let k=0;k<=points;k++){
      const t=(k/points)*Math.PI*2;
      const wobble=q.range(0.7,1.3);
      const rLocal=baseSize*wobble;
      const x=cx+Math.cos(t)*rLocal;
      const y=cy+Math.sin(t)*rLocal;
      if(k===0) targetCtx.moveTo(x,y); else targetCtx.lineTo(x,y);
    }
    targetCtx.closePath();
    targetCtx.strokeStyle=landColor;
    targetCtx.stroke();
  }

  targetCtx.restore();
  targetCtx.restore();
}
function drawBackgroundPlanets(targetCtx){
  for(const p of backgroundPlanets){
    if(p.type==='rocky') drawRockyBackgroundPlanet(targetCtx,p);
    else if(p.type==='ringed') drawRingedBackgroundPlanet(targetCtx,p);
    else drawContinentBackgroundPlanet(targetCtx,p);
  }
}

function buildRomPath(pattern){
  let x=0, y=0, i=0;
  const pts=[[0,0]];
  let guard=0;
  while(i<pattern.length && pattern[i]!==0 && guard++<4096){
    const mv=ROM_MOVE_TABLE[pattern[i]];
    x+=mv[0]; y+=mv[1];
    pts.push([x,y]);
    const gridCoord = mv[1]!==0 ? y : x;
    if((gridCoord & 7)===0) i++;
  }
  return pts;
}
