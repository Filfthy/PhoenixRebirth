function processBigBirdShieldCollision(f){
  if(!player||!player.alive) return;
  const phase=f.bigBD2&0x1F;
  if(phase<0x0C || phase>=0x1C) return; // L3980 danger band only
  const shielded=shieldIsActive();
  const shipPoly=shielded?null:vcPlayerPoly();
  for(const b of f.birds){
    if(!b.alive || (b.growthState|0)===1) continue;
    const g=vcBigBirdGeometry(b);
    let part=null;
    if(g.egg){
      const hit=shielded
        ? vcSegmentHitsEllipse(player.x+4,player.y+PLAYER_SHIELD_Y_OFFSET,player.x+4,player.y+PLAYER_SHIELD_Y_OFFSET,g.egg.cx,g.egg.cy,g.egg.rx+16.2,g.egg.ry+17.5)
        : vcPolyHitsEllipse(shipPoly,g.egg.cx,g.egg.cy,g.egg.rx,g.egg.ry);
      if(hit) part='body';
    } else {
      const vis=vcBigBirdVisibleParts(b,g);
      const bodyHit=shielded
        ? (g.body&&vcPolyHitsEllipse(g.body,player.x+4,player.y+PLAYER_SHIELD_Y_OFFSET,16.2,17.5))
        : (g.body&&vcPolysIntersect(g.body,shipPoly));
      if(bodyHit) part='body';
      else {
        const leftHit=vis.left&&(shielded?vcPolyHitsEllipse(g.left,player.x+4,player.y+PLAYER_SHIELD_Y_OFFSET,16.2,17.5):vcPolysIntersect(g.left,shipPoly));
        const rightHit=vis.right&&(shielded?vcPolyHitsEllipse(g.right,player.x+4,player.y+PLAYER_SHIELD_Y_OFFSET,16.2,17.5):vcPolysIntersect(g.right,shipPoly));
        if(leftHit) part='left'; else if(rightHit) part='right';
      }
    }
    if(!part) continue;
    if(part==='body') hitBigBirdBody(b,b.renderX,b.renderY,18);
    else hitBigBirdWing(b,part,b.renderX,b.renderY);

    if(shielded){
      // L39F0 spends one extra shield tick for a bird contact.
      if(player.shieldCounter>0) player.shieldCounter=(player.shieldCounter-1)&0xFF;
      if(player.shieldCounter<=0xC0){
        player.shieldState='cooldown';
        player.shieldCounter=difficultyConfig().shieldCooldownFrames;
        player.shieldTimer=player.shieldCounter/PHOENIX_HZ;
        setVectorShieldSound(false);
      }
      break; // the synthetic probe is consumed by the first bird hit this frame
    } else {
      beginPlayerDeath();
      break;
    }
  }
}

const legacyStepBigBirdFrame=stepBigBirdFrame;
stepBigBirdBombs = function stepBigBirdBombsFidelity(f,aliveCount,lo){
  // L3400 only reaches L3930 on the even half, then L3A00 requires bit 1.
  if((lo&3)!==2 || aliveCount===0) return;
  const phase=f.bigBD2&0x1E;
  const [count,start]=BIG_BIRD_ACTIVE_WINDOW[(phase>>>1)&15];
  const danger=Math.max(0,Math.round((12-aliveCount)*difficultyConfig().birdDangerScale));
  const pb=mappedPlayerBounds();
  const left=(pb.left-danger)&0xFF, right=(pb.right+danger)&0xFF;
  for(let n=0;n<count;n++){
    const b=f.birds[start+n];
    if(!b||!b.alive||b.growthState<5) continue;
    const x=b.x&0xFF;
    const inX=left<=right?(x>=left&&x<right):(x>=left||x<right);
    if(!inX) continue;
    const row=((f.bigBD2+(b.screenAddr&0xFF))&0x1F);
    if(!spawnEnemyBullet(x,((row<<3)+20)&0xFF)) return;
  }
};
function stepBigLevelDispatcher(f){
  const lo=romCounter16&0xFF;
  const hi=(romCounter16>>>8)&0xFF;
  const alive=f.birds.reduce((n,b)=>n+(b.alive?1:0),0);
  if(alive===0){
    if((lo&1)===0){
      stepEnemyBulletsFrame();
      f.clearCounter++;
      if(f.clearCounter>=0x60) advanceRound();
    }
    return;
  }

  processBigBirdBulletCollisions(f); // L3800 before vertical movement
  for(const b of f.birds){ b.prevX=b.renderX; b.prevY=b.renderY; }
  f.bigCounter16=(romCounter16-1)&0xFFFF;
  legacyStepBigBirdFrame(f);          // uses central counter after its increment
  processBigBirdBulletCollisions(f); // L3800 again after movement
  processBigBirdShieldCollision(f);
  if((lo&1)===0) stepEnemyBulletsFrame();

  for(const b of f.birds){
    if(!b.alive) continue;
    b.renderX=b.x;
    b.renderY=b.y;
  }
}

function createBossEscortForFade(){
  if(bossEscortFormation) return;
  bossEscortFormation=new Formation(MOTHERSHIP_ESCORT_META,cycle+1);
  prepareSmallFormationFidelity(bossEscortFormation);
  bossEscortFormation.revealAlpha=0.35;

function updateBossPreludeY(b){
  const descended=(0x71-b.counterB9)&0xFF;
  b.y=b.entryY-0x78+clamp(descended,0,0x78); // 1px per StarsScrollDown step
}
function stepBossPreludeFrame(b){
  if(b.state==='fade9'){
    // Level 9: T05CC gives CounterB4=$48. L22B4 scrolls once per frame,
    // taking CounterB9 from $71 to $29 over 72 steps.
    b.counterB9=(b.counterB9-1)&0xFF;
    b.phaseCounter--;
    updateBossPreludeY(b);
    b.revealAlpha=clamp((0x48-b.phaseCounter)/48,0,1);
    if(b.phaseCounter<=0){
      b.phaseCounter=0xC0;
      b.state='fadeA';
      b.revealAlpha=1;
    }
    return;
  }
  if(b.state==='fadeA'){
    // L22CA special-cases the first $C0 frame: it seeds $30 without scrolling.
    if(b.phaseCounter===0xC0){
      b.phaseCounter=0x30;
      return;
    }
    b.counterB9=(b.counterB9-1)&0xFF;
    b.phaseCounter--;
    updateBossPreludeY(b);
    const c=b.phaseCounter;
    if(c<0x15){
      createBossEscortForFade();
      bossEscortFormation.revealAlpha = c>=0x11?0.35 : c>=0x0D?0.55 : c>=0x09?0.72 : c>=0x05?0.88 : 1;
      if(bossEscortFormation.entranceActive) stepSmallFormationEntrance(bossEscortFormation);
      else stepSmallVisualFormation(bossEscortFormation);
    }
    if(c<=0){
      b.state='active';
      // $71 - $48 - $30 wraps to $F9: the actual level-B starting height.
      b.counterB9=0xF9;
      b.y=b.entryY;
      b.houseCounter=0; b.beltVisualPhase=0;
      if(!bossEscortFormation) createBossEscortForFade();
      bossEscortFormation.revealAlpha=1;
    }
  }
}

function tryMothershipBomb(b){
  if(!b||b.state!=='active') return;
  const lo=romCounter16&0xFF;
  if((lo&3)!==3) return; // L24A0
  const rnd=smallRomRandom();
  const candidate=(0x60+rnd)&0xFF;
  if(((candidate&0x0E)&lo)!==0) return;
  const pb=mappedPlayerBounds();
  if(candidate<=pb.left||candidate>pb.right) return;
  const y=((((-b.counterB9)&0xF8)+0x48+0x0C)&0xFF);

function mothershipBonusScore(b){

          VectorSynth.explosion('boss'); VectorSynth.furElise();
          startBossExplosion(boss);
        }
      } else {
        boss.beltHalves[hit.source]=bossDamageBeltHalf(hit.state); boss.hitFlashT=performance.now();
        VectorSynth.wingHit(); spawnBurst(bul.x,bul.y,'#d83bdb',4);
      }
    }
  }
};

// ROM-state driven player vector pose: X&7 selects the same 8 animation phases
// used to index T1600. No time-based sine gait or random flame flicker.

/* ---------- player ship: rocket-pod craft with roll ----------
   World units (1 = one arcade pixel). ROM player.y is the top of its 16px 2x2 object; the custom vector is translated to that same top edge.
   Outline style: black mask fill, coloured stroke. Arcade red and yellow. */
function shipMirror(half){ return half.concat(half.slice(1,-1).reverse().map(p=>[-p[0],p[1]])); }
const SHIP_BODY_RAIL=[[0,-10.2],[0.9,-7.6],[1.4,-4.6],[1.8,-2.2],[2.8,-0.6],[2.8,3.4],[1.6,5.2]];
const SHIP_BODY_LAIL=SHIP_BODY_RAIL.map(p=>[-p[0],p[1]]);
const SHIP_BODY=shipMirror([[0,-10.2],[0.9,-7.6],[1.4,-4.6],[1.8,-2.2],[2.8,-0.6],[2.8,3.4],[1.6,5.2],[0,5.2]]);
const SHIP_PANEL_R=[[0.62,-5.9],[0.9,-3.1],[1.12,-0.3],[1.05,2.4]];
const SHIP_PANEL_L=SHIP_PANEL_R.map(p=>[-p[0],p[1]]);
const SHIP_PANEL=[[0,-8],[0.7,-5.4],[1,-2.6],[1.3,2.6],[0,3.8],[-1.3,2.6],[-1,-2.6],[-0.7,-5.4]];
const SHIP_POD=[[0,-4.4],[1.3,-2.8],[1.3,2.4],[0.8,3],[1.4,4.4],[-1.4,4.4],[-0.8,3],[-1.3,2.4],[-1.3,-2.8]];
const SHIP_POD_X=6.2, SHIP_POD_Y=1.6, SHIP_CANOPY_Y=-3.4;
const SHIP_COL={red:'#ff3048',redBack:'#6e1420',yel:'#ffd23f',white:'#ffffff',flame:'#ff9a1f',core:'#ffe98a',mask:'#000000'};
const SHIP_PULSE=[0.15,0.35,0.62,1.0,0.62,0.35,0.20,0.48];
const SHIP_MAX_ROLL=0.35;   // radians (~20 degrees)
const SHIP_ROLL_EASE=0.15;  // per 61 Hz simulation frame
const shipRollState={x:null,counter:-1,roll:0};

function shipTrace(pts,close){
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  if(close!==false) ctx.closePath();
}
function shipShape(pts,stroke){ shipTrace(pts,true); ctx.fillStyle=SHIP_COL.mask; ctx.fill(); ctx.strokeStyle=stroke; ctx.stroke(); }
function shipLine(pts,stroke){ shipTrace(pts,false); ctx.strokeStyle=stroke; ctx.stroke(); }
function shipPlace(pts,dx,k,cx,cy){ return pts.map(p=>[cx+p[0]*k+dx, cy+p[1]*k]); }
function shipFlame(x,y,k,len,w){
  ctx.lineWidth=0.6; ctx.strokeStyle=SHIP_COL.flame;
  ctx.beginPath(); ctx.moveTo(x-w*k,y); ctx.lineTo(x,y+len*k); ctx.lineTo(x+w*k,y); ctx.stroke();
  ctx.lineWidth=0.45; ctx.strokeStyle=SHIP_COL.core;
  ctx.beginPath(); ctx.moveTo(x-w*0.45*k,y); ctx.lineTo(x,y+len*0.5*k); ctx.lineTo(x+w*0.45*k,y); ctx.stroke();
}

// Advance the bank angle once per simulation frame that has elapsed, based on
// how player.x changed. Runs off romCounter16, so pause freezes it.
function updateShipRoll(){
  const c=romCounter16|0;
  const s=shipRollState;
  if(s.x===null){ s.x=player.x; s.counter=c; return s.roll; }
  let frames=(c-s.counter)&0xFFFF;
  if(frames===0) return s.roll;
  if(frames>8) frames=8;
  const dx=player.x-s.x;
  if(Math.abs(dx)>4){ s.roll=0; }            // respawn or teleport: no bank
  else {
    const target=dx>0?SHIP_MAX_ROLL:(dx<0?-SHIP_MAX_ROLL:0);
    for(let i=0;i<frames;i++) s.roll+=(target-s.roll)*SHIP_ROLL_EASE;
  }
  s.x=player.x; s.counter=c;
  return s.roll;
}

// Signature unchanged: called by drawPlayerFidelity as drawPlayerVectorShip(x,y,pose).
function drawPlayerVectorShip(x,y,pose){
  const roll=updateShipRoll();
  const cs=Math.cos(roll), sn=Math.sin(roll), back=-sn*1.3;
  const pulse=SHIP_PULSE[pose&7]+((romCounter16>>>1)&1)*0.35;
  const pods=[-1,1].map(side=>({side, x:side*SHIP_POD_X, y:SHIP_POD_Y, k:1-0.09*side*sn}));

  ctx.save();
  ctx.translate(x,y+PLAYER_VECTOR_Y_OFFSET);
  ctx.scale(cs,1);
  ctx.lineJoin='miter'; ctx.miterLimit=4; ctx.lineCap='round';

  // flames behind everything
  for(const p of pods) shipFlame(p.x,p.y+4.4*p.k,p.k,2.4+pulse*2.2,1.05);
  shipFlame(0,5.2,1,1.4+pulse*1.2,0.7);

  // A little underside parallax when banked, but only as exposed edges rather
  // than a second complete silhouette. This keeps the ship visually open.
  if(Math.abs(back)>0.04){
    ctx.lineWidth=0.48;
    shipLine([[back-1.55,5.2],[back+1.55,5.2]],SHIP_COL.redBack);
    for(const p of pods){
      shipLine([[p.x-1.15*p.k+back,p.y+4.15*p.k],[p.x+1.15*p.k+back,p.y+4.15*p.k]],SHIP_COL.redBack);
    }
  }

  // struts
  ctx.lineWidth=0.62;
  for(const p of pods) shipLine([[p.side*2.6,0.2],[p.x-p.side*1.3*p.k,0.2]],SHIP_COL.red);

  // rocket pods: retain the compact pod outline, but reduce the internal bands.
  for(const p of pods){
    ctx.lineWidth=0.66; shipShape(shipPlace(SHIP_POD,0,p.k,p.x,p.y),SHIP_COL.red);
    ctx.lineWidth=0.44;
    shipLine([[p.x-0.65*p.k,p.y-1.15*p.k],[p.x+0.65*p.k,p.y-1.15*p.k]],SHIP_COL.yel);
  }

  // Open fuselage rails instead of a closed central polygon. The black field
  // now remains visible through the ship, bringing it back into the same thin
  // vector language as the rest of the game.
  ctx.lineWidth=0.68;
  shipLine(SHIP_BODY_RAIL,SHIP_COL.red);
  shipLine(SHIP_BODY_LAIL,SHIP_COL.red);
  shipLine([[-1.6,5.2],[1.6,5.2]],SHIP_COL.redBack);
  const par=sn*0.45;
  ctx.lineWidth=0.46;
  shipLine(shipPlace(SHIP_PANEL_R,par,1,0,0),SHIP_COL.yel);
  shipLine(shipPlace(SHIP_PANEL_L,par,1,0,0),SHIP_COL.yel);
  const cy=SHIP_CANOPY_Y;
  ctx.lineWidth=0.52;
  shipLine([[par-0.55,cy+0.1],[par,cy-0.95],[par+0.55,cy+0.1]],SHIP_COL.white);

  ctx.restore();
}

function drawVectorBubbleShield(x,y,counter){
  const phase=((counter||0)&31)*0.17, count=48;
  ctx.save(); ctx.translate(x,y);
  ctx.strokeStyle='rgba(57,214,255,0.92)';
  ctx.lineWidth=0.56; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  for(let i=0;i<=count;i++){
    const a=(i/count)*Math.PI*2;
    const wobble=0.34*Math.sin(a*3+phase)+0.19*Math.sin(a*5-phase*0.63);
    const rx=16.2+wobble, ry=17.4+wobble*0.82;
    const sx=Math.cos(a)*rx, sy=Math.sin(a)*ry;
    if(i===0) ctx.moveTo(sx,sy); else ctx.lineTo(sx,sy);
  }
  ctx.closePath(); ctx.stroke(); ctx.restore();
}

drawPlayer = function drawPlayerFidelity(){
  if(!player||!player.alive) return;
  const {x,y}=player;
  const pose=player.romPose&7;
  drawPlayerVectorShip(x+4,y,pose);
  if(shieldIsActive()){
    drawVectorBubbleShield(x+4,y+PLAYER_SHIELD_Y_OFFSET,player.shieldCounter);
  }
};

function drawBossEscortFidelity(){
  if(!bossEscortFormation) return;
  const alpha=bossEscortFormation.revealAlpha===undefined?1:bossEscortFormation.revealAlpha;
  ctx.save(); ctx.globalAlpha*=alpha;
  const seen=new Set();
  for(const b of bossEscortFormation.birds){
    if(!b.alive) continue;
    // During the fade only, stacked T15E0 pairs represent the same foreground pixels.
    if(currentBoss && currentBoss.state==='fadeA'){
      const key=(Math.round(b.x)&255)+','+(Math.round(b.y)&255);
      if(seen.has(key)) continue; seen.add(key);
    }
    drawBird(b);
  }
  ctx.restore();
}

function drawTitleBackground(){
  const titleScale=canvas.height/LOGICAL_H;
  const worldW=canvas.width/titleScale;
  const xPad=(worldW-LOGICAL_W)*0.5;
  ctx.setTransform(titleScale,0,0,titleScale,0,0);
  ctx.fillStyle='#000000';
  ctx.fillRect(0,0,worldW,LOGICAL_H);
  for(const s of stars){
    ctx.globalAlpha=Math.min(1,s.baseAlpha+s.maxAlphaBoost*s.brightness);
    ctx.fillStyle='#ffffff';
    const base=s.x+xPad;
    for(const dx of [-LOGICAL_W,0,LOGICAL_W]){
      const xx=base+dx;
      if(xx>=-1 && xx<=worldW+1) ctx.fillRect(xx,s.y,s.size,s.size);
    }
  }
  ctx.globalAlpha=1;
  ctx.save();
  ctx.translate(xPad,0);
  drawBackgroundPlanets(ctx);
  ctx.restore();
}

render = function renderFidelity(){
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,canvas.width,canvas.height);
  const menuScreen=(state==='title'||state==='gameover');
  if(menuScreen){
    drawTitleBackground();
    return;
  }
  ctx.setTransform(viewScale,0,0,viewScale,viewOffsetX,viewOffsetY);
  drawBackground();
  if(currentFormation){ for(const b of currentFormation.birds) if(b.alive) drawBird(b); }
  if(currentBoss){
    ctx.save(); ctx.globalAlpha*=currentBoss.revealAlpha===undefined?1:currentBoss.revealAlpha; drawBoss(); ctx.restore();
    drawBossEscortFidelity();
  }
  drawBullets(); drawPlayer(); drawParticles(); drawPopups(); drawScreenFX();
  if(currentBoss && currentBoss.state==='dead' && currentBoss.deadFrames<=0 && currentBoss.bonusFrames>0){
    drawCenterText('MOTHERSHIP BONUS '+String(currentBoss.bonusScore||0).padStart(4,'0'),'#ffd23f');
  }
  if(state==='roundclear') drawCenterText(roundBannerText,'#ffd23f');
  if(state==='paused') drawCenterText('PAUSED','#39d6ff');
};

function stepPhoenixFrame(){
  romCounter16=(romCounter16+1)&0xFFFF;
  sampleFireInputFrame();
  if(currentBoss && currentBoss.state==='active') currentBoss.beltVisualPhase+=1/8;

  if(stepPlayerDeathFrame()){
    syncVectorSynthState();
    updateParticles(PHOENIX_FRAME); updateStars(PHOENIX_FRAME); updatePopups(PHOENIX_FRAME); updateHUD();
    return;
  }

  if(currentBoss && (currentBoss.state==='fade9'||currentBoss.state==='fadeA')){
    stepBossPreludeFrame(currentBoss);
    syncVectorSynthState();
    updateParticles(PHOENIX_FRAME); updateStars(PHOENIX_FRAME); updatePopups(PHOENIX_FRAME); updateHUD();
    return;
  }

  const bossDeathSequence=!!(currentBoss && currentBoss.state==='dead');
  if(!bossDeathSequence) stepPlayerFrame();

  if(currentBoss){
    if(currentBoss.state==='dead'){
      if(currentBoss.deadFrames>0){
        stepBossExplosionFrame(currentBoss);
        currentBoss.deadFrames--;
      } else if(currentBoss.bonusFrames>0){
        currentBoss.bonusFrames--;
      } else {
        advanceRound();
      }
    } else if(currentBoss.state==='active'){
      if(bossEscortFormation) processSmallBulletCollisions(bossEscortFormation); // L0DF0
      handleBossBulletCollisions();                        // L24A0 bullet-vs-mothership
      tryMothershipBomb(currentBoss);                      // L24A0 return fire
      if(bossEscortFormation) stepSmallLevelDispatcher(bossEscortFormation);
    }
  } else if(currentFormation){
    if(currentFormation.kind==='small'){
      processSmallBulletCollisions(currentFormation);
      stepSmallLevelDispatcher(currentFormation);
    } else {
      stepBigLevelDispatcher(currentFormation);
    }
  }

  bullets=bullets.filter(b=>!b.dead);
  syncVectorSynthState();
  updateParticles(PHOENIX_FRAME); updateStars(PHOENIX_FRAME); updatePopups(PHOENIX_FRAME); updateHUD();
}

update = function(){ stepPhoenixFrame(); };

  VectorSynth.introTheme();

  firePrev=currentFireDown(); firePressedThisFrame=false; rapidFireCheatFrames=0; scoreEl.style.visibility='visible';
  syncCheatControls();
  phoenixAccumulator=0; phoenixRenderAlpha=0; transitionFrames=0;
  bullets=[]; particles=[]; popups=[]; escortBirds=[]; bossEscortFormation=null;
  player=new Player();
  spawnRound(); state='playing';
  document.body.classList.remove('title-mode','gameover-mode');

loop = function loopFidelity(now){
  let elapsed=(now-last)/1000; last=now;
  elapsed=Math.min(Math.max(elapsed,0),0.25);
  if(captureGateActive){
    phoenixAccumulator=0;
    render();
    requestAnimationFrame(loop);
    return;
  }
  pollGamepadInput();
  if(state==='paused'){
    phoenixAccumulator=0;
  } else {
    phoenixAccumulator+=elapsed;
    let guard=0;
    while(phoenixAccumulator>=PHOENIX_FRAME && guard++<12){
      phoenixAccumulator-=PHOENIX_FRAME;
      if(state==='playing') stepPhoenixFrame();
      else if(state==='roundclear'){
        sampleFireInputFrame();
        transitionFrames--;
        updateAmbient(PHOENIX_FRAME);
        if(transitionFrames<=0){ spawnRound(); state='playing'; }
      } else {
        sampleFireInputFrame();
        updateAmbient(PHOENIX_FRAME);
      }
    }
    if(guard>=12) phoenixAccumulator=0;
  }
  phoenixRenderAlpha=clamp(phoenixAccumulator/PHOENIX_FRAME,0,1);
  render();
  renderOverlayBirds(now||performance.now());
  requestAnimationFrame(loop);
};

/* ---------- input ---------- */
function gamepadButtonDown(buttons,index,threshold=0.5){
  const b=buttons && buttons[index];
  return !!b && (b.pressed || b.value>threshold);
}
function pollGamepadInput(){
  let gp=null;
  if(navigator.getGamepads){
    const pads=navigator.getGamepads();
    for(let i=0;i<pads.length;i++){
      if(pads[i] && pads[i].connected){ gp=pads[i]; break; }
    }
  }
  if(!gp){
    gamepadState.left=gamepadState.right=gamepadState.fire=gamepadState.shield=false;
    gamepadState.shieldPrev=false;
    gamepadState.menuPrev=false;
    return;
  }

  const axisX=(gp.axes && Number.isFinite(gp.axes[0])) ? gp.axes[0] : 0;
  const DEADZONE=0.35;
  gamepadState.left = gamepadButtonDown(gp.buttons,14) || axisX < -DEADZONE;
  gamepadState.right = gamepadButtonDown(gp.buttons,15) || axisX > DEADZONE;

  // Standard mapping: A / right trigger = fire. B / either shoulder = shield.
  gamepadState.fire = gamepadButtonDown(gp.buttons,0) || gamepadButtonDown(gp.buttons,7,0.35);
  const shieldDown = gamepadButtonDown(gp.buttons,1) ||
                     gamepadButtonDown(gp.buttons,4) ||
                     gamepadButtonDown(gp.buttons,5);
  gamepadState.shield=shieldDown;
  if(shieldDown && !gamepadState.shieldPrev) tryActivateShield();
  gamepadState.shieldPrev=shieldDown;

  // Start button: start/restart from menus, pause/resume during play.
  const menuDown=gamepadButtonDown(gp.buttons,9);
  if(menuDown && !gamepadState.menuPrev){
    if(state==='title') startAtDifficulty('standard');
    else if(state==='gameover') startAtDifficulty(difficultyKey);
    else if(state==='playing'||state==='paused') togglePause();
  }
  gamepadState.menuPrev=menuDown;
}

window.addEventListener('keydown', function(e){
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code)!==-1) e.preventDefault();
  const isShieldKey = e.code==='ShiftLeft'||e.code==='ShiftRight'||e.code==='KeyZ'||e.code==='ArrowUp'||e.code==='ArrowDown';
  if(isShieldKey && !keys.has(e.code)) tryActivateShield(); // edge-triggered: tap, not hold
  keys.add(e.code);
  if(e.code==='KeyP' && (state==='playing'||state==='paused')) togglePause();
  if(e.code==='Enter'){
    if(state==='title') startAtDifficulty('standard');
    else if(state==='gameover') startAtDifficulty(difficultyKey);
  }
});
window.addEventListener('keyup', function(e){ keys.delete(e.code); });

function bindHold(el, onDown, onUp){
  if(!el) return;
  const start=function(e){ e.preventDefault(); onDown(); el.classList.add('active'); };
  const end=function(e){ e.preventDefault(); onUp(); el.classList.remove('active'); };
  el.addEventListener('touchstart', start, {passive:false});
  el.addEventListener('touchend', end);
  el.addEventListener('touchcancel', end);
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', end);
  el.addEventListener('mouseleave', end);
}

/* ---------- title/gameover decorative birds ---------- */
const titleBirdCanvas=document.getElementById('title-birds');
const gameoverBirdCanvas=document.getElementById('gameover-birds');

function overlayBirdPalette(variant){
  return variant===1
    ? { wing:'#ff59f7', body:'#00d47a', eye:'#ffffff', mask:'#000000' }
    : { wing:'#ffff00', body:'#ff00f1', eye:'#ffffff', mask:'#000000' };
}
function overlayLerpPts(a,b,t){
  const out=[];
  for(let i=0;i<a.length;i++) out.push([lerp(a[i][0],b[i][0],t),lerp(a[i][1],b[i][1],t)]);
  return out;
}
function overlayMirrorPoints(points){ return points.map(p=>[-p[0],p[1]]); }
function overlayPath(c,pts,closed=true){
  c.beginPath();
  c.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) c.lineTo(pts[i][0],pts[i][1]);
  if(closed!==false) c.closePath();
}
function overlayShape(c,pts,stroke,fill){
  overlayPath(c,pts,true);
  c.fillStyle=fill; c.fill();
  c.strokeStyle=stroke; c.stroke();
}
function overlayLine(c,pts,stroke){
  overlayPath(c,pts,false);
  c.strokeStyle=stroke; c.stroke();
}
function overlayWingAccentPoints(w){
  if(!w||w.length<8) return w||[];
  const half=Math.floor((w.length-1)/2);
  const innerCount=Math.max(1,w.length-half-1);
  const out=[];
  for(const f of [0.06,0.20,0.36,0.52]){
    const oi=Math.min(half,1+Math.round(Math.max(0,half-1)*f));
    const ii=Math.min(w.length-1,half+1+Math.round(Math.max(0,innerCount-1)*(1-f)));
    const a=w[oi],b=w[ii];
    out.push([a[0]*0.68+b[0]*0.32,a[1]*0.68+b[1]*0.32]);
  }
  return out;
}
function overlayDrawBirdBody(ctx2d,m,pal){
  ctx2d.lineWidth=0.72;
  overlayShape(ctx2d,m.body,pal.body,pal.mask);
  ctx2d.lineWidth=0.5;
  overlayShape(ctx2d,m.beak,pal.wing,pal.mask);
  ctx2d.fillStyle=pal.eye;
  for(const e of m.eyes){
    ctx2d.beginPath();
    ctx2d.arc(e[0],e[1],m.eyeR,0,Math.PI*2);
    ctx2d.fill();
  }
}
function drawOverlayBird(ctx2d,bird,timeMs){
  const m=smallModel();
  const pal=overlayBirdPalette(bird.variant);
  ctx2d.save();
  ctx2d.translate(bird.x,bird.y);
  if(bird.rotation) ctx2d.rotate(bird.rotation);
  if(bird.bank) ctx2d.scale(1-bird.bank,1);
  ctx2d.scale(bird.scale,bird.scale);
  ctx2d.lineJoin='round';
  ctx2d.lineCap='round';

  if(bird.pose==='march'){
    // Use the same folded/cape-like marching silhouette as the in-game bird.
    // Legs and body bob are driven independently so this reads as an actual
    // march rather than a flight pose simply held upright.
    const cyc=2*Math.PI*((timeMs+bird.flapOffset)/880);
    const breath=0.5-0.5*Math.cos(cyc);
    const s=Math.sin(cyc);
    const bob=-0.8*Math.abs(s);
    const wings=overlayLerpPts(m.marchOpen,m.marchClosed,breath);

    ctx2d.save();
    ctx2d.translate(0,bob);
    for(const wing of [wings,overlayMirrorPoints(wings)]){
      ctx2d.lineWidth=0.72;
      overlayShape(ctx2d,wing,pal.wing,pal.mask);
    }
    overlayDrawBirdBody(ctx2d,m,pal);
    ctx2d.restore();

    ctx2d.lineWidth=0.62;
    for(const d of [-1,1]){
      const lift=smallSmooth(Math.max(0,d*s));
      const hx=d*0.75, hy=3.2+bob;
      const fx=d*(1.3-0.4*lift), fy=7-2.2*lift;
      const kx=d*(1.6+lift), ky=(hy+fy)/2-0.5-0.9*lift;
      const drop=0.35+0.5*lift;
      overlayLine(ctx2d,[[hx,hy],[kx,ky],[fx,fy]],pal.body);
      overlayLine(ctx2d,[[fx-d*0.8,fy+drop],[fx,fy],[fx+d*0.8,fy+drop]],pal.body);
      overlayLine(ctx2d,[[fx,fy],[fx,fy+drop+0.25]],pal.body);
    }
    ctx2d.restore();
    return;
  }

  let wingPoints;
  if(bird.pose==='dive'){
    const q=0.5+0.5*Math.sin(2*Math.PI*(timeMs*0.85+bird.flapOffset)/380);
    wingPoints=overlayLerpPts(m.diveOpen,m.diveFlex,q);
  }else{
    wingPoints=smallFlapWing(m,(timeMs+bird.flapOffset)/320);
  }
  for(const wing of [wingPoints,overlayMirrorPoints(wingPoints)]){
    ctx2d.lineWidth=0.72;
    overlayShape(ctx2d,wing,pal.wing,pal.mask);
    ctx2d.lineWidth=0.45;
    overlayLine(ctx2d,overlayWingAccentPoints(wing),pal.body);
  }
  overlayDrawBirdBody(ctx2d,m,pal);
  ctx2d.restore();
}
function overlayEase01(t){
  t=clamp(t,0,1);
  return t*t*(3-2*t);
}
function overlayBezierPoint(p0,p1,p2,p3,t){
  const u=1-t,uu=u*u,tt=t*t;
  return [
    uu*u*p0[0]+3*uu*t*p1[0]+3*u*tt*p2[0]+tt*t*p3[0],
    uu*u*p0[1]+3*uu*t*p1[1]+3*u*tt*p2[1]+tt*t*p3[1]
  ];
}
function overlayCatmullPoint(points,t){
  t=clamp(t,0,1);
  const segments=points.length-1;
  const scaled=t*segments;
  const segment=Math.min(segments-1,Math.floor(scaled));
  const u=(t>=1)?1:(scaled-segment);
  const p0=points[Math.max(0,segment-1)];
  const p1=points[segment];
  const p2=points[Math.min(points.length-1,segment+1)];
  const p3=points[Math.min(points.length-1,segment+2)];
  const u2=u*u,u3=u2*u;
  const cr=(a,b,c,d)=>0.5*((2*b)+(-a+c)*u+(2*a-5*b+4*c-d)*u2+(-a+3*b-3*c+d)*u3);
  return [cr(p0[0],p1[0],p2[0],p3[0]),cr(p0[1],p1[1],p2[1],p3[1])];
}
function overlayRotate(v,a){
  const c=Math.cos(a),s=Math.sin(a);
  return [v[0]*c-v[1]*s,v[0]*s+v[1]*c];
}
function overlayAdd2(a,b){ return [a[0]+b[0],a[1]+b[1]]; }
function overlayScale2(a,s){ return [a[0]*s,a[1]*s]; }

// Short silent display routines for the title/game-over screens. These are
// decorative only: they do not use enemy schedules, collision, bombs or audio.
const OVERLAY_ROUTINE_MS=9800;
// New squadrons still launch before the previous one clears. Arrival now uses
// the same fast timing vocabulary as the real small-bird wave entrance:
// roughly 22-24 Phoenix frames per bird with the same 2-frame pair stagger.
const OVERLAY_ROUTINE_INTERVAL_MS=7000;
const OVERLAY_FRAME_PHASE=(PHOENIX_FRAME*1000)/OVERLAY_ROUTINE_MS;
const OVERLAY_ENTER_END=0.052;
const OVERLAY_SETTLE_END=0.115;
const OVERLAY_MARCH_END=0.38;
const OVERLAY_STUNT_END=0.84;
const OVERLAY_EXIT_END=0.97;
function overlayEntryTiming(index){
  const wave=Math.floor(index/2);
  const delay=wave*2*OVERLAY_FRAME_PHASE;
  const duration=(22+(wave%3)*2)*OVERLAY_FRAME_PHASE;
  return {delay,duration,end:delay+duration};
}
const OVERLAY_BIRD_ROUTINES=[
  {
    count:4, variant:0, scale:2.45, spinTurns:1.35, orbitTurns:1.6,
    center:[0.20,0.29],
    formation:[[0,-0.052],[-0.048,0],[0.048,0],[0,0.052]], // diamond
    starts:[[-0.10,0.18],[-0.13,0.36],[-0.11,0.56],[-0.15,0.74]],
    route:[[0.20,0.29],[0.20,0.11],[0.49,0.15],[0.74,0.42],[0.43,0.69],[0.74,0.73],[0.89,0.31]],
    exits:[[1.10,0.13],[1.13,0.34],[1.10,0.59],[1.15,0.80]]
  },
  {
    count:3, variant:1, scale:2.60, spinTurns:-1.8, orbitTurns:2.1,
    center:[0.80,0.27],
    formation:[[0,-0.057],[-0.055,0.038],[0.055,0.038]], // triangle
    starts:[[1.11,0.20],[1.14,0.48],[1.10,0.74]],
    route:[[0.80,0.27],[0.78,0.10],[0.53,0.20],[0.34,0.53],[0.67,0.70],[0.49,0.36],[0.14,0.48]],
    exits:[[-0.11,0.20],[-0.14,0.48],[-0.10,0.77]]
  },
  {
    count:4, variant:0, scale:2.38, spinTurns:2.15, orbitTurns:1.25,
    center:[0.50,0.23],
    formation:[[-0.072,0.040],[-0.024,0],[0.024,0],[0.072,0.040]], // shallow V
    starts:[[0.17,1.10],[0.39,1.13],[0.62,1.11],[0.84,1.14]],
    route:[[0.50,0.23],[0.50,0.08],[0.22,0.34],[0.48,0.64],[0.80,0.31],[0.57,0.72],[0.50,0.18]],
    exits:[[0.12,-0.12],[0.38,-0.14],[0.64,-0.13],[0.88,-0.11]]
  },
  {
    count:3, variant:1, scale:2.62, spinTurns:-2.35, orbitTurns:2.7,
    center:[0.20,0.66],
    formation:[[-0.058,-0.020],[0,0.050],[0.058,-0.020]], // arrowhead
    starts:[[0.08,-0.12],[0.40,-0.15],[0.72,-0.11]],
    route:[[0.20,0.66],[0.17,0.45],[0.40,0.25],[0.72,0.42],[0.52,0.73],[0.79,0.61],[0.84,0.39]],
    exits:[[0.78,1.12],[0.96,1.15],[1.12,0.88]]
  }
];

function createOverlayBirds(){
  return Array.from({length:4},(_,i)=>({
    x:0,y:0,rotation:0,bank:0,pose:'flight',scale:2.4,variant:0,
    flapOffset:i*91
  }));
}
const overlayBirdScenes={
  title:{ canvas:titleBirdCanvas, birds:createOverlayBirds(), active:false, startedAt:0, startRoutine:0 },
  gameover:{ canvas:gameoverBirdCanvas, birds:createOverlayBirds(), active:false, startedAt:0, startRoutine:1 },
  capture:{ canvas:captureBirdCanvas, birds:createOverlayBirds(), active:false, startedAt:0, startRoutine:2 }
};
function sizeOverlayBirdCanvas(canvas){
  if(!canvas) return null;
  const rect=canvas.getBoundingClientRect();
  const dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  const w=Math.max(1,Math.round(rect.width*dpr));
  const h=Math.max(1,Math.round(rect.height*dpr));
  if(canvas.width!==w||canvas.height!==h){
    canvas.width=w; canvas.height=h;
  }
  const ctx2d=canvas.getContext('2d');
  ctx2d.setTransform(dpr,0,0,dpr,0,0);
  return {ctx2d,rect};
}
function overlayFormationPoint(def,index){
  return overlayAdd2(def.center,def.formation[index]);
}
function overlayStuntPoint(def,index,t){
  const center=overlayCatmullPoint(def.route,t);
  const eased=overlayEase01(t);
  const spin=eased*def.spinTurns*Math.PI*2;
  const spread=1+0.30*Math.sin(Math.PI*t)+0.72*overlayEase01((t-0.58)/0.42);
  let off=overlayRotate(def.formation[index],spin);
  off=overlayScale2(off,spread);
  // Once the formation breaks, each bird gets a small phase-shifted orbit.
  // The group still reads as one manoeuvre rather than four unrelated sprites.
  const orbitAmp=0.019*Math.sin(Math.PI*t)*overlayEase01(t/0.22);
  const orbitA=(t*def.orbitTurns+index/def.count)*Math.PI*2;
  off[0]+=Math.cos(orbitA)*orbitAmp;
  off[1]+=Math.sin(orbitA)*orbitAmp*0.72;
  return overlayAdd2(center,off);
}
function overlayRoutinePosition(def,index,phase){
  const formation=overlayFormationPoint(def,index);
  if(phase<OVERLAY_ENTER_END){
    const timing=overlayEntryTiming(index);
    if(phase<=timing.delay) return {visible:false,x:def.starts[index][0],y:def.starts[index][1],stage:'enter',t:0};
    const raw=clamp((phase-timing.delay)/Math.max(1e-6,timing.duration),0,1);
    const e=easeOutBack(raw);
    const start=def.starts[index];
    // Match the real wave entrance feel: a very fast off-screen rush with the
    // same ease-out/overshoot used by setupSmallFormationEntrance(), plus a
    // small arrival arc.  The visual zoom happens over these same ~22 frames.
    const arc=Math.sin(Math.PI*raw)*0.030*(1-raw*0.35)*(index%2?0.86:1.0);
    const x=start[0]+(formation[0]-start[0])*e;
    const y=start[1]+(formation[1]-start[1])*e-arc;
    return {visible:true,x,y,stage:'enter',t:raw};
  }
  if(phase<OVERLAY_SETTLE_END){
    const q=overlayEase01((phase-OVERLAY_ENTER_END)/(OVERLAY_SETTLE_END-OVERLAY_ENTER_END));
    const bob=Math.sin(q*Math.PI)*0.003*(index%2?-1:1);
    return {visible:true,x:formation[0],y:formation[1]+bob,stage:'settle',t:q};
  }
  if(phase<OVERLAY_MARCH_END){
    const q=(phase-OVERLAY_SETTLE_END)/(OVERLAY_MARCH_END-OVERLAY_SETTLE_END);
    // Formation remains locked while the birds visibly march. A tiny collective
    // sway stops the pause from looking like frozen sprites without changing slots.
    const sway=Math.sin(q*Math.PI*2)*0.004;
    return {visible:true,x:formation[0]+sway,y:formation[1],stage:'march',t:q};
  }
  if(phase<OVERLAY_STUNT_END){
    const q=(phase-OVERLAY_MARCH_END)/(OVERLAY_STUNT_END-OVERLAY_MARCH_END);
    const p=overlayStuntPoint(def,index,q);
    return {visible:true,x:p[0],y:p[1],stage:'stunt',t:q};
  }
  if(phase<OVERLAY_EXIT_END){
    const q=overlayEase01((phase-OVERLAY_STUNT_END)/(OVERLAY_EXIT_END-OVERLAY_STUNT_END));
    const p0=overlayStuntPoint(def,index,1);
    const pre=overlayStuntPoint(def,index,0.985);
    const tangent=[p0[0]-pre[0],p0[1]-pre[1]];
    const c1=[p0[0]+tangent[0]*7,p0[1]+tangent[1]*7];
    const exit=def.exits[index];
    const c2=[lerp(p0[0],exit[0],0.68),lerp(p0[1],exit[1],0.68)];
    const p=overlayBezierPoint(p0,c1,c2,exit,q);
    return {visible:true,x:p[0],y:p[1],stage:'exit',t:q};
  }
  return {visible:false,x:def.exits[index][0],y:def.exits[index][1],stage:'blank',t:1};
}
function overlayAngleForMotion(def,index,phase,w,h){
  const here=overlayRoutinePosition(def,index,phase);
  if(here.stage==='march') return {rotation:0,bank:0,dy:0};
  if(here.stage==='settle'){
    // Smoothly level the bird after the fast wave-style flight-in instead of
    // snapping upright. Sample its own final entry frames, not the group gate.
    const timing=overlayEntryTiming(index);
    const edge=Math.max(timing.delay,timing.end-OVERLAY_FRAME_PHASE*0.20);
    const before=overlayRoutinePosition(def,index,Math.max(timing.delay,edge-OVERLAY_FRAME_PHASE*1.5));
    const at=overlayRoutinePosition(def,index,Math.min(timing.end-1e-6,edge));
    let dx=(at.x-before.x)*w,dy=(at.y-before.y)*h;
    if(Math.hypot(dx,dy)<0.001){ dx=0; dy=-1; }
    const incoming=Math.atan2(dy,dx)+Math.PI/2;
    return {rotation:incoming*(1-(here.t||0)),bank:0,dy:0};
  }
  const eps=0.0015;
  const a=overlayRoutinePosition(def,index,Math.max(0,phase-eps));
  const b=overlayRoutinePosition(def,index,Math.min(OVERLAY_EXIT_END-0.0001,phase+eps));
  let dx=(b.x-a.x)*w,dy=(b.y-a.y)*h;
  if(!Number.isFinite(dx)||!Number.isFinite(dy)||Math.hypot(dx,dy)<0.001){ dx=0; dy=-1; }
  const rotation=Math.atan2(dy,dx)+Math.PI/2;
  const c=overlayRoutinePosition(def,index,Math.max(0,phase-eps*3));
  const d=overlayRoutinePosition(def,index,Math.min(OVERLAY_EXIT_END-0.0001,phase+eps*3));
  const h0=Math.atan2((here.y-c.y)*h,(here.x-c.x)*w);
  const h1=Math.atan2((d.y-here.y)*h,(d.x-here.x)*w);
  const turn=angleDelta(h0,h1);
  return {rotation,bank:clamp(turn*1.7,-0.22,0.22),dy};
}
function clearOverlayBirdScene(scene){
  if(!scene||!scene.canvas) return;
  const info=sizeOverlayBirdCanvas(scene.canvas);
  if(info) info.ctx2d.clearRect(0,0,info.rect.width,info.rect.height);
  scene.active=false;
}
function renderOverlayBirdRoutine(scene,ctx2d,w,h,groupNumber,localElapsed){
  if(localElapsed<0 || localElapsed>=OVERLAY_ROUTINE_MS) return;
  const routineIndex=(groupNumber+scene.startRoutine)%OVERLAY_BIRD_ROUTINES.length;
  const def=OVERLAY_BIRD_ROUTINES[routineIndex];
  const phase=localElapsed/OVERLAY_ROUTINE_MS;
  for(let i=0;i<def.count;i++){
    const pos=overlayRoutinePosition(def,i,phase);
    if(!pos.visible) continue;
    const motion=overlayAngleForMotion(def,i,phase,w,h);
    const bird=scene.birds[i];
    bird.x=pos.x*w;
    bird.y=pos.y*h;
    bird.variant=def.variant;
    let scaleMul=1;
    if(pos.stage==='enter'){
      // The zoom now happens over the same very short interval as the real
      // wave fly-in instead of taking several seconds.
      const z=0.42+0.58*easeOutBack(pos.t||0);
      scaleMul=clamp(z,0.42,1.10);
    }else if(pos.stage==='settle'){
      scaleMul=1.0;
    }else if(pos.stage==='stunt' || pos.stage==='exit'){
      scaleMul=1+0.035*Math.sin((localElapsed+i*127+groupNumber*83)/620);
    }
    bird.scale=def.scale*scaleMul;
    bird.rotation=motion.rotation;
    bird.bank=motion.bank;
    if(pos.stage==='march') bird.pose='march';
    else bird.pose=(motion.dy>2.0 && pos.stage!=='settle')?'dive':'flight';
    drawOverlayBird(ctx2d,bird,localElapsed+i*41+groupNumber*137);
  }
}
function renderOverlayBirdScene(scene,timeMs){
  if(!scene||!scene.canvas) return;
  if(!scene.active){ scene.active=true; scene.startedAt=timeMs; }
  const sized=sizeOverlayBirdCanvas(scene.canvas);
  if(!sized) return;
  const {ctx2d,rect}=sized;
  const w=rect.width,h=rect.height;
  ctx2d.clearRect(0,0,w,h);
  const elapsed=Math.max(0,timeMs-scene.startedAt);
  const newestGroup=Math.floor(elapsed/OVERLAY_ROUTINE_INTERVAL_MS);
  ctx2d.globalAlpha=0.98;

  // The outgoing squadron is drawn first, then the incoming one. With a
  // 7-second launch interval and a 9.8-second routine there is roughly
  // 2.8 seconds of overlap: the next formation can zoom in while the previous
  // group is still performing its final break and peel-away.
  for(const groupNumber of [newestGroup-1,newestGroup]){
    if(groupNumber<0) continue;
    const localElapsed=elapsed-groupNumber*OVERLAY_ROUTINE_INTERVAL_MS;
    renderOverlayBirdRoutine(scene,ctx2d,w,h,groupNumber,localElapsed);
  }
}
function renderOverlayBirds(nowMs){
  if(captureGate && !captureGate.hidden){
    renderOverlayBirdScene(overlayBirdScenes.capture,nowMs);
    clearOverlayBirdScene(overlayBirdScenes.title);
    clearOverlayBirdScene(overlayBirdScenes.gameover);
    return;
  }
  clearOverlayBirdScene(overlayBirdScenes.capture);
  if(state==='title'){
    renderOverlayBirdScene(overlayBirdScenes.title,nowMs);
    clearOverlayBirdScene(overlayBirdScenes.gameover);
  }else if(state==='gameover'){
    renderOverlayBirdScene(overlayBirdScenes.gameover,nowMs);
    clearOverlayBirdScene(overlayBirdScenes.title);
  }else{
    clearOverlayBirdScene(overlayBirdScenes.title);
    clearOverlayBirdScene(overlayBirdScenes.gameover);
  }
}
/* ---------- main loop ---------- */
function loop(now){
  let dt=(now-last)/1000; last=now;
  dt=Math.min(dt,0.05);
  if(state==='playing'){
    update(dt);
  } else if(state==='roundclear'){
    transitionTimer-=dt;
    updateAmbient(dt);
    if(transitionTimer<=0){ spawnRound(); state='playing'; }
  } else if(state==='paused'){
    /* frozen */
  } else {
    updateAmbient(dt);
  }
  render();
  renderOverlayBirds(now||performance.now());
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
